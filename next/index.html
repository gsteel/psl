$receiver->tryReceive(); \/\/ throws EmptyChannelException -- nothing left\n} catch (Channel\\Exception\\EmptyChannelException) {\n    IO\\write_line('Channel is empty, cannot receive');\n}\n```\n\n### Closing Channels\n\nClosing a channel signals that no more messages will be sent. Messages already in the channel can still be received:\n\n```php\nuse Psl\\Channel;\nuse Psl\\IO;\n\n[$receiver, $sender] = Channel\\bounded(10);\n\n$sender->send('last message');\n$sender->close();\n\n$sender->isClosed(); \/\/ true\n$receiver->receive(); \/\/ 'last message'\n\ntry {\n    $receiver->receive(); \/\/ throws ClosedChannelException -- no more messages\n} catch (Channel\\Exception\\ClosedChannelException) {\n    IO\\write_line('Channel is closed, cannot receive more messages');\n}\n```\n\n### Inspecting Channel State\n\n```php\nuse Psl\\Channel;\n\n[$receiver, $sender] = Channel\\bounded(5);\n\n$sender->getCapacity(); \/\/ 5\n$sender->count(); \/\/ 0 (number of messages currently in the channel)\n$sender->isEmpty(); \/\/ true\n$sender->isFull(); \/\/ false\n$sender->isClosed(); \/\/ false\n```\n\nFor unbounded channels, `getCapacity()` returns `null` and `isFull()` always returns `false`.\n\n### Producer-Consumer Pattern\n\n```php\nuse Psl\\Async;\nuse Psl\\Channel;\nuse Psl\\IO;\n\n\/**\n * @var Channel\\ReceiverInterface<string> $receiver\n * @var Channel\\SenderInterface<string> $sender\n *\/\n[$receiver, $sender] = Channel\\bounded(100);\n\n\/\/ Producer\nAsync\\run(function () use ($sender): void {\n    foreach (['job-1', 'job-2', 'job-3'] as $job) {\n        $sender->send($job);\n    }\n\n    $sender->close();\n});\n\n\/\/ Consumer\nAsync\\run(function () use ($receiver): void {\n    while (!$receiver->isClosed() || !$receiver->isEmpty()) {\n        $job = $receiver->receive();\n        IO\\write_error_line('Processing: %s', $job);\n    }\n});\n\nAsync\\later();\n```\n\n### Fan-Out: Multiple Consumers\n\nDistribute work across several consumers by sharing the receiver:\n\n```php\nuse Psl\\Async;\nuse Psl\\Channel;\nuse Psl\\IO;\n\n\/**\n * @var Channel\\ReceiverInterface<string> $receiver\n * @var Channel\\SenderInterface<string> $sender\n *\/\n[$receiver, $sender] = Channel\\bounded(100);\n\n\/\/ Spawn 3 worker consumers\nfor ($i = 0; $i < 3; $i++) {\n    Async\\run(function () use ($receiver, $i): void {\n        while (!$receiver->isClosed() || !$receiver->isEmpty()) {\n            $task = $receiver->receive();\n            IO\\write_error_line('Worker %d processing: %s', $i, $task);\n        }\n    });\n}\n\n\/\/ Feed tasks\n$tasks = ['task-a', 'task-b', 'task-c', 'task-d', 'task-e'];\nforeach ($tasks as $task) {\n    $sender->send($task);\n}\n\n$sender->close();\n\nAsync\\later();\n```\n\n### Cancellation\n\nBoth `send()` and `receive()` accept an optional `CancellationTokenInterface`. This is useful when you don't want to wait indefinitely for a message or for space in a bounded channel:\n\n```php\nuse Psl\\Async;\nuse Psl\\Channel;\nuse Psl\\DateTime\\Duration;\nuse Psl\\IO;\n\n\/** @var Channel\\ReceiverInterface<string> $receiver *\/\n\/** @var Channel\\SenderInterface<string> $sender *\/\n[$receiver, $sender] = Channel\\bounded(1);\n\n\/\/ Producer sends one message then stops\nAsync\\run(static function () use ($sender): void {\n    $sender->send('hello');\n    Async\\sleep(Duration::seconds(5));\n    $sender->send('never arrives');\n})->ignore();\n\n\/\/ Consumer receives with a timeout\n$token = new Async\\TimeoutCancellationToken(Duration::milliseconds(50));\n\n$first = $receiver->receive($token);\nIO\\write_line('Received: %s', $first);\n\ntry {\n    \/\/ This will be cancelled - no second message within 50ms\n    $receiver->receive($token);\n} catch (Async\\Exception\\CancelledException) {\n    IO\\write_line('Timed out waiting for next message');\n}\n```\n\n`trySend()` and `tryReceive()` are non-blocking and don't need cancellation tokens -- they throw immediately if the channel is full or empty.\n\n## When to Use Channel\n\n- **Decoupling producers and consumers** -- The sender doesn't need to know who processes the messages\n- **Backpressure** -- Bounded channels naturally slow down fast producers when consumers can't keep up\n- **Async coordination** -- Pass data between concurrent tasks without shared mutable state\n\nSee [src\/Psl\/Channel\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/channel\/src\/Psl\/Channel\/) for the full API.\n","promise":"# Promise\n\nThe `Promise` component provides a promise interface for deferred computations. A promise represents a value that will be available in the future -- either resolved with a success value or rejected with an exception. You attach callbacks to react to the outcome without blocking.\n\n## Design\n\n`PromiseInterface<T>` defines four methods for composing asynchronous operations:\n\n- **`then()`** -- Handle both success and failure in one call\n- **`map()`** -- Transform the resolved value\n- **`catch()`** -- Recover from rejection\n- **`always()`** -- Run cleanup logic regardless of outcome\n\nEvery method returns a new `PromiseInterface`, so you can chain them into pipelines.\n\n## Usage\n\n### Transforming a Resolved Value\n\n`map()` applies a function to the resolved value. If the promise is rejected, the callback is skipped and the rejection propagates:\n\n```php\nuse Psl\\Async;\nuse Psl\\Str;\n\n\/** @var Async\\Awaitable<string> $promise *\/\n$promise = Async\\run(static fn() => 'hello');\n\n$upper = $promise->map(fn(string $body) => Str\\uppercase($body));\n\/\/ If $promise resolves with 'hello', $upper resolves with 'HELLO'\n\/\/ If $promise is rejected, $upper is also rejected with the same exception\n\n$upper->await(); \/\/ 'HELLO'\n```\n\n### Recovering from Failure\n\n`catch()` attaches a callback that is only invoked when the promise is rejected. The returned value becomes the new resolved value:\n\n```php\nuse Psl\\Async;\n\n\/** @var Async\\Awaitable<string> $promise *\/\n$promise = Async\\run(static fn() => throw new Exception('oh no'));\n\n$safe = $promise->catch(fn(Throwable $_) => 'default response');\n\/\/ If $promise is rejected, $safe resolves with 'default response'\n\/\/ If $promise succeeds, $safe resolves with the original value\n\n$safe->await(); \/\/ 'default response'\n```\n\n### Handling Both Cases with then()\n\n`then()` is a shortcut for chaining `map()` and `catch()`:\n\n```php\nuse Psl\\Async;\n\n\/** @var Async\\Awaitable<string> $promise *\/\n$promise = Async\\run(static fn() => 'hello world');\n\n$result = $promise->then(fn(string $value) => ['value' => $value], fn(\\Throwable $e) => ['error' => $e->getMessage()]);\n\n$result->await(); \/\/ ['value' => 'hello world']\n```\n\nThis is equivalent to:\n\n```php\nuse Psl\\Async;\n\n\/** @var Async\\Awaitable<string> $promise *\/\n$promise = Async\\run(static fn() => 'hello world');\n\n$result = $promise->map(fn(string $value) => ['value' => $value])->catch(fn(\\Throwable $e) => ['error' =>\n    $e->getMessage()]);\n\n$result->await(); \/\/ ['value' => 'hello world']\n```\n\n### Cleanup with always()\n\n`always()` runs a callback when the promise settles, regardless of whether it resolved or was rejected. The promise's value passes through unchanged (unless the callback throws):\n\n```php\nuse Psl\\Async;\nuse Psl\\IO;\nuse Psl\\Str;\n\n\/** @var Async\\Awaitable<string> $promise *\/\n$promise = Async\\run(static fn() => 'hello');\n\n$promise\n    ->map(fn(string $content) => Str\\uppercase($content))\n    ->always(fn() => IO\\write_error_line('cleanup complete'))\n    ->await();\n```\n\n### Building Pipelines\n\nBecause every method returns a new promise, you can compose multi-step async workflows:\n\n```php\nuse Psl\\Async;\nuse Psl\\IO;\nuse Psl\\Json;\nuse Psl\\Type;\n\n\/** @var Async\\Awaitable<string> $promise *\/\n$promise = Async\\run(static fn() => '{\"name\": \"psl\", \"version\": \"3.0\"}');\n\n$processed = $promise\n    ->map(fn(string $raw) => Json\\decode($raw))\n    ->map(\n        fn(mixed $data) => Type\\shape([\n            'name' => Type\\string(),\n            'version' => Type\\string(),\n        ])->coerce($data),\n    )\n    ->map(fn(array $valid) => ['project' => $valid['name'], 'v' => $valid['version']])\n    ->catch(fn(\\Throwable $e) => ['error' => $e->getMessage()])\n    ->always(fn() => IO\\write_error_line('pipeline complete'));\n\n$processed->await();\n```\n\n## When to Use Promise\n\n- **Async operations** -- React to the outcome of concurrent tasks\n- **Pipeline composition** -- Chain transformations that may fail at any step\n- **Error boundaries** -- Catch and recover from failures at specific points in the chain\n- **Resource cleanup** -- Use `always()` to guarantee cleanup runs\n\nSee [src\/Psl\/Promise\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/promise\/src\/Psl\/Promise\/) for the full API.\n","collection":"# Collection\n\nThe `Collection` component provides generic, object-oriented collection types as an alternative to PHP arrays. Collections are strongly typed, support generics via doc-block annotations, and offer a rich API for filtering, mapping, and slicing.\n\nEach collection type comes in two variants: an immutable (`readonly`) version and a mutable version.\n\n| Type | Immutable | Mutable |\n|------|-----------|---------|\n| Ordered list | `Vector<T>` | `MutableVector<T>` |\n| Key-value map | `Map<Tk, Tv>` | `MutableMap<Tk, Tv>` |\n| Unique values | `Set<T>` | `MutableSet<T>` |\n\n## Vector\n\nA `Vector` is an ordered, integer-indexed sequence of values -- similar to a PHP `list<T>`.\n\n```php\nuse Psl\\Collection\\MutableVector;\nuse Psl\\Collection\\Vector;\nuse Psl\\Str;\n\n\/\/ Immutable vector\n$names = Vector::fromArray(['Alice', 'Bob', 'Charlie']);\n$names->count(); \/\/ 3\n$names->at(0); \/\/ 'Alice'\n$names->first(); \/\/ 'Alice'\n$names->last(); \/\/ 'Charlie'\n$names->toArray(); \/\/ ['Alice', 'Bob', 'Charlie']\n\n\/\/ Filtering and mapping return new immutable vectors\n$short = $names->filter(fn(string $n): bool => Str\\length($n) <= 3);\n$upper = $names->map(Str\\uppercase(...));\n\n\/**\n * Mutable vector -- supports in-place modification\n *\n * @var MutableVector<string> $tasks\n *\/\n$tasks = MutableVector::fromArray(['eat', 'sleep']);\n$tasks->add('code');\n$tasks->remove(0); \/\/ removes 'eat', re-indexes\n$tasks->toArray(); \/\/ ['sleep', 'code']\n```\n\n## Map\n\nA `Map` is an ordered collection of key-value pairs. Keys must be `int` or `string`.\n\n```php\nuse Psl\\Collection\\Map;\nuse Psl\\Collection\\MutableMap;\n\n\/**\n * Immutable map\n *\n * @var Map<string, int> $scores\n *\/\n$scores = Map::fromArray(['alice' => 95, 'bob' => 82, 'charlie' => 91]);\n$scores->at('alice'); \/\/ 95\n$scores->get('unknown'); \/\/ null (no exception)\n$scores->contains('bob'); \/\/ true\n$scores->keys(); \/\/ Vector<string>\n$scores->values(); \/\/ Vector<int>\n\n\/\/ Filter to passing scores\n$passing = $scores->filter(fn(int $s): bool => $s >= 90);\n$passing->toArray(); \/\/ ['alice' => 95, 'charlie' => 91]\n\n\/**\n * Mutable map\n *\n * @var MutableMap<string, string> $config\n *\/\n$config = MutableMap::fromArray(['debug' => 'false']);\n$config->add('version', '2.0'); \/\/ adds or overwrites\n$config->set('debug', 'true'); \/\/ overwrites existing key (throws if missing)\n$config->remove('debug');\n```\n\n## Set\n\nA `Set` stores unique values with no duplicate entries. Values must be `int` or `string` (array-key types).\n\n```php\nuse Psl\\Collection\\MutableSet;\nuse Psl\\Collection\\Set;\n\n\/**\n * A set is a collection of unique values. It can be either mutable or immutable.\n *\n * @var Set<string> $tags\n *\/\n$tags = Set::fromArray(['php', 'psl', 'php']); \/\/ duplicates removed\n$tags->count(); \/\/ 2\n$tags->contains('php'); \/\/ true\n$tags->contains('rust'); \/\/ false\n\n\/**\n * Mutable set -- supports in-place modification\n *\n * @var MutableSet<string> $visited\n *\/\n$visited = MutableSet::fromArray([]);\n$visited->add('page-a');\n$visited->add('page-b');\n$visited->add('page-a'); \/\/ no-op, already present\n$visited->count(); \/\/ 2\n$visited->remove('page-a');\n```\n\n## Common Operations\n\nAll collection types share a consistent API for reading, transforming, and slicing:\n\n```php\nuse Psl\\Collection\\Vector;\n\n$v = Vector::fromArray([10, 20, 30]);\n$v->at(1); \/\/ 20 (throws OutOfBoundsException if missing)\n$v->get(1); \/\/ 20 (returns null if missing)\n$v->linearSearch(20); \/\/ 1 (index of the value)\n\n\/\/ Slicing operations return new collections\n$v = Vector::fromArray([1, 2, 3, 4, 5]);\n$v->take(3)->toArray(); \/\/ [1, 2, 3]\n$v->drop(2)->toArray(); \/\/ [3, 4, 5]\n$v->slice(1, 3)->toArray(); \/\/ [2, 3, 4]\n$v->chunk(2); \/\/ Vector<Vector<int>> of [[1,2], [3,4], [5]]\n```\n\nAll collections implement `IteratorAggregate` for use in `foreach`, and `JsonSerializable` for JSON encoding. Maps always serialize as JSON objects (`{}`), vectors and sets as JSON arrays (`[]`).\n\nMutable collections also implement `ArrayAccess`:\n\n```php\nuse Psl\\Collection\\MutableVector;\n\n\/**\n * @var MutableVector<int> $v\n *\/\n$v = MutableVector::fromArray([10, 20, 30]);\n$v[] = 40; \/\/ appends\n$v[1] = 99; \/\/ sets index 1\nunset($v[0]); \/\/ removes index 0\n```\n\nSee [src\/Psl\/Collection\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/collection\/src\/Psl\/Collection\/) for the full API.\n","data-structure":"# DataStructure\n\nThe `DataStructure` component provides three classic data structures: `Queue` (FIFO), `Stack` (LIFO), and `PriorityQueue`. They are generic, type-safe, and offer a consistent API with both safe and throwing access methods.\n\n## Queue (FIFO)\n\nA queue processes items in first-in, first-out order. Items are added to the back and removed from the front:\n\n```php\nuse Psl\\DataStructure;\n\n$queue = new DataStructure\\Queue();\n\n$queue->enqueue('first');\n$queue->enqueue('second');\n$queue->enqueue('third');\n\n$queue->count(); \/\/ 3\n\n$queue->peek(); \/\/ \"first\" (does not remove)\n$queue->pull(); \/\/ \"first\" (removes and returns)\n$queue->dequeue(); \/\/ \"second\" (removes and returns, throws if empty)\n```\n\nUse `pull()` when an empty queue is a normal condition (it returns `null`). Use `dequeue()` when an empty queue is a bug (it throws `UnderflowException`).\n\n## Stack (LIFO)\n\nA stack processes items in last-in, first-out order. Items are added to and removed from the top:\n\n```php\nuse Psl\\DataStructure;\n\n$stack = new DataStructure\\Stack();\n\n$stack->push('first');\n$stack->push('second');\n$stack->push('third');\n\n$stack->count(); \/\/ 3\n\n$stack->peek(); \/\/ \"third\" (does not remove)\n$stack->pull(); \/\/ \"third\" (removes and returns)\n$stack->pop(); \/\/ \"second\" (removes and returns, throws if empty)\n```\n\nUse `pull()` for safe access (returns `null` if empty) and `pop()` when emptiness is unexpected (throws `UnderflowException`).\n\n## PriorityQueue\n\nA priority queue dequeues items with the highest priority first. Items with equal priority are dequeued in FIFO order:\n\n```php\nuse Psl\\DataStructure;\n\n$pq = new DataStructure\\PriorityQueue();\n\n$pq->enqueue('low-priority task', priority: 1);\n$pq->enqueue('high-priority task', priority: 10);\n$pq->enqueue('medium-priority task', priority: 5);\n$pq->enqueue('another high-priority task', priority: 10);\n\n$pq->dequeue(); \/\/ \"high-priority task\" (priority 10, enqueued first)\n$pq->dequeue(); \/\/ \"another high-priority task\" (priority 10, enqueued second)\n$pq->dequeue(); \/\/ \"medium-priority task\" (priority 5)\n$pq->dequeue(); \/\/ \"low-priority task\" (priority 1)\n```\n\nIf no priority is specified, items default to priority `0`.\n\n## Common API\n\nAll three structures implement `Countable` and share a consistent pattern:\n\n| Method | Queue | Stack | PriorityQueue |\n|--------|-------|-------|---------------|\n| Add item | `enqueue($item)` | `push($item)` | `enqueue($item, $priority)` |\n| Peek at next | `peek()` | `peek()` | `peek()` |\n| Remove (safe) | `pull()` | `pull()` | `pull()` |\n| Remove (throws) | `dequeue()` | `pop()` | `dequeue()` |\n| Count items | `count()` | `count()` | `count()` |\n\n- `peek()` returns the next item without removing it, or `null` if empty\n- `pull()` removes and returns the next item, or `null` if empty\n- `dequeue()` \/ `pop()` removes and returns the next item, or throws `UnderflowException` if empty\n\nSee [src\/Psl\/DataStructure\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/data-structure\/src\/Psl\/DataStructure\/) for the full API.\n","graph":"# Graph\n\nThe `Graph` component provides immutable graph data structures and algorithms for working with directed and undirected graphs.\n\nGraphs are fundamental data structures for modeling relationships and networks. This component supports directed and undirected graphs, weighted and unweighted edges, traversal (BFS, DFS), shortest path finding, topological sorting, and cycle detection. All operations are immutable and return new graph instances.\n\n## Design\n\nThe Graph component uses an adjacency list representation:\n- **`DirectedGraph<TNode, TWeight>`**: Directed graph with edges from node A to node B\n- **`UndirectedGraph<TNode, TWeight>`**: Undirected graph with bidirectional edges\n- **`Edge<TNode, TWeight>`**: Represents an edge with optional weight\n- **Flexible node types**: Nodes can be any type (objects, arrays, scalars, resources, etc.)\n\n## Usage\n\n### Building Graphs\n\n```php\nuse Psl\\Graph;\n\n\/\/ Directed graph\n$graph = Graph\\directed();\n$graph = Graph\\add_node($graph, 'A');\n$graph = Graph\\add_edge($graph, 'A', 'B');\n$graph = Graph\\add_edge($graph, 'B', 'C');\n\n\/\/ Undirected graph (edges go in both directions)\n$graph = Graph\\undirected();\n$graph = Graph\\add_edge($graph, 'A', 'B'); \/\/ adds edges in both directions\n\n\/\/ Weighted edges\n$graph = Graph\\directed();\n$graph = Graph\\add_edge($graph, 'A', 'B', 5);\n$graph = Graph\\add_edge($graph, 'A', 'C', 10);\n$graph = Graph\\add_edge($graph, 'B', 'C', 2);\n```\n\n### Traversal\n\n```php\nuse Psl\\Graph;\n\n$graph = Graph\\directed();\n$graph = Graph\\add_edge($graph, 'A', 'B');\n$graph = Graph\\add_edge($graph, 'A', 'C');\n$graph = Graph\\add_edge($graph, 'B', 'D');\n\nGraph\\bfs($graph, 'A'); \/\/ ['A', 'B', 'C', 'D'] -- breadth-first\nGraph\\dfs($graph, 'A'); \/\/ ['A', 'B', 'D', 'C'] -- depth-first\n```\n\n### Shortest Path\n\nFor unweighted graphs, BFS is used. For weighted graphs, Dijkstra's algorithm is used.\n\n```php\nuse Psl\\Graph;\n\n\/** @var Graph\\DirectedGraph<string, int> $graph *\/\n$graph = Graph\\directed();\n$graph = Graph\\add_edge($graph, 'NYC', 'Boston', 215);\n$graph = Graph\\add_edge($graph, 'NYC', 'Philadelphia', 95);\n$graph = Graph\\add_edge($graph, 'Philadelphia', 'Boston', 310);\n\n$path = Graph\\shortest_path($graph, 'NYC', 'Boston');\n\/\/ ['NYC', 'Boston'] (cost: 215, shorter than via Philadelphia)\n\n\/**\n * For non-integer weights, use shortest_path_by with a converter\n *\n * @var Graph\\DirectedGraph<string, float> $graph\n *\/\n$graph = Graph\\directed();\n$graph = Graph\\add_edge($graph, 'A', 'B', 1.5);\n$graph = Graph\\add_edge($graph, 'B', 'C', 2.3);\n$path = Graph\\shortest_path_by($graph, 'A', 'C', fn(float $w): int => (int) ($w * 1000));\n```\n\n### Cycle Detection and Topological Sort\n\n```php\nuse Psl\\Graph;\n\n\/\/ Topological sort for DAGs (dependency ordering)\n$graph = Graph\\directed();\n$graph = Graph\\add_edge($graph, 'libc', 'gcc');\n$graph = Graph\\add_edge($graph, 'gcc', 'app');\n$graph = Graph\\add_edge($graph, 'libc', 'app');\n\n$buildOrder = Graph\\topological_sort($graph);\n\/\/ ['libc', 'gcc', 'app']\n\n\/\/ Cycle detection\n$graph = Graph\\directed();\n$graph = Graph\\add_edge($graph, 'A', 'B');\n$graph = Graph\\add_edge($graph, 'B', 'C');\n$graph = Graph\\add_edge($graph, 'C', 'A');\n\nGraph\\has_cycle($graph); \/\/ true\n```\n\n### Object Nodes\n\nNodes can be any type, including objects:\n\n```php\nuse Psl\\Graph;\n\nclass Task\n{\n    public function __construct(\n        public readonly string $name,\n        public readonly int $duration,\n    ) {}\n}\n\n$graph = Graph\\directed();\n$compile = new Task('compile', 5);\n$test = new Task('test', 3);\n$deploy = new Task('deploy', 2);\n\n$graph = Graph\\add_edge($graph, $compile, $test);\n$graph = Graph\\add_edge($graph, $test, $deploy);\n\n$executionOrder = Graph\\topological_sort($graph);\n\n\/\/ [$compile, $test, $deploy]\n```\n\n## Use Cases\n\n- **Dependency Resolution**: Topological sort for build systems, package managers\n- **Route Finding**: Shortest path for navigation, network routing\n- **Social Networks**: Friend relationships, recommendations\n- **State Machines**: Transitions between states\n- **Data Flow**: Pipeline dependencies, task scheduling\n\nSee [src\/Psl\/Graph\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/graph\/src\/Psl\/Graph\/) for the full API.\n","range":"# Range\n\nThe `Range` component provides a way to create a range of integer values.\n\nRanges represent sets of integer values with optional lower and upper bounds. They support containment checks, iteration, and bound manipulation.\n\n## Usage\n\n### Creating Ranges\n\nThere are four types of ranges, created with constructor functions:\n\n```php\nuse Psl\\Range;\n\n$range = Range\\from(0); \/\/ 0..   (from 0 to infinity)\n$range = Range\\to(10); \/\/ ..10  (up to 10, exclusive)\n$range = Range\\to(10, true); \/\/ ..=10 (up to 10, inclusive)\n$range = Range\\between(0, 10); \/\/ 0..10 (from 0 to 10, exclusive)\n$range = Range\\between(0, 10, true); \/\/ 0..=10 (from 0 to 10, inclusive)\n$range = Range\\full(); \/\/ ..    (all integers)\n```\n\n### Containment Checks\n\nAll range types support `contains()`:\n\n```php\nuse Psl\\Range;\n\n$range = Range\\between(0, 10);\n$range->contains(5); \/\/ true\n$range->contains(100); \/\/ false\n\n$range = Range\\from(0);\n$range->contains(5); \/\/ true\n$range->contains(100); \/\/ true\n\n$range = Range\\full();\n$range->contains(5); \/\/ true\n$range->contains(100); \/\/ true\n```\n\n### Iterating Over Ranges\n\nRanges with a lower bound (`FromRange` and `BetweenRange`) are iterable:\n\n```php\nuse Psl\\Range;\n\n$range = Range\\between(0, 5);\n\n$range = Range\\between(0, 5, true);\n\n\/\/ FromRange is iterable but infinite -- use with care\n$range = Range\\from(0);\nforeach ($range as $value) {\n    \/\/ $value is 0, 1, 2, 3, ...\n    if ($value > 100) {\n        break;\n    }\n}\n```\n\n### Manipulating Bounds\n\nRanges can be combined with new bounds to create different range types:\n\n```php\nuse Psl\\Range;\n\n\/\/ Add an upper bound to a FromRange\n$from = Range\\from(0);\n$between = $from->withUpperBoundInclusive(10);\n\/\/ Now a BetweenRange: 0..=10\n\n\/\/ Remove the lower bound\n$to = $between->withoutLowerBound();\n\/\/ Now a ToRange: ..=10\n\n\/\/ Add a lower bound to a ToRange\n$between = $to->withLowerBound(5);\n\n\/\/ Now a BetweenRange: 5..=10\n```\n\nSee [src\/Psl\/Range\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/range\/src\/Psl\/Range\/) for the full API.\n","tree":"# Tree\n\nThe `Tree` component provides immutable tree data structures and operations for hierarchical data manipulation.\n\nTrees are fundamental data structures for representing hierarchical relationships. This component provides immutable tree nodes (`LeafNode` and `TreeNode`), pure constructor functions, functional operations (map, filter, reduce, fold), tree traversal algorithms, and search utilities.\n\n## Design\n\nThe Tree component has a simple design:\n- **`NodeInterface<T>`**: Base interface with `getValue(): T`\n- **`LeafNode<T>`**: Leaf nodes (no children)\n- **`TreeNode<T>`**: Tree nodes with `getChildren(): list<NodeInterface<T>>`\n\nAll tree operations are immutable -- they return new trees rather than modifying existing ones.\n\n## Usage\n\n### Building Trees\n\nUse the `tree()` and `leaf()` constructor functions to build trees:\n\n```php\nuse Psl\\Tree;\n\n$tree = Tree\\tree('root', [\n    Tree\\leaf('child1'),\n    Tree\\leaf('child2'),\n    Tree\\tree('child3', [\n        Tree\\leaf('grandchild1'),\n    ]),\n]);\n```\n\nYou can also build trees from nested arrays or flat lists with parent references, which is especially useful for database records:\n\n```php\nuse Psl\\Tree;\n\n\/\/ From a nested array\n$tree = Tree\\from_array([\n    'value' => 'root',\n    'children' => [\n        ['value' => 'child1', 'children' => []],\n        ['value' => 'child2', 'children' => []],\n    ],\n]);\n\n\/\/ From database records with parent_id relationships\n$records = [\n    ['id' => 1, 'name' => 'Root', 'parent_id' => null],\n    ['id' => 2, 'name' => 'Child A', 'parent_id' => 1],\n    ['id' => 3, 'name' => 'Child B', 'parent_id' => 1],\n    ['id' => 4, 'name' => 'Grandchild', 'parent_id' => 2],\n];\n\n$tree = Tree\\from_list(\n    $records,\n    fn($record) => $record['id'],\n    fn($record) => $record['parent_id'],\n    fn($record) => $record['name'],\n);\n```\n\n### Transforming Trees\n\n```php\nuse Psl\\Math;\nuse Psl\\Tree;\n\n$tree = Tree\\tree(1, [Tree\\leaf(2), Tree\\leaf(3)]);\n\n\/\/ Map: apply a function to every node value\n$doubled = Tree\\map($tree, fn(int $x): int => $x * 2);\n\/\/ Result: tree(2, [leaf(4), leaf(6)])\n\n\/\/ Filter: keep only nodes matching a predicate\n$filtered = Tree\\filter($tree, fn(int $x): bool => $x >= 2);\n\/\/ Result: tree(2, [leaf(3)]) -- root must match or null is returned\n\n\/\/ Reduce: collapse the tree to a single value (pre-order)\n$sum = Tree\\reduce($tree, fn(int $acc, int $x): int => $acc + $x, 0);\n\/\/ Result: 6\n\n\/\/ Fold: post-order fold with access to children results\n$result = Tree\\fold(\n    $tree,\n    \/**\n     * @param int $value\n     * @param list<int> $children\n     * @return int\n     *\/\n    fn(int $value, array $children): int => $value + Math\\sum($children),\n);\n\n\/\/ Result: 6\n```\n\n### Traversal\n\nThree traversal orders are available:\n\n```php\nuse Psl\\Tree;\n\n$tree = Tree\\tree(1, [Tree\\tree(2, [Tree\\leaf(3)]), Tree\\leaf(4)]);\n\nTree\\pre_order($tree); \/\/ [1, 2, 3, 4] -- root first, then children\nTree\\post_order($tree); \/\/ [3, 2, 4, 1] -- children first, then root\nTree\\level_order($tree); \/\/ [1, 2, 4, 3] -- breadth-first\n```\n\n### Searching and Paths\n\n```php\nuse Psl\\Str;\nuse Psl\\Tree;\n\n$tree = Tree\\tree('a', [\n    Tree\\tree('b', [Tree\\leaf('c')]),\n    Tree\\leaf('d'),\n]);\n\n\/\/ Find the path from root to a matching node\n$path = Tree\\path_to($tree, fn($x) => $x === 'c');\n\/\/ Result: ['a', 'b', 'c']\n\n\/\/ Navigate by index path\nTree\\at_index($tree, [0, 0]); \/\/ 'c'\nTree\\at_index($tree, [1]); \/\/ 'd'\n\n\/\/ Search for values\nTree\\find($tree, fn($x) => $x === 'c'); \/\/ 'c'\nTree\\contains($tree, 'd'); \/\/ true\nTree\\any($tree, fn($x) => $x === 'b'); \/\/ true\nTree\\all($tree, fn($x) => Str\\length($x) === 1); \/\/ true\n```\n\n### Custom Serialization\n\nThe `traverse()` function gives you full control over how the tree is serialized:\n\n```php\nuse Psl\\Iter;\nuse Psl\\Str;\nuse Psl\\Tree;\n\n$tree = Tree\\tree('root', [Tree\\leaf('a'), Tree\\leaf('b')]);\n\n\/\/ Build a custom string representation\n$result = Tree\\traverse(\n    $tree,\n    \/**\n     * @param non-empty-string $value\n     * @param Closure(): list<non-empty-string> $traverse\n     *\n     * @return non-empty-string\n     *\/\n    function (string $value, Closure $traverse): string {\n        $children = $traverse();\n        return Iter\\is_empty($children) ? $value : $value . '(' . Str\\join($children, ',') . ')';\n    },\n);\n\n\/\/ Result: 'root(a,b)'\n```\n\nSee [src\/Psl\/Tree\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/tree\/src\/Psl\/Tree\/) for the full API.\n","binary":"# Binary\n\nThe `Binary` component provides typed functions and classes for encoding and decoding binary data, replacing PHP's cryptic `pack()` \/ `unpack()` format strings with a clear, type-safe API. It supports explicit endianness control via the `Endianness` enum.\n\n## Why Use This?\n\nPHP's `pack()` and `unpack()` rely on single-character format codes (`N`, `v`, `J`, `P`, etc.) that are hard to remember and easy to misuse. PSL's Binary component provides:\n\n- **Named functions** like `encode_u32()` and `decode_i16()` instead of cryptic format strings.\n- **Explicit endianness** via an enum instead of remembering which format code is big-endian vs little-endian.\n- **Type-safe validation** that throws on overflow or underflow.\n- **An immutable Writer** for building binary messages in memory.\n- **A cursor-based Reader** for parsing binary data from a string.\n- **Handle-based Writer and Reader** for streaming binary data directly to\/from IO handles without buffering.\n\n## One-Shot Functions\n\nFor encoding or decoding individual values, use the standalone functions. Each function validates its input and throws on error.\n\n```php\nuse Psl\\Binary;\nuse Psl\\Binary\\Endianness;\nuse Psl\\IO;\n\n\/\/ Encode an unsigned 16-bit integer in big-endian (network byte order)\n$bytes = Binary\\encode_u16(0x0102, Endianness::Big);\nIO\\write_line('u16 big-endian bytes: %s', bin2hex($bytes)); \/\/ 0102\n\n\/\/ Decode it back\n$value = Binary\\decode_u16($bytes, Endianness::Big);\nIO\\write_line('Decoded u16: 0x%04X', $value); \/\/ 0x0102\n\n\/\/ Encode a signed 32-bit integer in little-endian\n$bytes = Binary\\encode_i32(-1, Endianness::Little);\nIO\\write_line('i32 little-endian bytes: %s', bin2hex($bytes)); \/\/ ffffffff\n\n\/\/ Decode it back\n$value = Binary\\decode_i32($bytes, Endianness::Little);\nIO\\write_line('Decoded i32: %d', $value); \/\/ -1\n\n\/\/ Encode a 64-bit float\n$bytes = Binary\\encode_f64(3.14, Endianness::Big);\nIO\\write_line('f64 bytes: %s', bin2hex($bytes));\nIO\\write_line('Decoded f64: %f', Binary\\decode_f64($bytes, Endianness::Big)); \/\/ 3.140000\n```\n\n## Writer\n\nThe `Writer` is an immutable builder for binary data. Each method returns a new instance with the appended bytes. Use this when you need the result as a string.\n\n```php\nuse Psl\\Binary\\Endianness;\nuse Psl\\Binary\\Writer;\nuse Psl\\IO;\n\n\/\/ Build a binary protocol message: version(u8) + type(u16) + length(u32) + payload\n\/\/ Writer::default() creates a new Writer with default settings (big-endian)\n$message = Writer::default()\n    ->u8(1) \/\/ protocol version\n    ->u16(0x0042) \/\/ message type\n    ->u32(5) \/\/ payload length\n    ->bytes('Hello') \/\/ payload\n    ->toString();\n\nIO\\write_line('Message hex: %s', bin2hex($message));\n\/\/ 01004200000005 48656c6c6f\n\n\/\/ The Writer is immutable -- each call returns a new instance\n$base = new Writer(endianness: Endianness::Little);\n$a = $base->u16(1)->u16(2);\n$b = $base->u16(3)->u16(4);\n\nIO\\write_line('A: %s', bin2hex($a->toString())); \/\/ 01000200\nIO\\write_line('B: %s', bin2hex($b->toString())); \/\/ 03000400\n\n\/\/ You can also mix endianness per call\n$mixed = new Writer(endianness: Endianness::Big)\n    ->u16(0x0102) \/\/ big-endian (default)\n    ->u16(0x0304, Endianness::Little) \/\/ little-endian override\n    ->toString();\n\nIO\\write_line('Mixed: %s', bin2hex($mixed)); \/\/ 01020403\n```\n\n## Reader\n\nThe `Reader` provides cursor-based sequential reading of binary data from a string. Each read advances the internal cursor.\n\n```php\nuse Psl\\Binary\\Endianness;\nuse Psl\\Binary\\Reader;\nuse Psl\\Binary\\Writer;\nuse Psl\\IO;\n\n\/\/ Build a message, then parse it\n$data = new Writer(endianness: Endianness::Big)\n    ->u8(1) \/\/ version\n    ->u16(0x0042) \/\/ type\n    ->u32(5) \/\/ payload length\n    ->bytes('Hello') \/\/ payload\n    ->toString();\n\n$reader = new Reader($data, Endianness::Big);\n\n$version = $reader->u8();\n$type = $reader->u16();\n$length = $reader->u32();\n$payload = $reader->bytes($length);\n\nIO\\write_line('Version: %d', $version); \/\/ 1\nIO\\write_line('Type: 0x%04X', $type); \/\/ 0x0042\nIO\\write_line('Length: %d', $length); \/\/ 5\nIO\\write_line('Payload: %s', $payload); \/\/ Hello\n\n\/\/ Track cursor position\nIO\\write_line('Cursor: %d \/ %d', $reader->cursor(), $reader->length()); \/\/ 12 \/ 12\nIO\\write_line('Remaining: %d', $reader->remaining()); \/\/ 0\nIO\\write_line('Consumed: %s', $reader->isConsumed() ? 'yes' : 'no'); \/\/ yes\n```\n\n## Handle-Based IO\n\n`HandleWriter` and `HandleReader` operate directly on `IO\\WriteHandleInterface` and `IO\\ReadHandleInterface`, writing and reading binary data without buffering entire messages in PHP memory. This is ideal for network protocols over TCP\/Unix sockets.\n\n```php\nuse Psl\\Binary\\Endianness;\nuse Psl\\Binary\\HandleReader;\nuse Psl\\Binary\\HandleWriter;\nuse Psl\\IO;\nuse Psl\\IO\\MemoryHandle;\n\n\/\/ HandleWriter writes directly to any IO\\WriteHandleInterface.\n\/\/ In production, this could be a TCP socket - here we use MemoryHandle for demo.\n$handle = new MemoryHandle();\n\n$writer = new HandleWriter($handle, Endianness::Big);\n\/\/ version\n$writer->u8(1);\n\/\/ type\n$writer->u16(0x0042);\n\/\/ payload length\n$writer->u32(5);\n\/\/ payload\n$writer->bytes('Hello');\n\nIO\\write_line('Wrote %d bytes to handle', strlen($handle->getBuffer()));\n\n\/\/ Seek back to start so we can read what was written\n$handle->seek(0);\n\n\/\/ HandleReader reads directly from any IO\\ReadHandleInterface\n$reader = new HandleReader($handle, Endianness::Big);\n\n$version = $reader->u8();\n$type = $reader->u16();\n$length = $reader->u32();\n$payload = $reader->bytes($length);\n\nIO\\write_line('Version: %d', $version); \/\/ 1\nIO\\write_line('Type: 0x%04X', $type); \/\/ 0x0042\nIO\\write_line('Length: %d', $length); \/\/ 5\nIO\\write_line('Payload: %s', $payload); \/\/ Hello\n```\n\n## Length-Prefixed Bytes\n\nAll writers and readers support length-prefixed byte strings, a common pattern in binary protocols where the payload length is written before the payload itself. The prefix size determines the maximum payload length.\n\n```php\nuse Psl\\Binary\\Reader;\nuse Psl\\Binary\\Writer;\nuse Psl\\IO;\n\n\/\/ Length-prefixed bytes: write the payload length as a typed integer,\n\/\/ followed by the raw payload bytes, in a single method call.\n\n$data = Writer::default()\n    ->u8(1) \/\/ version\n    ->u16(0x0042) \/\/ message type\n    ->u32PrefixedBytes('Hello, PSL!') \/\/ u32 length prefix + payload\n    ->u8PrefixedBytes('OK') \/\/ u8 length prefix + short status\n    ->toString();\n\nIO\\write_line('Message hex: %s', bin2hex($data));\n\n\/\/ Read it back\n$reader = new Reader($data);\n\n$version = $reader->u8();\n$type = $reader->u16();\n$payload = $reader->u32PrefixedBytes(); \/\/ reads u32 length, then that many bytes\n$status = $reader->u8PrefixedBytes();\n\nIO\\write_line('Version: %d', $version); \/\/ 1\nIO\\write_line('Type: 0x%04X', $type); \/\/ 0x0042\nIO\\write_line('Payload: %s', $payload); \/\/ Hello, PSL!\nIO\\write_line('Status: %s', $status); \/\/ OK\n\n\/\/ skip() advances the reader without returning the data\n$data2 = Writer::default()->u32(0xDEAD)->u32PrefixedBytes('Important')->toString(); \/\/ header we want to skip\n\n$reader2 = new Reader($data2);\n$reader2->skip(4); \/\/ skip the 4-byte header\nIO\\write_line('Skipped to: %s', $reader2->u32PrefixedBytes()); \/\/ Important\n```\n\n## Implementing Custom Writers and Readers\n\nThe `WriterConvenienceMethodsTrait` and `ReaderConvenienceMethodsTrait` provide default implementations of `skip()` and the length-prefixed methods. When implementing `WriterInterface` or `ReaderInterface`, use these traits to avoid re-implementing the convenience methods:\n\n```php\nuse Psl\\Binary\\WriterInterface;\nuse Psl\\Binary\\WriterConvenienceMethodsTrait;\n\nfinal class MyCustomWriter implements WriterInterface\n{\n    use WriterConvenienceMethodsTrait;\n\n    \/\/ Only implement the primitive methods: u8, u16, u32, u64,\n    \/\/ i8, i16, i32, i64, f32, f64, bytes\n    \/\/ The prefixed methods come from the trait for free.\n}\n```\n\n## Supported Types\n\n| Type | Size | Signed | Function Pair |\n|------|------|--------|---------------|\n| u8 | 1 byte | No | `encode_u8` \/ `decode_u8` |\n| u16 | 2 bytes | No | `encode_u16` \/ `decode_u16` |\n| u32 | 4 bytes | No | `encode_u32` \/ `decode_u32` |\n| u64 | 8 bytes | No | `encode_u64` \/ `decode_u64` |\n| i8 | 1 byte | Yes | `encode_i8` \/ `decode_i8` |\n| i16 | 2 bytes | Yes | `encode_i16` \/ `decode_i16` |\n| i32 | 4 bytes | Yes | `encode_i32` \/ `decode_i32` |\n| i64 | 8 bytes | Yes | `encode_i64` \/ `decode_i64` |\n| f32 | 4 bytes | N\/A | `encode_f32` \/ `decode_f32` |\n| f64 | 8 bytes | N\/A | `encode_f64` \/ `decode_f64` |\n\nSee [src\/Psl\/Binary\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/binary\/src\/Psl\/Binary\/) for the full API.\n","encoding":"# Encoding\n\nThe `Encoding` component provides functions for encoding and decoding binary data to and from text-safe representations. It supports Base64 (with multiple variants) and hexadecimal encoding, making it straightforward to prepare binary data for transport over text-based protocols like HTTP, email, or JSON.\n\n## Base64\n\n### Encoding and Decoding\n\n```php\nuse Psl\\Encoding\\Base64;\n\n$encoded = Base64\\encode('Hello, World!');\n\/\/ 'SGVsbG8sIFdvcmxkIQ=='\n\n$decoded = Base64\\decode($encoded);\n\n\/\/ 'Hello, World!'\n```\n\n### URL-Safe Variant\n\nStandard Base64 uses `+` and `\/`, which conflict with URLs. The `UrlSafe` variant replaces them with `-` and `_`:\n\n```php\nuse Psl\\Encoding\\Base64;\nuse Psl\\SecureRandom;\n\n\/\/ Standard encoding may produce URL-unfriendly characters\n$binaryToken = SecureRandom\\bytes(8);\n$token = Base64\\encode($binaryToken);\n\n\/\/ URL-safe encoding is better for query parameters, filenames, and tokens\n$token = Base64\\encode($binaryToken, Base64\\Variant::UrlSafe);\n$original = Base64\\decode($token, Base64\\Variant::UrlSafe);\n```\n\nThe `Variant` enum supports `Standard`, `UrlSafe`, `DotSlash`, `DotSlashOrdered`, and `Mime` for specialized use cases.\n\nThe `Mime` variant uses the standard alphabet but wraps output at 76 characters with CRLF line endings per RFC 2045, and strips whitespace on decode.\n\n### Padding Control\n\nBoth `encode()` and `decode()` accept a padding parameter. You can strip padding on encode and decode without it:\n\n```php\nuse Psl\\Encoding\\Base64;\n\n$encoded = Base64\\encode('Hello!', padding: false);\n\/\/ 'SGVsbG8h' (no trailing '=')\n\n$decoded = Base64\\decode($encoded, explicitPadding: false);\n\n\/\/ 'Hello!'\n```\n\n### Error Handling\n\nDecoding invalid input throws typed exceptions rather than returning `false`:\n\n```php\nuse Psl\\Encoding\\Base64;\nuse Psl\\Encoding\\Exception;\n\ntry {\n    Base64\\decode('not-valid-base64!');\n} catch (Exception\\RangeException $e) {\n    echo $e->getMessage() . \"\\n\";\n}\n```\n\n## Hex\n\nHexadecimal encoding converts each byte into two hex characters. This is useful for displaying binary data like hashes, checksums, or cryptographic keys in a human-readable form.\n\n```php\nuse Psl\\Encoding\\Exception;\nuse Psl\\Encoding\\Hex;\n\n$hex = Hex\\encode('Hello');\n\/\/ '48656c6c6f'\n\n$binary = Hex\\decode('48656c6c6f');\n\/\/ 'Hello'\n\n\/\/ Invalid hex throws immediately\ntry {\n    Hex\\decode('xyz');\n} catch (Exception\\RangeException $e) {\n    echo $e->getMessage() . \"\\n\";\n}\n\n\/\/ Odd-length strings are rejected\ntry {\n    Hex\\decode('abc');\n} catch (Exception\\RangeException $e) {\n    echo $e->getMessage() . \"\\n\";\n}\n```\n\n## Quoted-Printable\n\nQuoted-printable encoding represents 8-bit data using only printable ASCII characters, as defined by RFC 2045 §6.7. It is commonly used in email (MIME) to encode content that is mostly ASCII with occasional special characters. Unlike Base64, quoted-printable keeps readable text readable.\n\n```php\nuse Psl\\Encoding\\QuotedPrintable;\nuse Psl\\IO;\n\n$encoded = QuotedPrintable\\encode(\"Hello =World!\\r\\nLine 2 with trailing space \");\nIO\\write_line('Encoded: %s', $encoded);\n\n$decoded = QuotedPrintable\\decode($encoded);\nIO\\write_line('Decoded: %s', $decoded);\n\n\/\/ Custom line length\n$short = QuotedPrintable\\encode(str_repeat('A', 50), maxLineLength: 30);\nIO\\write_line('Short lines: %s', $short);\n\n\/\/ Custom line ending\n$unix = QuotedPrintable\\encode(\"line1\\r\\nline2\", lineEnding: \"\\n\");\nIO\\write_line('Unix endings: %s', $unix);\n```\n\nBoth `encode()` and `encode_line()` accept optional `$max_line_length` (default 76) and `$line_ending` (default `\"\\r\\n\"`) parameters.\n\n## Encoded-Word (RFC 2047)\n\nEncoded-word encoding is used in MIME headers (Subject, From, etc.) to represent non-ASCII text. `encode()` automatically selects Q-encoding (for mostly ASCII text) or B-encoding (for mostly non-ASCII text) based on the proportion of non-printable bytes.\n\n```php\nuse Psl\\Encoding\\EncodedWord;\nuse Psl\\IO;\n\n\/\/ Encode a non-ASCII string for use in a MIME header\n$encoded = EncodedWord\\encode(\"caf\\xC3\\xA9 latt\\xC3\\xA9 is great\");\nIO\\write_line('Encoded: %s', $encoded);\n\n\/\/ Decode encoded-words back to UTF-8\n$decoded = EncodedWord\\decode($encoded);\nIO\\write_line('Decoded: %s', $decoded);\n\n\/\/ Decode a B-encoded header\n$subject = EncodedWord\\decode('=?utf-8?B?Y2Fmw6k=?=');\nIO\\write_line('Subject: %s', $subject);\n\n\/\/ Decode a Q-encoded header with underscores as spaces\n$from = EncodedWord\\decode('=?utf-8?Q?John_Doe?=');\nIO\\write_line('From: %s', $from);\n\n\/\/ Plain ASCII passes through unchanged\n$plain = EncodedWord\\encode('Hello, World!');\nIO\\write_line('Plain: %s', $plain);\n```\n\n`encode()` accepts an optional `$charset` parameter of type `Psl\\Str\\Encoding` (default `Encoding::Utf8`). `decode()` handles charset conversion automatically, and per RFC 2047 §6.2, whitespace between adjacent encoded-words is removed.\n\n## Streaming IO Handles\n\nEach encoding namespace (Base64, Hex, QuotedPrintable) provides four IO handle decorators that transparently encode or decode data as it flows through:\n\n- **`EncodingReadHandle`** wraps a raw readable handle; read() returns encoded data\n- **`DecodingReadHandle`** wraps an encoded readable handle; read() returns decoded data\n- **`EncodingWriteHandle`** accepts raw data via write(); encodes and writes to the inner handle\n- **`DecodingWriteHandle`** accepts encoded data via write(); decodes and writes to the inner handle\n\nWrite handles have a `flush()` method to encode\/decode any remaining buffered data.\n\nThis bridges `Psl\\IO` with `Psl\\Encoding`, allowing you to compose encoding into any IO pipeline:\n\n```php\nuse Psl\\Encoding\\Base64;\nuse Psl\\IO;\n\n\/\/ Encode: wrap a raw handle, read() returns base64-encoded output\n$raw = new IO\\MemoryHandle('Hello, World!');\n$encoder = new Base64\\EncodingReadHandle($raw);\n$encoded = $encoder->readAll();\nIO\\write_line('Encoded: %s', $encoded);\n\n\/\/ Decode: wrap an encoded handle, read() returns raw bytes\n$encodedHandle = new IO\\MemoryHandle($encoded);\n$decoder = new Base64\\DecodingReadHandle($encodedHandle);\n$decoded = $decoder->readAll();\nIO\\write_line('Decoded: %s', $decoded);\n\n\/\/ Write handles work the other direction\n$output = new IO\\MemoryHandle();\n$encodingWriter = new Base64\\EncodingWriteHandle($output);\n$encodingWriter->writeAll('Binary data here');\n$encodingWriter->flush();\n\n$output->seek(0);\nIO\\write_line('Written encoded: %s', $output->readAll());\n```\n\nRead handles also implement `BufferedReadHandleInterface`, providing `readByte()`, `readLine()`, `readUntil()`, and `readUntilBounded()` directly on the decoded\/encoded output with zero wrapper overhead.\n\nSee [src\/Psl\/Encoding\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/encoding\/src\/Psl\/Encoding\/) for the full API.\n","html":"# Html\n\nThe `Html` component provides functions for encoding, decoding, and stripping HTML entities. It wraps PHP's `htmlentities`, `htmlspecialchars`, and related functions with a cleaner API and an `Encoding` enum for character set selection.\n\n## Usage\n\n### Encoding\n\n`encode()` converts all applicable characters to HTML entities, while `encode_special_characters()` only converts the special characters (`&`, `\"`, `'`, `<`, `>`):\n\n```php\nuse Psl\\Html;\n\nHtml\\encode('<p>\"Hello\" & welcome<\/p>');\n\/\/ '&lt;p&gt;&quot;Hello&quot; &amp; welcome&lt;\/p&gt;'\n\n\/\/ encode_special_characters is lighter -- only converts &, \", ', <, >\nHtml\\encode_special_characters('<script>alert(\"xss\")<\/script>');\n\n\/\/ '&lt;script&gt;alert(&quot;xss&quot;)&lt;\/script&gt;'\n```\n\nUse `encode_special_characters()` when building HTML output from user input -- it is the safer default for preventing XSS while keeping non-special characters readable.\n\n### Avoiding Double Encoding\n\nBoth functions accept a `$double_encoding` parameter. Set it to `false` to preserve existing entities:\n\n```php\nuse Psl\\Html;\n\nHtml\\encode('&amp; is an ampersand', doubleEncoding: false);\n\n\/\/ '&amp; is an ampersand' (not double-encoded to '&amp;amp;')\n```\n\n### Decoding\n\n```php\nuse Psl\\Html;\n\nHtml\\decode('&lt;p&gt;Hello&lt;\/p&gt;');\n\/\/ '<p>Hello<\/p>'\n\nHtml\\decode_special_characters('&lt;p&gt;Hello&lt;\/p&gt;');\n\n\/\/ '<p>Hello<\/p>'\n```\n\n### Stripping Tags\n\nRemove HTML and PHP tags from a string, optionally keeping specific tags:\n\n```php\nuse Psl\\Html;\n\nHtml\\strip_tags('<p>Hello <b>World<\/b><\/p>');\n\/\/ 'Hello World'\n\nHtml\\strip_tags('<p>Hello <b>World<\/b><\/p>', ['b']);\n\n\/\/ 'Hello <b>World<\/b>'\n```\n\n### Character Encoding\n\nAll encoding\/decoding functions accept an `Encoding` enum to specify the character set. The default is UTF-8:\n\n```php\nuse Psl\\Html;\n\n$html = '<p>\"Hello\" & welcome<\/p>';\n\nHtml\\encode($html, encoding: Html\\Encoding::Iso88591);\nHtml\\decode('&lt;p&gt;Hello&lt;\/p&gt;', Html\\Encoding::ShiftJis);\n```\n\nThe `Encoding` enum supports UTF-8, ISO-8859-1, ISO-8859-15, Windows-1251, Windows-1252, Big5, GB2312, Shift_JIS, EUC-JP, KOI8-R, and several other character sets.\n\nSee [src\/Psl\/Html\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/html\/src\/Psl\/Html\/) for the full API.\n","json":"# Json\n\nThe `Json` component provides JSON encoding and decoding that throws typed exceptions instead of returning `false` or requiring manual `json_last_error()` checks. It defaults to sensible flags (unescaped Unicode, unescaped slashes, preserved zero fractions) so encoded output is clean and predictable.\n\n## Usage\n\n### Encoding\n\n```php\nuse Psl\\Json;\n\nJson\\encode(['name' => 'Alice', 'score' => 9.0]);\n\/\/ '{\"name\":\"Alice\",\"score\":9.0}'\n\n\/\/ Pretty-print for readability\nJson\\encode(['name' => 'Alice'], true);\n\/\/ '{\n\/\/     \"name\": \"Alice\"\n\/\/ }'\n\n\/\/ Unicode and slashes are unescaped by default\nJson\\encode(['path' => '\/home\/user', 'greeting' => \"\\u{1F44B}\"]);\n\n\/\/ '{\"path\":\"\/home\/user\",\"greeting\":\"...\"}' (actual wave emoji in output)\n```\n\n### Decoding\n\n```php\nuse Psl\\Json;\n\n$_ = Json\\decode('{\"name\":\"Alice\",\"age\":30}');\n\/\/ ['name' => 'Alice', 'age' => 30]\n\n\/\/ Invalid JSON throws immediately\ntry {\n    Json\\decode('not json');\n} catch (Json\\Exception\\DecodeException $e) {\n    echo $e->getMessage() . \"\\n\";\n}\n```\n\n### Typed Decoding\n\n`typed()` combines JSON decoding with PSL's `Type` system. The decoded data is validated and coerced into the expected shape in a single step -- no manual array key checks or type casting:\n\n```php\nuse Psl\\Json;\nuse Psl\\Type;\n\n\/\/ Decode and validate as a specific shape\n$user = Json\\typed('{\"name\":\"Alice\",\"age\":30}', Type\\shape([\n    'name' => Type\\string(),\n    'age' => Type\\int(),\n]));\n\/\/ $user['name'] is string, $user['age'] is int -- guaranteed\n\n\/\/ If the JSON structure doesn't match, you get a clear exception\ntry {\n    Json\\typed('{\"name\":\"Alice\"}', Type\\shape([\n        'name' => Type\\string(),\n        'age' => Type\\int(),\n    ]));\n} catch (Json\\Exception\\DecodeException $e) {\n    echo $e->getMessage() . \"\\n\";\n}\n\n\/\/ Works with any Type -- vectors, optionals, nested shapes\n$ids = Json\\typed('[1, 2, 3]', Type\\vec(Type\\int()));\n\n\/\/ [1, 2, 3] as list<int>\n```\n\n## Why Use This Over json_encode\/json_decode?\n\n- **Exceptions by default**: No need to pass `JSON_THROW_ON_ERROR` or check `json_last_error()`\n- **Clean defaults**: Unicode characters and slashes are not escaped, zero fractions are preserved\n- **Type safety with `typed()`**: Validate the decoded structure against a `Type` in one call, eliminating manual `isset` \/ `is_array` checks\n- **Consistent API**: Both encoding and decoding errors throw from the same `Json\\Exception` hierarchy\n\nSee [src\/Psl\/Json\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/json\/src\/Psl\/Json\/) for the full API.\n","punycode":"# Punycode\n\nThe `Punycode` component provides RFC 3492 Punycode encoding and decoding, the standard algorithm for representing Unicode strings in the ASCII-only subset used by internationalized domain names (IDNA).\n\n## Usage\n\n```php\nuse Psl\\IO;\nuse Psl\\Punycode;\n\n\/\/ Encode Unicode to Punycode\n$encoded = Punycode\\encode('münchen');\n\/\/ \"mnchen-3ya\"\nIO\\write_line('%s', $encoded);\n\n\/\/ Decode Punycode to Unicode\n$decoded = Punycode\\decode('mnchen-3ya');\n\/\/ \"münchen\"\nIO\\write_line('%s', $decoded);\n\n\/\/ Round-trip\n$encoded = Punycode\\encode('日本語');\n$decoded = Punycode\\decode($encoded);\n\/\/ \"日本語\"\nIO\\write_line('%s', $decoded);\n```\n\n## Standards\n\n| RFC | Title |\n|-----|-------|\n| [RFC 3492](https:\/\/datatracker.ietf.org\/doc\/html\/rfc3492) | Punycode: A Bootstring Encoding of Unicode for IDNA |\n\nSee [src\/Psl\/Punycode\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/punycode\/src\/Psl\/Punycode\/) for the full API.\n","regex":"# Regex\n\nThe `Regex` component provides type-safe regular expression functions. PHP's `preg_*` functions return `false` on invalid patterns and use `null` for unmatched groups, making it easy to silently propagate errors. PSL's `Regex` functions throw `InvalidPatternException` for bad patterns and support typed capture groups so you know exactly what shape your matches will have.\n\n## Usage\n\n### Checking for Matches\n\n```php\nuse Psl\\Regex;\n\nRegex\\matches('hello@example.com', '\/^[^@]+@[^@]+$\/'); \/\/ true\nRegex\\matches('not-an-email', '\/^[^@]+@[^@]+$\/'); \/\/ false\nRegex\\matches('foo bar foo', '\/foo\/', 4); \/\/ true (from offset)\n```\n\n### Extracting Matches\n\n`first_match()` returns the first match as an array, or `null` if nothing matched:\n\n```php\nuse Psl\\Regex;\n\n$match = Regex\\first_match('Order #12345', '\/Order #(\\d+)\/');\n\n\/\/ ['Order #12345', '12345']\n```\n\n### Typed Capture Groups\n\nPass a `Type` shape to get a well-typed result that validates the match structure at runtime:\n\n```php\nuse Psl\\Regex;\nuse Psl\\Type;\n\n$pattern = '\/(?P<year>\\d{4})-(?P<month>\\d{2})-(?P<day>\\d{2})\/';\n\n$match = Regex\\first_match('Date: 2025-03-15', $pattern, Type\\shape([\n    0 => Type\\string(),\n    'year' => Type\\string(),\n    'month' => Type\\string(),\n    'day' => Type\\string(),\n]));\n\n\/\/ $match['year'] === '2025', $match['month'] === '03', $match['day'] === '15'\n```\n\nThe `capture_groups()` helper builds a shape type from a list of expected group keys:\n\n```php\nuse Psl\\Regex;\n\n$match = Regex\\first_match('Hello World', '\/(Hello) (World)\/', Regex\\capture_groups([1, 2]));\n\n\/\/ $match[0] === 'Hello World', $match[1] === 'Hello', $match[2] === 'World'\n```\n\n### Finding All Matches\n\n`every_match()` returns all matches as a list, or `null` if none matched:\n\n```php\nuse Psl\\Regex;\n\n$matches = Regex\\every_match('prices: $10, $20, $30', '\/\\$(\\d+)\/');\n\n\/\/ [['$10', '10'], ['$20', '20'], ['$30', '30']]\n```\n\n### Search and Replace\n\n```php\nuse Psl\\Regex;\nuse Psl\\Str;\n\nRegex\\replace('hello world', '\/world\/', 'PHP');\n\/\/ 'hello PHP'\n\n\/\/ Dynamic replacement with a callback\nRegex\\replace_with('hello world', '\/\\b(\\w)\/', fn($m) => Str\\uppercase($m[1]));\n\/\/ 'Hello World'\n\n\/\/ Replace multiple patterns at once\nRegex\\replace_every('foo bar baz', [\n    '\/foo\/' => 'one',\n    '\/bar\/' => 'two',\n    '\/baz\/' => 'three',\n]);\n\n\/\/ 'one two three'\n```\n\n### Splitting\n\n```php\nuse Psl\\Regex;\n\nRegex\\split('one, two,  three', '\/,\\s*\/');\n\/\/ ['one', 'two', 'three']\n\nRegex\\split('a-b-c-d', '\/-\/', 2);\n\n\/\/ ['a', 'b-c-d']\n```\n\n## Error Handling\n\nAll functions throw instead of returning error sentinels. An invalid pattern like `\/unclosed(group` throws `Regex\\Exception\\InvalidPatternException` immediately rather than returning `false`.\n\nSee [src\/Psl\/Regex\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/regex\/src\/Psl\/Regex\/) for the full API.\n","compression":"[# Compression\n\nThe `Compression` component provides streaming compression and decompression abstractions for IO handles. It defines compressor and decompressor interfaces, and four handle decorators that transparently compress or decompress data as it flows through.\n\nThis component is an abstraction layer -- it does not include any compression algorithms. Concrete implementations (e.g. deflate, gzip, brotli, zstd) are provided by separate packages that implement `CompressorInterface` and `DecompressorInterface`.\n\n## Interfaces\n\nTwo interfaces define the compression contract:\n\n- **`CompressorInterface`** -- `push(string $data): string` to incrementally compress, `finish(): string` to finalize and reset\n- **`DecompressorInterface`** -- `push(string $data): string` to incrementally decompress, `finish(): string` to finalize and reset\n\nAfter `finish()`, the instance resets to initial state and can be reused for a new stream. Compression and decompression are inherently stateful -- a single instance must not be used concurrently across multiple fibers or streams.\n\n## Readers\n\n`CompressingReadHandle` and `DecompressingReadHandle` wrap a readable handle and transform data on read. Both implement `ReadHandleInterface`. Wrap with `IO\\Reader` for buffered methods like `readLine()` and `readUntil()`.\n\nBoth accept an optional `$chunkSize` parameter (default 8192) controlling how many bytes are read from the inner handle per iteration. Increase it for large file compression, decrease it to reduce memory usage per stream.\n\n```php\nuse Psl\\Compression;\nuse Psl\\IO;\n\n\/\/ CompressingReadHandle wraps a readable handle and compresses data on read.\n\/\/ DecompressingReadHandle does the reverse -- decompresses data on read.\n\/\/ Both implement ReadHandleInterface. Wrap with IO\\Reader for buffered methods.\n\n$source = new IO\\MemoryHandle('hello world');\n\n\/** @var Compression\\CompressorInterface $compressor *\/\n$handle = new Compression\\CompressingReadHandle($source, $compressor);\n\n$compressed = $handle->readAll();\n\nIO\\write_line('Compressed: %s', $compressed);\n```\n\n## Writers\n\n`CompressingWriteHandle` and `DecompressingWriteHandle` wrap a writable handle and transform data on write. Both implement `BufferedWriteHandleInterface`. Call `flush()` to finalize the handle and write any remaining buffered data.\n\n```php\nuse Psl\\Async;\nuse Psl\\Compression;\nuse Psl\\DateTime\\Duration;\nuse Psl\\IO;\n\n\/\/ CompressingWriteHandle wraps a writable handle and compresses data on write.\n\/\/ DecompressingWriteHandle does the reverse -- decompresses data on write.\n\/\/ Both implement BufferedWriteHandleInterface. Call flush() to finalize.\n\n$output = new IO\\MemoryHandle();\n\n\/** @var Compression\\CompressorInterface $compressor *\/\n$writer = new Compression\\CompressingWriteHandle($output, $compressor);\n\n$writer->writeAll('hello world');\n$writer->flush(); \/\/ finalize the compression stream\n\n\/\/ flush() accepts an optional CancellationTokenInterface for timeout control\n$writer->flush(new Async\\TimeoutCancellationToken(Duration::seconds(5)));\n\n$output->seek(0);\nIO\\write_line('Result: %s', $output->readAll());\n```\n\n`flush()` accepts an optional `CancellationTokenInterface` parameter, so you can set a timeout on the finalization when writing to network handles.\n\nSee [src\/Psl\/Compression\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/compression\/src\/Psl\/Compression\/) for the full API.\n","file":"# File\n\nThe `File` component provides typed file handles for reading and writing files. It builds on the `IO` component's handle interfaces, adding file-specific concerns like write modes and advisory locking.\n\n## Quick Read and Write\n\nFor common cases, use the convenience functions:\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$tmp = Filesystem\\create_temporary_file(prefix: 'psl_file_');\n\n\/\/ Write to a file (creates it if it does not exist)\nFile\\write($tmp, '{\"key\": \"value\"}');\n\n\/\/ Read an entire file\n$content = File\\read($tmp);\nIO\\write_line('Full content: %s', $content);\n\n\/\/ Read with offset and length\n$header = File\\read($tmp, offset: 0, length: 6);\nIO\\write_line('Header: %s', $header);\n\n\/\/ Overwrite with truncation\nFile\\write($tmp, 'New content', File\\WriteMode::Truncate);\nIO\\write_line('After truncate: %s', File\\read($tmp));\n\nFilesystem\\delete_file($tmp);\n```\n\nBoth `File\\read()` and `File\\write()` automatically acquire a lock (shared for reads, exclusive for writes) and release it when done.\n\n## Write Modes\n\nWhen opening a file for writing, you choose a `WriteMode` that controls how the file pointer is positioned and whether the file must already exist:\n\n| Mode | Behavior |\n|------|----------|\n| `OpenOrCreate` | Opens or creates the file. Pointer at the beginning. Existing content is preserved. **(default)** |\n| `Truncate` | Opens or creates the file and truncates it to zero length. |\n| `Append` | Opens or creates the file. All writes go to the end regardless of seek position. |\n| `MustCreate` | Creates a new file. Throws if the file already exists. |\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$logFile = Filesystem\\create_temporary_file(prefix: 'psl_log_');\n$lockFile = sys_get_temp_dir() . '\/psl-session-' . uniqid() . '.lock';\n\n\/\/ Append a log line\nFile\\write($logFile, \"event occurred\\n\", File\\WriteMode::Append);\nFile\\write($logFile, \"another event\\n\", File\\WriteMode::Append);\nIO\\write_line('Log contents: %s', File\\read($logFile));\n\n\/\/ Ensure we are creating a fresh file\n$id = 'session-abc123';\nFile\\write($lockFile, $id, File\\WriteMode::MustCreate);\nIO\\write_line('Lock file contents: %s', File\\read($lockFile));\n\nFilesystem\\delete_file($logFile);\nFilesystem\\delete_file($lockFile);\n```\n\n## File Handles\n\nFor more control, open a file handle directly. Handles implement the `IO` handle interfaces and add `getPath()`, `getSize()`, and locking.\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\nuse Psl\\Str;\n\n$csvFile = Filesystem\\create_temporary_file(prefix: 'psl_csv_');\n$outputFile = Filesystem\\create_temporary_file(prefix: 'psl_out_');\n$datFile = Filesystem\\create_temporary_file(prefix: 'psl_dat_');\n\n\/\/ Prepare CSV data\nFile\\write($csvFile, \"name,age\\nAlice,30\\nBob,25\\n\");\n\n\/\/ Read-only\n$handle = File\\open_read_only($csvFile);\n$all = $handle->readAll();\n$handle->close();\nIO\\write_line('CSV data: %s', Str\\trim_right($all));\n\n\/\/ Write-only with truncation\n$handle = File\\open_write_only($outputFile, File\\WriteMode::Truncate);\n$handle->writeAll(\"line 1\\nline 2\\n\");\n$handle->close();\nIO\\write_line('Output: %s', Str\\trim_right(File\\read($outputFile)));\n\n\/\/ Read-write\nFile\\write($datFile, 'hello world');\n$handle = File\\open_read_write($datFile);\n$existing = $handle->readAll();\n$handle->seek(0);\n$handle->writeAll(Str\\uppercase($existing));\n$handle->close();\nIO\\write_line('Uppercased: %s', File\\read($datFile));\n\nFilesystem\\delete_file($csvFile);\nFilesystem\\delete_file($outputFile);\nFilesystem\\delete_file($datFile);\n```\n\n## File Locking\n\nFile handles support advisory locking via `lock()` and `tryLock()`. The returned `Lock` object is released by calling `release()` or when it is garbage collected.\n\n- **`LockType::Shared`** -- Multiple processes can hold a shared lock simultaneously. Use for reads.\n- **`LockType::Exclusive`** -- Only one process can hold an exclusive lock. Use for writes.\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$counterFile = Filesystem\\create_temporary_file(prefix: 'psl_counter_');\nFile\\write($counterFile, '0');\n\n$handle = File\\open_read_write($counterFile);\n$lock = $handle->lock(File\\LockType::Exclusive);\n\n$count = (int) $handle->readAll();\n$handle->seek(0);\n$handle->writeAll((string) ($count + 1));\n\n$lock->release();\n$handle->close();\n\nIO\\write_line('Counter incremented to: %s', File\\read($counterFile));\n\nFilesystem\\delete_file($counterFile);\n```\n\n`tryLock()` acquires the lock immediately or throws `AlreadyLockedException`:\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$tmp = Filesystem\\create_temporary_file(prefix: 'psl_lock_');\n$handle = File\\open_read_write($tmp);\n\ntry {\n    $lock = $handle->tryLock(File\\LockType::Exclusive);\n    IO\\write_line('Lock acquired successfully');\n    $lock->release();\n} catch (File\\Exception\\AlreadyLockedException) {\n    IO\\write_line('Another process holds the lock');\n}\n\n$handle->close();\nFilesystem\\delete_file($tmp);\n```\n\n## Blocking Behavior in Async Code\n\nAll file operations are blocking: they block the current fiber until the operation completes. This is inherent to filesystem I\/O; operating systems do not provide truly non-blocking file I\/O the way they do for sockets.\n\nIn concurrent applications, this means a file read or write in one fiber will prevent other fibers from running until it finishes. For most workloads this is fine since file I\/O is fast, but if you are doing heavy file I\/O alongside latency-sensitive network operations, consider offloading file work to a separate process.\n\nThe [`amphp\/file`](https:\/\/github.com\/amphp\/file) package does exactly this: it spawns a worker process and delegates all file operations to it, communicating over IPC. Because amphp uses the same RevoltPHP event loop as PSL's async component, it integrates seamlessly:\n\n```php\nuse Amp\\File;\nuse Psl\\Async;\n\nAsync\\main(static function(): int {\n    \/\/ Non-blocking file read; other fibers can run while this waits\n    $content = File\\read('\/path\/to\/large-file.dat');\n\n    return 0;\n});\n```\n\n## Integration with IO\n\nBecause file handles implement the `IO` interfaces, they work with any code that accepts `IO\\ReadHandleInterface` or `IO\\WriteHandleInterface`:\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$sourceFile = Filesystem\\create_temporary_file(prefix: 'psl_src_');\n$destFile = Filesystem\\create_temporary_file(prefix: 'psl_dst_');\n\nFile\\write($sourceFile, 'binary data to copy');\n\n$source = File\\open_read_only($sourceFile);\n$dest = File\\open_write_only($destFile, File\\WriteMode::Truncate);\nIO\\copy($source, $dest);\n$source->close();\n$dest->close();\n\nIO\\write_line('Copied: %s', File\\read($destFile));\n\nFilesystem\\delete_file($sourceFile);\nFilesystem\\delete_file($destFile);\n```\n\nSee [src\/Psl\/File\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/file\/src\/Psl\/File\/) for the full API.\n","filesystem":"# Filesystem\n\nThe `Filesystem` component provides type-safe functions for common file system operations. It replaces PHP's procedural file functions with proper error handling through exceptions, clear parameter types, and consistent behavior.\n\nUnlike the `File` component (which deals with reading and writing file contents through handles), `Filesystem` focuses on managing files and directories themselves: checking existence, creating, copying, deleting, and inspecting metadata.\n\n## Checking Existence and Type\n\n```php\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n\/\/ Create temp directory and file for demonstration\n$dir = sys_get_temp_dir() . '\/psl-fs-check-' . uniqid();\nFilesystem\\create_directory($dir);\n$file = $dir . '\/test.txt';\nFilesystem\\create_file($file);\n$link = $dir . '\/test-link';\nFilesystem\\create_symbolic_link($file, $link);\n\nIO\\write_line('exists(file):       %s', Filesystem\\exists($file) ? 'true' : 'false');\nIO\\write_line('is_file(file):      %s', Filesystem\\is_file($file) ? 'true' : 'false');\nIO\\write_line('is_directory(dir):  %s', Filesystem\\is_directory($dir) ? 'true' : 'false');\nIO\\write_line('is_symbolic_link:   %s', Filesystem\\is_symbolic_link($link) ? 'true' : 'false');\nIO\\write_line('is_readable(file):  %s', Filesystem\\is_readable($file) ? 'true' : 'false');\nIO\\write_line('is_writable(file):  %s', Filesystem\\is_writable($file) ? 'true' : 'false');\n\nFilesystem\\delete_file($link);\nFilesystem\\delete_file($file);\nFilesystem\\delete_directory($dir);\n```\n\n## Creating Files and Directories\n\n```php\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$base = sys_get_temp_dir() . '\/psl-fs-create-' . uniqid();\n\n\/\/ Create a file (parent directories are created automatically)\n$file = $base . '\/nested\/file.txt';\nFilesystem\\create_file($file);\nIO\\write_line('File created: %s', Filesystem\\is_file($file) ? 'yes' : 'no');\n\n\/\/ Create a directory (recursive by default)\n$dir = $base . '\/another\/nested\/dir';\nFilesystem\\create_directory($dir);\nFilesystem\\create_directory($dir, 0o755);\nIO\\write_line('Directory created: %s', Filesystem\\is_directory($dir) ? 'yes' : 'no');\n\n\/\/ Create a temporary file\n$tmp = Filesystem\\create_temporary_file();\nIO\\write_line('Temp file: %s', $tmp);\n\n$tmp2 = Filesystem\\create_temporary_file($base, prefix: 'app_');\nIO\\write_line('Prefixed temp file: %s', Filesystem\\get_basename($tmp2));\n\n\/\/ Clean up\nFilesystem\\delete_file($tmp);\nFilesystem\\delete_file($tmp2);\nFilesystem\\delete_directory($base, recursive: true);\n```\n\n## Copying and Deleting\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$base = sys_get_temp_dir() . '\/psl-fs-copy-' . uniqid();\nFilesystem\\create_directory($base);\n\n$src = $base . '\/source.txt';\n$dst = $base . '\/dest.txt';\nFile\\write($src, 'hello world');\n\n\/\/ Copy a file (preserves executable bits)\nFilesystem\\copy($src, $dst);\nIO\\write_line('Copied: %s', File\\read($dst));\n\n\/\/ Copy with overwrite\nFile\\write($src, 'updated content');\nFilesystem\\copy($src, $dst, overwrite: true);\nIO\\write_line('Overwritten: %s', File\\read($dst));\n\n\/\/ Delete a file\nFilesystem\\delete_file($dst);\nIO\\write_line('File deleted: %s', !Filesystem\\exists($dst) ? 'yes' : 'no');\n\n\/\/ Delete a directory (empty, or recursive)\n$subDir = $base . '\/subdir';\nFilesystem\\create_directory($subDir);\nFilesystem\\delete_directory($subDir);\n\n\/\/ Delete a directory with contents recursively\nFilesystem\\delete_directory($base, recursive: true);\nIO\\write_line('Directory deleted: %s', !Filesystem\\exists($base) ? 'yes' : 'no');\n```\n\n## Metadata and Permissions\n\n```php\nuse Psl\\File;\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$tmp = Filesystem\\create_temporary_file(prefix: 'psl_meta_');\nFile\\write($tmp, 'some content here');\n\n$bytes = Filesystem\\file_size($tmp);\n$mtime = Filesystem\\get_modification_time($tmp);\n$perms = Filesystem\\get_permissions($tmp);\n$owner = Filesystem\\get_owner($tmp);\n\nIO\\write_line('Size: %d bytes', $bytes);\nIO\\write_line('Modified: %s', date('Y-m-d H:i:s', $mtime));\nIO\\write_line('Permissions: %o', $perms);\nIO\\write_line('Owner UID: %d', $owner);\n\nFilesystem\\change_permissions($tmp, 0o644);\nIO\\write_line('New permissions: %o', Filesystem\\get_permissions($tmp));\n\nFilesystem\\delete_file($tmp);\n```\n\n## Symbolic Links\n\n```php\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$base = sys_get_temp_dir() . '\/psl-fs-links-' . uniqid();\nFilesystem\\create_directory($base);\n\n$target = $base . '\/target.txt';\n$symlink = $base . '\/symlink.txt';\n$hardlink = $base . '\/hardlink.txt';\n\nFilesystem\\create_file($target);\n\nFilesystem\\create_symbolic_link($target, $symlink);\nFilesystem\\create_hard_link($target, $hardlink);\n\n$resolved = Filesystem\\read_symbolic_link($symlink);\nIO\\write_line('Symlink points to: %s', $resolved);\nIO\\write_line('Is symbolic link: %s', Filesystem\\is_symbolic_link($symlink) ? 'true' : 'false');\nIO\\write_line('Hard link exists: %s', Filesystem\\is_file($hardlink) ? 'true' : 'false');\n\nFilesystem\\delete_directory($base, recursive: true);\n```\n\n## Path Operations\n\n```php\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$base = sys_get_temp_dir() . '\/psl-fs-paths-' . uniqid();\nFilesystem\\create_directory($base . '\/subdir', 0o755);\n$file = $base . '\/subdir\/file.txt';\nFilesystem\\create_file($file);\n\n\/\/ Resolve to absolute path (returns null if path does not exist)\n$real = Filesystem\\canonicalize($base . '\/subdir\/..\/subdir\/file.txt');\nIO\\write_line('Canonical: %s', $real ?? 'null');\n\nIO\\write_line('Basename: %s', Filesystem\\get_basename($file)); \/\/ \"file.txt\"\nIO\\write_line('Without ext: %s', Filesystem\\get_basename($file, '.txt')); \/\/ \"file\"\nIO\\write_line('Directory: %s', Filesystem\\get_directory($file));\nIO\\write_line('Extension: %s', Filesystem\\get_extension($file) ?? 'null'); \/\/ \"txt\"\n\n$noExt = $base . '\/subdir\/Makefile';\nFilesystem\\create_file($noExt);\nIO\\write_line('No extension: %s', Filesystem\\get_extension($noExt) ?? 'null'); \/\/ null\n\nFilesystem\\delete_directory($base, recursive: true);\n```\n\n## Reading Directory Contents\n\n```php\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$dir = sys_get_temp_dir() . '\/psl-fs-readdir-' . uniqid();\nFilesystem\\create_directory($dir);\nFilesystem\\create_file($dir . '\/alpha.txt');\nFilesystem\\create_file($dir . '\/beta.txt');\nFilesystem\\create_directory($dir . '\/subdir');\n\n$entries = Filesystem\\read_directory($dir);\n\/\/ Returns a list of absolute path strings (excludes . and ..)\nforeach ($entries as $entry) {\n    IO\\write_line('  %s', Filesystem\\get_basename($entry));\n}\n\nFilesystem\\delete_directory($dir, recursive: true);\n```\n\n## Error Handling\n\nAll operations throw specific exceptions on failure:\n\n```php\nuse Psl\\Filesystem;\nuse Psl\\IO;\n\n$missing = sys_get_temp_dir() . '\/psl-fs-missing-' . uniqid() . '.txt';\n\ntry {\n    Filesystem\\delete_file($missing);\n} catch (Filesystem\\Exception\\NotFoundException) {\n    IO\\write_line('Caught NotFoundException: file does not exist');\n} catch (Filesystem\\Exception\\NotFileException) {\n    IO\\write_line('Caught NotFileException: path exists but is not a file');\n}\n```\n\nSee [src\/Psl\/Filesystem\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/filesystem\/src\/Psl\/Filesystem\/) for the full API.\n","io":"# IO\n\nThe `IO` component provides handle-based I\/O abstractions. Instead of reaching for global functions like `fread()` and `fwrite()`, you work with typed handle interfaces that make I\/O composable, testable, and safe.\n\n## Handle Interfaces\n\nHandles are defined as narrow interfaces, each describing a single capability:\n\n- **`ReadHandleInterface`** -- read bytes, check for EOF\n- **`WriteHandleInterface`** -- write bytes\n- **`SeekHandleInterface`** -- move the cursor position\n- **`CloseHandleInterface`** -- explicitly close the handle, check if closed via `isClosed()`\n\nA concrete handle implements whichever combination applies. For example, a file handle implements read, write, seek, and close, while a network socket implements read, write, and close but not seek.\n\n### Buffered Interfaces\n\nTwo higher-level interfaces extend the base read and write interfaces for handles that buffer data internally:\n\n- **`BufferedReadHandleInterface`** -- extends `ReadHandleInterface` with `readByte()`, `readLine()`, `readUntil()`, and `readUntilBounded()`. Implemented by `Reader`.\n- **`BufferedWriteHandleInterface`** -- extends `WriteHandleInterface` with `flush()` for explicitly flushing buffered output. Useful for decorators like compression handles that accumulate data before writing.\n\n## Quick Output\n\nConvenience functions write directly to stdout or stderr:\n\n```php\nuse Psl\\IO;\n\n$msg = 'file not found';\n\nIO\\write('Hello, %s!', 'world'); \/\/ stdout, no newline\nIO\\write_line('Count: %d', 42); \/\/ stdout + newline\nIO\\write_error('something went wrong'); \/\/ stderr\nIO\\write_error_line('Error: %s', $msg); \/\/ stderr + newline\n```\n\nAll output functions support `sprintf`-style formatting.\n\n## Standard Handles\n\nThree functions return the process-level I\/O handles:\n\n```php\nuse Psl\\IO;\n\n$stdin = IO\\input_handle(); \/\/ ReadHandleInterface  (STDIN in CLI)\n$stdout = IO\\output_handle(); \/\/ WriteHandleInterface (STDOUT in CLI)\n$stderr = IO\\error_handle(); \/\/ WriteHandleInterface (STDERR in CLI, null otherwise)\n```\n\nIn non-CLI SAPIs, `input_handle()` reads from `php:\/\/input` and `output_handle()` writes to `php:\/\/output`. `error_handle()` returns `null` outside CLI.\n\n## MemoryHandle\n\n`MemoryHandle` is an in-memory buffer implementing read, write, seek, and close. It is useful for testing code that accepts handle interfaces without touching the filesystem or network.\n\n```php\nuse Psl\\IO;\n\n$handle = new IO\\MemoryHandle();\n$handle->writeAll('Hello, World!');\n$handle->seek(0);\n$handle->readAll(); \/\/ 'Hello, World!'\n$_ = $handle->getBuffer(); \/\/ 'Hello, World!' (always returns full buffer)\n\n\/\/ Use MemoryHandle as a test double for any WriteHandleInterface\nfunction render_report(IO\\WriteHandleInterface $output): void\n{\n    $output->writeAll(\"Report\\n\");\n}\n\n$buffer = new IO\\MemoryHandle();\nrender_report($buffer);\nPsl\\invariant($buffer->getBuffer() === \"Report\\n\", 'Expected buffer to contain \"Report\\n\"');\n```\n\n## Reader\n\n`Reader` wraps any `ReadHandleInterface` and implements `BufferedReadHandleInterface`, providing buffered, higher-level reading methods:\n\n```php\nuse Psl\\IO;\n\n$handle = new IO\\MemoryHandle(\"line one\\nline two\\n\\x00rest\");\n$reader = new IO\\Reader($handle);\n\n$line = $reader->readLine(); \/\/ read until newline: \"line one\"\n$byte = $reader->readByte(); \/\/ read exactly one byte: \"l\"\n$chunk = $reader->readFixedSize(7); \/\/ read exactly 7 bytes: \"ine two\"\n$until = $reader->readUntil(\"\\0\"); \/\/ read until a delimiter (delimiter consumed but not returned): \"\\n\"\n\nIO\\write_line('Line:  %s', $line ?? '<line not found>');\nIO\\write_line('Byte:  %s', $byte);\nIO\\write_line('Chunk: %s', $chunk);\nIO\\write_line('Until: %s', $until ?? '<suffix not found>');\n```\n\n### Bounded Reads\n\n`Reader::readUntilBounded()` works like `readUntil()` but enforces a maximum byte limit. If the suffix is not found within `$max_bytes`, an `IO\\Exception\\OverflowException` is thrown. This prevents unbounded memory consumption when reading from untrusted sources -- for example, capping HTTP header lines to a safe size so a malicious client cannot exhaust memory by sending an endless line.\n\n```php\nuse Psl\\IO;\n\n$handle = new IO\\MemoryHandle(\"GET \/ HTTP\/1.1\\r\\nHost: example.com\\r\\n\\r\\nbody\");\n$reader = new IO\\Reader($handle);\n\n\/\/ Read the request line, capped at 8192 bytes\n$requestLine = $reader->readUntilBounded(\"\\r\\n\", 8192);\nIO\\write_line('Request line: %s', $requestLine ?? '<not found>');\n\n\/\/ Read a header line, capped at 4096 bytes\n$header = $reader->readUntilBounded(\"\\r\\n\", 4096);\nIO\\write_line('Header: %s', $header ?? '<not found>');\n\n\/\/ If the line exceeds the limit, OverflowException is thrown:\n$tinyHandle = new IO\\MemoryHandle(\"this line is way too long\\r\\n\");\n$tinyReader = new IO\\Reader($tinyHandle);\n\ntry {\n    $tinyReader->readUntilBounded(\"\\r\\n\", 5);\n} catch (IO\\Exception\\OverflowException $e) {\n    IO\\write_line('Caught: %s', $e->getMessage());\n}\n```\n\n## Spool\n\n`IO\\spool()` creates a handle that writes to memory until a threshold is reached (default 2MB), then transparently spools to a temporary file on disk. This is useful when buffering data of unknown size without risking excessive memory usage.\n\n```php\nuse Psl\\IO;\nuse Psl\\Str;\n\n\/\/ Writes to memory until 2MB, then spools to a temporary file on disk\n$handle = IO\\spool();\n\n$handle->writeAll('Hello, World!');\n$handle->seek(0);\n$handle->readAll(); \/\/ 'Hello, World!'\n\n$handle->close();\n\n\/\/ Custom threshold: spool to disk after 64 bytes\n$small = IO\\spool(maxMemory: 64);\n$small->writeAll(Str\\repeat('x', 256)); \/\/ transparently written to disk\n$small->seek(0);\n$small->readAll(); \/\/ 256 bytes of 'x'\n\n$small->close();\n```\n\n## Pipes\n\n`IO\\pipe()` creates a connected pair of handles: anything written to the write end can be read from the read end.\n\n```php\nuse Psl\\IO;\n\n[$reader, $writer] = IO\\pipe();\n$writer->writeAll('hello');\n$writer->close();\n\n$result = $reader->readAll(); \/\/ 'hello'\n$reader->close();\n\nIO\\write_line('Read from pipe: %s', $result);\n```\n\n## Copying and Streaming\n\n`IO\\copy()` reads from one handle and writes to another until EOF. If the writer implements `BufferedWriteHandleInterface`, it is flushed after all data has been written:\n\n```php\nuse Psl\\IO;\n\n$source = new IO\\MemoryHandle('data to copy');\n$dest = new IO\\MemoryHandle();\nIO\\copy($source, $dest);\n\nIO\\write_line('Copied: %s', $dest->getBuffer()); \/\/ 'data to copy'\n```\n\nFor control over the read chunk size, use `IO\\copy_chunked()`:\n\n```php\nuse Psl\\IO;\n\n$source = new IO\\MemoryHandle(str_repeat('x', 100_000));\n$destination = new IO\\MemoryHandle();\n\n\/\/ Copy using 4 KB chunks instead of the default 8 KB\n$bytesCopied = IO\\copy_chunked($source, $destination, 4096);\n\n$bytesCopied; \/\/ 100000\n```\n\nBoth functions have bidirectional variants -- `IO\\copy_bidirectional()` and `IO\\copy_bidirectional_chunked()` -- that copy data in both directions concurrently between two read-write handles. These are useful for building proxies and tunnels.\n\n`IO\\streaming()` multiplexes reads from several stream handles concurrently, yielding chunks as they arrive. This is useful for reading interleaved process output:\n\n```php\nuse Psl\\IO;\n\n\/\/ Create two pipes to simulate concurrent streams\n[$outReader, $outWriter] = IO\\pipe();\n[$errReader, $errWriter] = IO\\pipe();\n\n\/\/ Write data to both pipes\n$outWriter->writeAll('stdout output');\n$outWriter->close();\n$errWriter->writeAll('stderr output');\n$errWriter->close();\n\nforeach (IO\\streaming(['out' => $outReader, 'err' => $errReader]) as $name => $chunk) {\n    IO\\write_line('[%s] %s', $name, $chunk);\n}\n\n$outReader->close();\n$errReader->close();\n```\n\n## Handle Decorators\n\nPSL provides several decorator handles that wrap an existing handle and add behavior.\n\n### IterableReadHandle\n\n`IterableReadHandle` wraps an `iterable<string>` (array, generator, or any iterable) as a streaming `ReadHandleInterface`. The iterator is advanced laz
