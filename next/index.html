ronments - if two fibers request the same key simultaneously, only one computes the value while the other waits.\n\n## Basic Usage\n\n`compute()` is the primary API - get a cached value or compute it if absent. `update()` always recomputes, receiving the old value.\n\n```php\nuse Psl\\Cache;\nuse Psl\\DateTime\\Duration;\nuse Psl\\IO;\n\n$store = new Cache\\LocalStore(maxSize: 100);\n\n\/\/ compute() returns cached value or computes it\n$value = $store->compute('greeting', static fn(): string => 'Hello, World!');\n\nIO\\write_line('%s', $value);\n\n\/\/ Second call returns cached value - computer is not invoked\n$value = $store->compute('greeting', static fn(): string => 'This is never called');\n\nIO\\write_line('%s', $value); \/\/ Still \"Hello, World!\"\n\n\/\/ With TTL - entry expires after 5 minutes\n$store->compute(\n    'user:42',\n    \/** @return array{name: string} *\/\n    static fn(): array => ['name' => 'Alice'],\n    Duration::minutes(5),\n);\n\n\/\/ update() always invokes the computer with the old value\n$store->compute('counter', static fn(): int => 0);\n$store->update('counter', static fn(null|int $old): int => ($old ?? 0) + 1);\n\n\/** @var int $counter *\/\n$counter = $store->get('counter');\nIO\\write_line('Counter: %d', $counter);\n```\n\n## Async Safety\n\nOperations on the same key are serialized via `KeyedSequence`. Different keys run in parallel with no blocking.\n\n```php\nuse Psl\\Async;\nuse Psl\\Cache;\nuse Psl\\DateTime\\Duration;\nuse Psl\\IO;\n\n$store = new Cache\\LocalStore();\n\n\/\/ Two fibers requesting the same key concurrently.\n\/\/ KeyedSequence ensures only one computes - the other waits and gets the cached result.\n[$a, $b] = Async\\concurrently([\n    static fn(): string => $store->compute('expensive', static function (): string {\n        Async\\sleep(Duration::milliseconds(100));\n\n        return 'computed once';\n    }),\n    static fn(): string => $store->compute('expensive', static fn(): string => 'this is never called'),\n]);\n\nIO\\write_line('Fiber A: %s', $a); \/\/ \"computed once\"\nIO\\write_line('Fiber B: %s', $b); \/\/ \"computed once\" - got cached result\n\n\/\/ Different keys run in parallel - no blocking\nAsync\\concurrently([\n    static fn(): string => $store->compute('key-1', static fn(): string => 'value-1'),\n    static fn(): string => $store->compute('key-2', static fn(): string => 'value-2'),\n]);\n```\n\n## LRU Eviction\n\n`LocalStore` maintains a bounded cache with configurable maximum size. When full, the least recently used entry is evicted. Accessed entries are promoted to most-recently-used.\n\n## TTL Expiration\n\nEntries with a TTL are proactively cleaned up via an event loop timer, not lazily on access. The timer activates when TTL'd entries exist and disables itself when none remain, adding zero overhead when no entries have expiration.\n\n## NullStore\n\n`NullStore` implements `StoreInterface` but never caches - every `compute()` invokes the computer, every `get()` throws. Useful for testing or disabling caching without changing calling code.\n\nSee [src\/Psl\/Cache\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/cache\/src\/Psl\/Cache\/) for the full API.\n","class":"# Class\n\nThe `Class` component provides type-safe wrappers around PHP's built-in class reflection and existence checks. It replaces loose `class_exists()` calls with a consistent, intention-revealing API and adds helpers for inspecting class properties.\n\n## Why Use This?\n\nPHP's native `class_exists()` accepts a second argument to control autoloading, which is easy to forget or misuse. PSL separates that choice into two distinct functions -- `exists()` (triggers autoloading) and `defined()` (checks only already-loaded definitions) -- so the intent is always clear.\n\n## Usage\n\n### Checking Existence\n\n```php\nuse Psl\\Class;\nuse Psl\\IO;\n\n\/\/ Triggers autoloading if needed\nIO\\write_line('stdClass exists: %s', Class\\exists(stdClass::class) ? 'yes' : 'no');\n\n\/\/ Only checks already-loaded classes (no autoloading)\nIO\\write_line('stdClass defined: %s', Class\\defined(stdClass::class) ? 'yes' : 'no');\n```\n\n### Inspecting Classes\n\n```php\nuse Psl\\Class;\nuse Psl\\IO;\n\nIO\\write_line('stdClass is final: %s', Class\\is_final(stdClass::class) ? 'yes' : 'no');\nIO\\write_line('stdClass is abstract: %s', Class\\is_abstract(stdClass::class) ? 'yes' : 'no');\nIO\\write_line('stdClass is readonly: %s', Class\\is_readonly(stdClass::class) ? 'yes' : 'no');\n```\n\n### Practical Example\n\nGuard a factory method against invalid input:\n\n```php\nuse Psl\\Class;\nuse Psl\\IO;\n\nfunction create(string $class): object\n{\n    if (!Class\\exists($class)) {\n        throw new InvalidArgumentException($class . ' does not exist.');\n    }\n\n    if (Class\\is_abstract($class)) {\n        throw new InvalidArgumentException($class . ' is abstract and cannot be instantiated.');\n    }\n\n    \/\/ @mago-expect analysis:unknown-class-instantiation\n    return new $class();\n}\n\n$obj = create(stdClass::class);\nIO\\write_line('Created: %s', get_class($obj));\n```\n\nSee [src\/Psl\/Class\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/class\/src\/Psl\/Class\/) for the full API.\n","interface":"# Interface\n\nThe `Interface` component provides type-safe wrappers around PHP's built-in interface reflection and existence checks. It replaces loose `interface_exists()` calls with a consistent, intention-revealing API.\n\n## Usage\n\nPSL separates existence checks into two distinct functions -- `exists()` (triggers autoloading) and `defined()` (checks only already-loaded definitions) -- so the intent is always clear.\n\n```php\nuse Psl\\Interface;\nuse Psl\\IO;\nuse Psl\\Trait;\n\nIO\\write_line('JsonSerializable exists: %s', Interface\\exists(JsonSerializable::class) ? 'yes' : 'no');\nIO\\write_line('JsonSerializable defined: %s', Interface\\defined(JsonSerializable::class) ? 'yes' : 'no');\n\n\/\/ Check a non-existent trait\nIO\\write_line('NonExistentTrait exists: %s', Trait\\exists('NonExistentTrait') ? 'yes' : 'no');\n```\n\nSee [src\/Psl\/Interface\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/interface\/src\/Psl\/Interface\/) for the full API.\n","interoperability":"# Interoperability\n\nThe `Interoperability` component provides a set of interfaces for converting between PSL types and their PHP standard library (`stdlib`) or `intl` extension equivalents.\n\nThese interfaces establish a uniform contract for bidirectional conversion, allowing PSL types to interoperate seamlessly with native PHP types.\n\n## Usage\n\n```php\nuse Psl\\DateTime\\DateTime;\nuse Psl\\DateTime\\Timezone;\nuse Psl\\IO;\n\n\/\/ Convert a PSL DateTime to a PHP DateTimeImmutable\n$psl = DateTime::fromParts(Timezone::AmericaNewYork, 2024, 6, 15, 14, 30, 45);\n$stdlib = $psl->toStdlib();\nIO\\write_line('PSL to stdlib: %s', $stdlib->format('Y-m-d H:i:s T'));\n\n\/\/ Convert back from a PHP DateTimeImmutable to a PSL DateTime\n$back = DateTime::fromStdlib($stdlib);\nIO\\write_line('Back to PSL: %s', $back->toRfc3339());\n\n\/\/ Convert a PSL Timezone to an IntlTimeZone\n$intl = Timezone::AmericaNewYork->toIntl();\n$id = $intl->getID();\nIO\\write_line('IntlTimeZone ID: %s', false === $id ? '<unknown>' : $id);\n\n\/\/ Convert back from an IntlTimeZone to a PSL Timezone\n$tz = Timezone::fromIntl($intl);\nIO\\write_line('Back to PSL Timezone: %s', $tz->value);\n```\n\n## Conversion Interfaces\n\nThe component defines four interfaces covering all conversion directions:\n\n- **`ToStdlib`** -- convert a PSL type to its PHP standard library equivalent (e.g. PSL `DateTime` to `DateTimeImmutable`)\n- **`FromStdlib`** -- create a PSL type from its PHP standard library equivalent (e.g. `DateTimeImmutable` to PSL `DateTime`)\n- **`ToIntl`** -- convert a PSL type to its `intl` extension equivalent (e.g. PSL `Timezone` to `IntlTimeZone`)\n- **`FromIntl`** -- create a PSL type from its `intl` extension equivalent (e.g. `IntlTimeZone` to PSL `Timezone`)\n\n## Implementations\n\nThe following PSL types implement these interfaces:\n\n| PSL Type | ToStdlib | FromStdlib | ToIntl | FromIntl |\n|---|---|---|---|---|\n| `DateTime\\DateTime` | `DateTimeImmutable` | `DateTimeImmutable` | `IntlCalendar` | `IntlCalendar` |\n| `DateTime\\Timestamp` | `DateTimeImmutable` | `DateTimeImmutable` | - | - |\n| `DateTime\\Duration` | `DateInterval` | - | - | - |\n| `DateTime\\Timezone` | `DateTimeZone` | `DateTimeZone` | `IntlTimeZone` | `IntlTimeZone` |\n\nSee [src\/Psl\/Interoperability\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/interoperability\/src\/Psl\/Interoperability\/) for the full API.\n","observer":"# Observer\n\nThe `Observer` component provides two interfaces for the classic Observer design pattern. A subject maintains a list of observers and notifies them when something changes. PSL's interfaces are generic, so observers receive the concrete subject type rather than a vague base class.\n\n## Design\n\n- **`SubjectInterface`** -- The object being watched. It can `subscribe()`, `unsubscribe()`, and `notify()` observers.\n- **`ObserverInterface<T>`** -- The watcher. Its `update()` method receives the subject that triggered the notification, fully typed as `T`.\n\n## Usage\n\nThe following example demonstrates a complete Subject\/Observer implementation, including wiring them together:\n\n```php\nuse Psl\\IO;\nuse Psl\\Observer;\nuse Psl\\Vec;\n\nfinal class Inventory implements Observer\\SubjectInterface\n{\n    \/** @var list<Observer\\ObserverInterface<Inventory>> *\/\n    private array $observers = [];\n    private int $stock = 0;\n\n    public function subscribe(Observer\\ObserverInterface $observer): void\n    {\n        $this->observers[] = $observer;\n    }\n\n    public function unsubscribe(Observer\\ObserverInterface $observer): void\n    {\n        $this->observers = Vec\\filter($this->observers, static fn($o) => $o !== $observer);\n    }\n\n    public function notify(): void\n    {\n        foreach ($this->observers as $observer) {\n            $observer->update($this);\n        }\n    }\n\n    public function restock(int $quantity): void\n    {\n        $this->stock += $quantity;\n        $this->notify();\n    }\n\n    public function getStock(): int\n    {\n        return $this->stock;\n    }\n}\n\n\/** @implements Observer\\ObserverInterface<Inventory> *\/\nfinal class StockAlert implements Observer\\ObserverInterface\n{\n    \/** @param Inventory $subject *\/\n    public function update(Observer\\SubjectInterface $subject): void\n    {\n        if ($subject->getStock() > 100) {\n            IO\\write_line('Alert: stock is now %d (above threshold)', $subject->getStock());\n        }\n    }\n}\n\n\/\/ Wiring it together\n$inventory = new Inventory();\n$alert = new StockAlert();\n\n$inventory->subscribe($alert);\n$inventory->restock(150); \/\/ StockAlert::update() is called\n$inventory->unsubscribe($alert);\n$inventory->restock(50); \/\/ No alert -- observer was removed\n\nIO\\write_line('Final stock: %d', $inventory->getStock());\n```\n\nSee [src\/Psl\/Observer\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/observer\/src\/Psl\/Observer\/) for the full API.\n","trait":"# Trait\n\nThe `Trait` component provides type-safe wrappers around PHP's built-in trait reflection and existence checks. It replaces loose `trait_exists()` calls with a consistent, intention-revealing API.\n\n## Usage\n\nPSL separates existence checks into two distinct functions -- `exists()` (triggers autoloading) and `defined()` (checks only already-loaded definitions) -- so the intent is always clear.\n\n```php\nuse Psl\\Interface;\nuse Psl\\IO;\nuse Psl\\Trait;\n\nIO\\write_line('JsonSerializable exists: %s', Interface\\exists(JsonSerializable::class) ? 'yes' : 'no');\nIO\\write_line('JsonSerializable defined: %s', Interface\\defined(JsonSerializable::class) ? 'yes' : 'no');\n\n\/\/ Check a non-existent trait\nIO\\write_line('NonExistentTrait exists: %s', Trait\\exists('NonExistentTrait') ? 'yes' : 'no');\n```\n\nSee [src\/Psl\/Trait\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/trait\/src\/Psl\/Trait\/) for the full API.\n","detect-packages":"# Detect Packages\n\nThe `detect-packages` command scans PHP source directories for PSL namespace usage and reports which `php-standard-library\/*` standalone packages are needed. This helps migrate from the monorepo to individual packages.\n\nThis tool is only available when using the monorepo (`php-standard-library\/php-standard-library`).\n\n## Usage\n\n```bash\nvendor\/bin\/psl detect-packages <path>... [--dev <path>...] [--composer]\n```\n\n### Options\n\n| Option | Description |\n|--------|-------------|\n| `--src` | Mark following paths as `require` dependencies (default) |\n| `--dev` | Mark following paths as `require-dev` dependencies |\n| `--composer` | Output a JSON snippet for `composer.json` |\n\n## Examples\n\n### Basic scan\n\nScan a single source directory:\n\n```bash\nvendor\/bin\/psl detect-packages src\/\n```\n\n```\nDetected PSL packages:\n\n  require:\n    php-standard-library\/dict\n    php-standard-library\/foundation\n    php-standard-library\/str\n    php-standard-library\/vec\n```\n\n### Separating require and require-dev\n\nScan source and test directories separately. Packages found in both are placed in `require` only:\n\n```bash\nvendor\/bin\/psl detect-packages src\/ --dev tests\/\n```\n\n```\nDetected PSL packages:\n\n  require:\n    php-standard-library\/dict\n    php-standard-library\/foundation\n    php-standard-library\/str\n    php-standard-library\/vec\n\n  require-dev:\n    php-standard-library\/filesystem\n    php-standard-library\/os\n```\n\n### JSON output for composer.json\n\nUse `--composer` to get output you can paste directly into your `composer.json`:\n\n```bash\nvendor\/bin\/psl detect-packages src\/ --dev tests\/ --composer\n```\n\n```json\n{\n    \"require\": {\n        \"php-standard-library\/dict\": \"^6.1\",\n        \"php-standard-library\/str\": \"^6.1\",\n        \"php-standard-library\/vec\": \"^6.1\"\n    },\n    \"require-dev\": {\n        \"php-standard-library\/filesystem\": \"^6.1\",\n        \"php-standard-library\/os\": \"^6.1\"\n    }\n}\n```\n\n### Multiple source paths\n\nYou can pass multiple directories. Bare paths default to `require`:\n\n```bash\nvendor\/bin\/psl detect-packages src\/ lib\/ --dev tests\/\n```\n\n## How it works\n\nThe tool scans all `.php` files in the given directories and matches `Psl\\<Namespace>` references using regex. Each namespace is mapped to its corresponding standalone package. The `foundation` package is always included when any PSL usage is detected, since all PSL packages depend on it.\n\nTransitive dependencies are not resolved — only direct usage in your code is reported. Composer handles transitive dependencies automatically when you install the standalone packages.\n"};
