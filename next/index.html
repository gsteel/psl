 ],\n    ],\n]);\n\n\/\/ 2. Internal nameserver for corporate domains (split-horizon)\n$internalDns = new DNS\\FallbackResolver([\n    new DNS\\UDPResolver('10.0.0.53'),\n    new DNS\\TCPResolver('10.0.0.53'),\n]);\n\n\/\/ 3. Race multiple public nameservers for fastest response\n$public = new DNS\\RacingResolver([\n    \/\/ Cloudflare DNS-over-TLS\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('1.1.1.1', dnssec: true),\n        new DNS\\TCPResolver(\n            '1.1.1.1',\n            port: 853,\n            dnssec: true,\n            connector: new TLS\\TCPConnector(new TCP\\Connector(), new TLS\\Connector(new TLS\\ClientConfiguration())),\n        ),\n    ]),\n    \/\/ Google DNS-over-TLS\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('8.8.8.8', dnssec: true),\n        new DNS\\TCPResolver(\n            '8.8.8.8',\n            port: 853,\n            dnssec: true,\n            connector: new TLS\\TCPConnector(new TCP\\Connector(), new TLS\\Connector(new TLS\\ClientConfiguration())),\n        ),\n    ]),\n    \/\/ Cloudflare secondary (plain TCP fallback)\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('1.0.0.1', dnssec: true),\n        new DNS\\TCPResolver('1.0.0.1', dnssec: true),\n    ]),\n    \/\/ Google secondary (plain TCP fallback)\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('8.8.4.4', dnssec: true),\n        new DNS\\TCPResolver('8.8.4.4', dnssec: true),\n    ]),\n]);\n\n\/\/ 4. Static overrides first, then public nameservers\n$base = new DNS\\FallbackResolver([$static, $public]);\n\n\/\/ 5. Route corporate domains to internal DNS, everything else to public\n$routed = new DNS\\SplitHorizonResolver(routes: [\n    new DNS\\Route(['corp.internal', 'dev.internal'], $internalDns),\n], default: $base);\n\n\/\/ 6. Expand short names using search domains\n$searched = new DNS\\SearchDomainResolver($routed, ['corp.internal', 'dev.internal']);\n\n\/\/ 7. Check the hosts file before any network query\n$hostsAware = new DNS\\HostsFileResolver($searched, HostsFile::load());\n\n\/\/ 8. Cache everything on top\n$resolver = new DNS\\CachedResolver($hostsAware, $cache);\n\n\/\/ 9. Profit!\n$response = $resolver->query('php-standard-library.dev', RecordType::A);\n\nIO\\write_line(\n    'php-standard-library.dev -> %s',\n    $response->getFirstAnswerRecord(ARecord::class)?->address->toString() ?? '<unknown>',\n);\n```\n\n## Supported Record Types\n\n| Type | RFC | Description |\n|------|-----|-------------|\n| A | RFC 1035 | IPv4 address |\n| AAAA | RFC 3596 | IPv6 address |\n| NS | RFC 1035 | Authoritative nameserver |\n| CNAME | RFC 1035 | Canonical name alias |\n| MX | RFC 1035 | Mail exchange |\n| TXT | RFC 1035 | Text records (SPF, DKIM, etc.) |\n| SRV | RFC 2782 | Service location |\n| SOA | RFC 1035 | Start of authority |\n| PTR | RFC 1035 | Reverse lookup pointer |\n| CAA | RFC 8659 | Certificate authority authorization |\n| SSHFP | RFC 4255 | SSH fingerprint |\n| TLSA | RFC 6698 | TLS certificate association (DANE) |\n| SVCB | RFC 9460 | Service binding |\n| HTTPS | RFC 9460 | HTTPS service binding |\n| LOC | RFC 1876 | Geographic location |\n| NAPTR | RFC 3403 | Naming authority pointer |\n| DS | RFC 4034 | DNSSEC delegation signer |\n| DNSKEY | RFC 4034 | DNSSEC public key |\n| RRSIG | RFC 4034 | DNSSEC signature |\n| NSEC | RFC 4034 | DNSSEC authenticated denial |\n| NSEC3 | RFC 5155 | DNSSEC hashed denial |\n\n## System Configuration Sources\n\n| OS | Source | Method |\n|----|--------|--------|\n| Linux\/FreeBSD | `\/etc\/resolv.conf` | `cat` via Process |\n| macOS | `scutil --dns` | Process (includes split DNS, custom ports) |\n| Windows | `ipconfig \/all` | Process |\n| All platforms | hosts file | Process |\n\n## RFC Compliance\n\n| RFC | Coverage |\n|-----|----------|\n| RFC 1035 | DNS wire format, A, NS, CNAME, MX, TXT, SOA, PTR records |\n| RFC 2782 | SRV records |\n| RFC 3403 | NAPTR records |\n| RFC 3596 | AAAA records |\n| RFC 4034 | DNSSEC record types (DS, DNSKEY, RRSIG, NSEC) |\n| RFC 4255 | SSHFP records |\n| RFC 5155 | NSEC3 and NSEC3PARAM records |\n| RFC 6698 | TLSA records (DANE) |\n| RFC 6891 | EDNS0 (OPT record, extended RCODE, UDP payload size) |\n| RFC 7858 | DNS-over-TLS via TLS client configuration |\n| RFC 8484 | DNS-over-HTTPS via HTTP client |\n| RFC 7871 | EDNS Client Subnet option |\n| RFC 7873 | DNS Cookies option |\n| RFC 7830 | EDNS TCP Keepalive option |\n| RFC 8467 | EDNS Padding option |\n| RFC 8659 | CAA records |\n| RFC 9460 | SVCB and HTTPS records |\n\nSee [src\/Psl\/DNS\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/dns\/src\/Psl\/DNS\/) for the full API.\n","dnssec":"# DNSSEC\n\nThe `DNSSEC` component adds full DNSSEC validation to DNS resolution. It is a standalone package (`php-standard-library\/dnssec`) that requires a `Psl\\DNS\\ResolverInterface` instance from the `psl\/dns` package.\n\nDNSSEC validation verifies that DNS responses have not been tampered with by checking cryptographic signatures (RRSIG), walking trust chains from the DNS root (DS\/DNSKEY), and validating authenticated denial of existence proofs (NSEC\/NSEC3).\n\n## Getting Started\n\nTo use DNSSEC, you need two things: a DNS resolver that requests DNSSEC records (`dnssec: true`), and the DNSSEC validation layer that wraps it.\n\n```php\nuse Psl\\DNS;\nuse Psl\\DNS\\Record\\RecordType;\nuse Psl\\DNSSEC;\n\n\/\/ Create a DNSSEC-validating resolver\n$inner = new DNS\\SystemResolver(dnssec: true);\n$trustChain = new DNSSEC\\TrustChainResolver($inner);\n$resolver = new DNSSEC\\SecureResolver($inner, $trustChain);\n\n\/\/ Queries are validated: signatures, trust chain, NSEC proofs\n$response = $resolver->query('example.com', RecordType::A);\n\n\/\/ Throws SignatureFailedException, BrokenTrustChainException,\n\/\/ InvalidProofException, or UnsignedResponseException on failure\n```\n\n## RRSIG: Signature Verification\n\nEvery DNSSEC-signed response includes RRSIG records alongside the answer records. Each RRSIG contains a cryptographic signature over a set of records, the signer's identity, and the key tag to locate the corresponding DNSKEY.\n\nWhen `SecureResolver` receives a response, it verifies that the RRSIG signatures are valid using the zone's public keys (DNSKEY records). If any signature is invalid or expired, `SignatureFailedException` is thrown.\n\n## DS\/DNSKEY: Trust Chain\n\nDNSSEC trust is established through a chain from the DNS root to the target zone. Each parent zone contains a DS (Delegation Signer) record that is a cryptographic hash of the child zone's DNSKEY. By verifying each link in the chain, `TrustChainResolver` proves that the zone's keys are authorized by the parent, all the way up to the root trust anchor.\n\nThe walk for `example.com` goes: root (.) DNSKEY > `com.` DS > `com.` DNSKEY > `example.com.` DS > `example.com.` DNSKEY.\n\n## NSEC\/NSEC3: Authenticated Denial\n\nWhen a domain does not exist (NXDOMAIN), the server must prove it. NSEC records list the names that DO exist in sorted order, proving there is no name between them. NSEC3 records do the same but with hashed names to prevent zone enumeration.\n\n`SecureResolver` validates these proofs automatically. If the proof is missing or invalid, `InvalidProofException` is thrown.\n\n## Trust Anchors\n\n`TrustChainResolver` uses the IANA root KSK as its trust anchor by default. For fully offline environments, `StaticTrustChainResolver` accepts pre-loaded DNSKEY records per zone, bypassing all network queries for trust chain resolution.\n\n```php\nuse Psl\\DateTime\\Duration;\nuse Psl\\DNS;\nuse Psl\\DNS\\DNSSEC\\Algorithm;\nuse Psl\\DNS\\Record\\DNSKEYRecord;\nuse Psl\\DNSSEC;\n\n$inner = new DNS\\SystemResolver(dnssec: true);\n\n\/\/ Default: uses IANA root KSK, walks the DS\/DNSKEY chain via DNS queries\n$trustChain = new DNSSEC\\TrustChainResolver($inner);\n\n\/\/ Fully offline: pre-loaded DNSKEY records per zone, no network queries\n$rootDnskey = new DNSKEYRecord('.', Duration::seconds(0), 257, 3, Algorithm::RSASHA256, '...');\n$comDnskey = new DNSKEYRecord('com.', Duration::seconds(0), 257, 3, Algorithm::ECDSAP256SHA256, '...');\n\n$offline = new DNSSEC\\StaticTrustChainResolver([\n    '.' => [$rootDnskey],\n    'com.' => [$comDnskey],\n]);\n\n$resolver = new DNSSEC\\SecureResolver($inner, $trustChain);\n```\n\n## Validation Errors\n\nDNSSEC validation produces specific exceptions for each failure mode:\n\n| Exception | Meaning |\n|-----------|---------|\n| `SignatureFailedException` | RRSIG verification failed or crypto format is invalid |\n| `BrokenTrustChainException` | DS\/DNSKEY trust chain is incomplete or invalid |\n| `InvalidProofException` | NSEC\/NSEC3 proof does not check out |\n| `UnsignedResponseException` | Expected DNSSEC-signed data but response was unsigned |\n\nAll exceptions extend `Psl\\DNSSEC\\Exception\\RuntimeException`.\n\n## Caching\n\nDNSSEC validation is expensive - each query triggers a trust chain walk from the root zone through every intermediate zone to the target. `CachedTrustChainResolver` caches the validated trust chain results so subsequent queries to the same TLD reuse the cached chain. Combine with `CachedResolver` on top to cache the final validated responses.\n\n```php\nuse Psl\\Cache;\nuse Psl\\DNS;\nuse Psl\\DNS\\Record\\RecordType;\nuse Psl\\DNSSEC;\n\n$cache = new Cache\\LocalStore();\n\n\/\/ The inner resolver must request DNSSEC records\n$dnsResolver = new DNS\\SystemResolver(dnssec: true);\n\n\/\/ Cache trust chain results to avoid repeated root-to-leaf walks\n\/\/ Without caching, every query triggers DS\/DNSKEY lookups for each zone\n$trustChain = new DNSSEC\\CachedTrustChainResolver(new DNSSEC\\TrustChainResolver($dnsResolver), $cache);\n\n\/\/ SecureResolver validates every response using the cached trust chain\n$secureResolver = new DNSSEC\\SecureResolver($dnsResolver, $trustChain);\n\n\/\/ Cache the validated DNS responses on top\n$resolver = new DNS\\CachedResolver($secureResolver, $cache);\n\n\/\/ First query: full trust chain walk (root -> com. -> example.com.)\n$resolver->query('example.com', RecordType::A);\n\n\/\/ Second query for same TLD: trust chain for \"com.\" is cached\n$resolver->query('another.com', RecordType::A);\n\n\/\/ Third query for same domain: entire response is cached\n$resolver->query('example.com', RecordType::A);\n```\n\n## Kitchen Sink\n\nCompose DNSSEC validation with static entries, hosts file, search domains, split-horizon routing, multiple racing DNS-over-TLS nameservers, and caching. DNSSEC validation only wraps the public DNS path; trusted sources (static, internal, hosts file) are outside the validation boundary.\n\n```php\nuse Psl\\Cache;\nuse Psl\\DateTime\\Duration;\nuse Psl\\DNS;\nuse Psl\\DNS\\Record\\ARecord;\nuse Psl\\DNS\\Record\\RecordType;\nuse Psl\\DNS\\System\\HostsFile\\HostsFile;\nuse Psl\\DNSSEC;\nuse Psl\\IO;\nuse Psl\\IP\\Address;\nuse Psl\\TCP;\nuse Psl\\TLS;\n\n$cache = new Cache\\LocalStore();\n\n\/\/ 1. Static entries (trusted by definition, no DNSSEC needed)\n$static = new DNS\\StaticResolver([\n    'db.internal' => [\n        RecordType::A->value => [\n            new ARecord('db.internal', Duration::hours(999), Address::parse('10.0.0.5')),\n        ],\n    ],\n    'cache.internal' => [\n        RecordType::A->value => [\n            new ARecord('cache.internal', Duration::hours(999), Address::parse('10.0.0.6')),\n        ],\n    ],\n]);\n\n\/\/ 2. Internal nameserver for corporate domains (trusted network, no DNSSEC)\n$internalDns = new DNS\\FallbackResolver([\n    new DNS\\UDPResolver('10.0.0.53'),\n    new DNS\\TCPResolver('10.0.0.53'),\n]);\n\n\/\/ 3. Race multiple DNSSEC-enabled public nameservers\n$public = new DNS\\RacingResolver([\n    \/\/ Cloudflare DNS-over-TLS\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('1.1.1.1', dnssec: true),\n        new DNS\\TCPResolver(\n            '1.1.1.1',\n            port: 853,\n            dnssec: true,\n            connector: new TLS\\TCPConnector(new TCP\\Connector(), new TLS\\Connector(new TLS\\ClientConfiguration())),\n        ),\n    ]),\n    \/\/ Google DNS-over-TLS\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('8.8.8.8', dnssec: true),\n        new DNS\\TCPResolver(\n            '8.8.8.8',\n            port: 853,\n            dnssec: true,\n            connector: new TLS\\TCPConnector(new TCP\\Connector(), new TLS\\Connector(new TLS\\ClientConfiguration())),\n        ),\n    ]),\n    \/\/ Cloudflare secondary (plain TCP fallback)\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('1.0.0.1', dnssec: true),\n        new DNS\\TCPResolver('1.0.0.1', dnssec: true),\n    ]),\n    \/\/ Google secondary (plain TCP fallback)\n    new DNS\\FallbackResolver([\n        new DNS\\UDPResolver('8.8.4.4', dnssec: true),\n        new DNS\\TCPResolver('8.8.4.4', dnssec: true),\n    ]),\n]);\n\n\/\/ 4. DNSSEC: validate public DNS responses only\n$public = new DNSSEC\\SecureResolver(\n    $public,\n    new DNSSEC\\CachedTrustChainResolver(new DNSSEC\\TrustChainResolver($public), $cache),\n);\n\n\/\/ 5. Static overrides first, then DNSSEC-validated public DNS\n$base = new DNS\\FallbackResolver([$static, $public]);\n\n\/\/ 6. Route corporate domains to internal DNS (unvalidated),\n\/\/    everything else to static + DNSSEC-validated public\n$routed = new DNS\\SplitHorizonResolver(routes: [\n    new DNS\\Route(['corp.internal', 'dev.internal'], $internalDns),\n], default: $base);\n\n\/\/ 7. Expand short names using search domains\n$searched = new DNS\\SearchDomainResolver($routed, ['corp.internal', 'dev.internal']);\n\n\/\/ 8. Check the hosts file before any network query\n$hostsAware = new DNS\\HostsFileResolver($searched, HostsFile::load());\n\n\/\/ 9. Cache everything on top\n$resolver = new DNS\\CachedResolver($hostsAware, $cache);\n\n\/\/ 10. Profit!\n$response = $resolver->query('php-standard-library.dev', RecordType::A);\n\nIO\\write_line(\n    'php-standard-library.dev -> %s',\n    $response->getFirstAnswerRecord(ARecord::class)?->address->toString() ?? '<unknown>',\n);\n```\n\n## Supported Algorithms\n\n| Algorithm | RFC |\n|-----------|-----|\n| RSA\/SHA-1 | RFC 4034 |\n| RSA\/SHA-256 | RFC 5702 |\n| RSA\/SHA-512 | RFC 5702 |\n| ECDSA P-256\/SHA-256 | RFC 6605 |\n| ECDSA P-384\/SHA-384 | RFC 6605 |\n| Ed25519 | RFC 8080 |\n| Ed448 | RFC 8080 |\n\n## RFC Compliance\n\n| RFC | Coverage |\n|-----|----------|\n| RFC 4033 | DNSSEC introduction and requirements |\n| RFC 4034 | DNSSEC resource records (RRSIG, DNSKEY, DS, NSEC) |\n| RFC 4035 | DNSSEC protocol modifications and validation |\n| RFC 5155 | NSEC3 hashed authenticated denial of existence |\n| RFC 5702 | RSA\/SHA-256 and RSA\/SHA-512 for DNSSEC |\n| RFC 6605 | ECDSA for DNSSEC (P-256\/SHA-256, P-384\/SHA-384) |\n| RFC 8080 | Edwards-curve algorithms for DNSSEC (Ed25519, Ed448) |\n\nSee [src\/Psl\/DNSSEC\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/dnssec\/src\/Psl\/DNSSEC\/) for the full API.\n","h2":"# H2\n\nThe `H2` component implements the HTTP\/2 binary framing protocol (RFC 9113) on top of PSL's IO handles. It is a building block for higher-level components like HTTP clients and servers, not an HTTP implementation itself. The protocol is implemented in full - if the RFC defines it, H2 supports it.\n\n## Architecture\n\nH2 connections take a `Psl\\IO\\ReadHandleInterface & Psl\\IO\\WriteHandleInterface` instance. That could be a TCP stream, a TLS connection, a Unix socket, or anything else that implements those interfaces. H2 does not care about the transport.\n\nPSL's IO and Async components are built on top of [Revolt](https:\/\/github.com\/revoltphp\/event-loop). H2 is concurrent by design: operations like `waitForSendWindow()` suspend the current fiber and let the event loop run until a WINDOW_UPDATE arrives. Multiple streams on the same connection run in parallel through fibers.\n\nTo use H2 with other event loop libraries like ReactPHP, use [revoltphp\/event-loop-adapter-react](https:\/\/github.com\/revoltphp\/event-loop-adapter-react) and wrap your stream in a class implementing `ReadHandleInterface & WriteHandleInterface`.\n\n## Client and Server\n\nConnections are split into `ClientConnection` and `ServerConnection`, each implementing their role-specific interface. Both share common operations (sending headers, data, ping, goaway) via `ConnectionInterface`.\n\n```php\nuse Psl\\H2;\nuse Psl\\H2\\Event;\nuse Psl\\HPACK\\Header;\nuse Psl\\Network;\n\n\/\/ Create a socket pair for client-server communication\n[$clientSocket, $serverSocket] = Network\\socket_pair();\n\n$client = new H2\\ClientConnection($clientSocket);\n$server = new H2\\ServerConnection($serverSocket);\n\n\/\/ Initialize both sides (sends connection preface + SETTINGS)\n$client->initialize();\n$server->initialize();\n\n\/\/ Complete the handshake\n$server->readClientPreface();\n$server->readEvent(); \/\/ client SETTINGS\n$client->readEvent(); \/\/ server SETTINGS\n$client->readEvent(); \/\/ SETTINGS ACK\n$server->readEvent(); \/\/ SETTINGS ACK\n\n\/\/ Client sends a request\n$streamId = $client->nextStreamId();\n$client->sendHeaders(\n    $streamId,\n    [\n        new Header(':method', 'GET'),\n        new Header(':path', '\/hello'),\n        new Header(':scheme', 'https'),\n        new Header(':authority', 'example.com'),\n    ],\n    endStream: true,\n);\n\n\/\/ Server reads the request\n$events = $server->readEvent();\nforeach ($events as $event) {\n    if (!$event instanceof Event\\HeadersReceived) {\n        continue;\n    }\n\n    \/\/ Server sends a response\n    $server->sendHeadersWithStatus($event->streamId, '200', [\n        new Header('content-type', 'text\/plain'),\n    ]);\n\n    $server->sendData($event->streamId, 'Hello, World!', endStream: true);\n}\n```\n\n## Flow Control\n\n`sendData()` sends a single frame and requires the caller to manage flow control windows. For large payloads, use `sendAllData()` which automatically splits data into window-sized chunks and waits for WINDOW_UPDATE frames.\n\n```php\nuse Psl\\H2;\nuse Psl\\HPACK\\Header;\nuse Psl\\Str;\n\n\/** @var H2\\ClientConnectionInterface $client *\/\n\/** @var H2\\ServerConnectionInterface $server *\/\n\n$streamId = $client->nextStreamId();\n$client->sendHeaders($streamId, [\n    new Header(':method', 'POST'),\n    new Header(':path', '\/upload'),\n    new Header(':scheme', 'https'),\n    new Header(':authority', 'example.com'),\n]);\n\n\/\/ sendAllData handles flow control - no manual window management needed\n$largePayload = Str\\repeat('data', 10_000);\n$client->sendAllData($streamId, $largePayload, endStream: true);\n```\n\n## Server Push\n\nServer push is part of the HTTP\/2 specification, so H2 implements it. Whether higher-level code chooses to use it is an application-level decision. `sendPushPromise()` sends pushes, `rejectPush()` declines them.\n\n```php\nuse Psl\\H2;\nuse Psl\\HPACK\\Header;\n\n\/** @var H2\\ServerConnectionInterface $server *\/\n\/** @var H2\\ClientConnectionInterface $client *\/\n\n\/\/ Server pushes a CSS file alongside the HTML response\n$requestStreamId = 1; \/\/ client-initiated stream\n$pushStreamId = $server->nextStreamId();\n\n$server->sendPushPromise($requestStreamId, $pushStreamId, [\n    new Header(':method', 'GET'),\n    new Header(':path', '\/style.css'),\n    new Header(':scheme', 'https'),\n    new Header(':authority', 'example.com'),\n]);\n\n\/\/ Send the pushed response\n$server->sendHeadersWithStatus($pushStreamId, '200', [\n    new Header('content-type', 'text\/css'),\n]);\n$server->sendData($pushStreamId, 'body { color: red; }', endStream: true);\n\n\/\/ Client can reject unwanted pushes\n$client->rejectPush($pushStreamId);\n```\n\n## Extended CONNECT\n\nRFC 8441 enables protocols like WebSocket to run over HTTP\/2 streams. The client sends an extended CONNECT request with a `:protocol` pseudo-header, and after the server responds with 200, the stream becomes a bidirectional byte tunnel.\n\n```php\nuse Psl\\H2;\nuse Psl\\HPACK\\Header;\n\n\/** @var H2\\ClientConnectionInterface $client *\/\n\/** @var H2\\ServerConnectionInterface $server *\/\n\n$streamId = $client->nextStreamId();\n$client->sendExtendedConnect(\n    $streamId,\n    protocol: 'websocket',\n    scheme: 'https',\n    authority: 'example.com',\n    path: '\/chat',\n    extraHeaders: [\n        new Header('origin', 'https:\/\/example.com'),\n        new Header('sec-websocket-version', '13'),\n    ],\n);\n\n\/\/ After the server responds with 200, the stream becomes a bidirectional\n\/\/ byte tunnel. Use sendData\/readEvent to exchange protocol-specific frames.\n```\n\n## Alt-Svc and Origin\n\nServers can advertise alternative service endpoints (RFC 7838) for protocol migration, and declare authoritative origins (RFC 8336) for connection coalescing.\n\n```php\nuse Psl\\H2;\n\n\/** @var H2\\ServerConnectionInterface $server *\/\n\n\/\/ Alt-Svc (RFC 7838) advertises alternative service endpoints,\n\/\/ enabling HTTP\/2 to HTTP\/3 migration.\n$server->sendAltSvc(0, 'https:\/\/example.com', 'h3=\":443\"; ma=2592000');\n\n\/\/ ORIGIN (RFC 8336) declares which origins the server is authoritative for,\n\/\/ enabling connection coalescing across multiple domains.\n$server->sendOrigin([\n    'https:\/\/example.com',\n    'https:\/\/cdn.example.com',\n    'https:\/\/api.example.com',\n]);\n```\n\n## Configuration\n\nThe unified `Configuration` class replaces the deprecated `ServerConfiguration` and `ClientConfiguration`. It provides immutable builder patterns with `with*` methods and supports BDP auto-tuning for both client and server connections. When `maxReceiveWindowSize` is set, the connection dynamically sizes its receive window based on measured throughput and RTT using PING round-trips. Both `ClientConnection` and `ServerConnection` accept the new `Configuration` alongside their legacy types for backwards compatibility.\n\n## Extension Frames\n\nBeyond the core 10 frame types, the component supports:\n\n- **ALTSVC** (0xa) -- RFC 7838 alternative service advertisement\n- **ORIGIN** (0xc) -- RFC 8336 authoritative origin declaration\n- **PRIORITY_UPDATE** (0x10) -- RFC 9218 extensible priority scheme\n\nUnknown frame types are silently ignored per the RFC, ensuring forward compatibility.\n\nSee [src\/Psl\/H2\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/h2\/src\/Psl\/H2\/) for the full API.\n","hpack":"# HPACK\n\nThe `HPACK` component implements RFC 7541 header compression for HTTP\/2. It provides an `Encoder` and `Decoder` that compress and decompress HTTP header fields using static table lookups, dynamic table indexing, and Huffman coding.\n\n## Encoding and Decoding\n\nBoth encoder and decoder are stateful - they maintain a dynamic table that evolves across multiple calls within the same HTTP\/2 connection. Each connection should use its own instances.\n\n```php\nuse Psl\\HPACK;\nuse Psl\\IO;\n\n\/\/ Encode request headers\n$encoder = new HPACK\\Encoder();\n$encoded = $encoder->encode([\n    new HPACK\\Header(':method', 'GET'),\n    new HPACK\\Header(':path', '\/'),\n    new HPACK\\Header(':scheme', 'https'),\n    new HPACK\\Header(':authority', 'example.com'),\n    new HPACK\\Header('accept', 'text\/html'),\n]);\n\nIO\\write_line('Encoded %d bytes', strlen($encoded));\n\n\/\/ Decode on the other side\n$decoder = new HPACK\\Decoder();\n$headers = $decoder->decode($encoded);\n\nforeach ($headers as $header) {\n    IO\\write_line('%s: %s', $header->name, $header->value);\n}\n```\n\n## Sensitive Headers\n\nHeaders marked as sensitive (e.g. authorization, cookies) are encoded with the \"never indexed\" representation, preventing intermediary proxies from caching them in their dynamic tables.\n\n```php\nuse Psl\\HPACK;\nuse Psl\\IO;\n\n\/\/ Sensitive headers are encoded with \"never indexed\" representation,\n\/\/ preventing intermediary proxies from caching them in their dynamic tables.\n$encoder = new HPACK\\Encoder();\n$encoded = $encoder->encode([\n    new HPACK\\Header(':method', 'POST'),\n    new HPACK\\Header(':path', '\/login'),\n    new HPACK\\Header(':scheme', 'https'),\n    new HPACK\\Header(':authority', 'example.com'),\n    new HPACK\\Header('authorization', 'Bearer secret-token', sensitive: true),\n    new HPACK\\Header('cookie', 'session=abc123', sensitive: true),\n]);\n\n$decoder = new HPACK\\Decoder();\n$headers = $decoder->decode($encoded);\n\nforeach ($headers as $header) {\n    $flag = $header->sensitive ? ' [sensitive]' : '';\n    IO\\write_line('%s: %s%s', $header->name, $header->value, $flag);\n}\n```\n\n## Response Encoding\n\n`encodeWithStatus()` is a convenience method for HTTP\/2 response encoding. It prepends the `:status` pseudo-header and benefits from static table indexing for common status codes.\n\n```php\nuse Psl\\HPACK;\nuse Psl\\IO;\n\n\/\/ encodeWithStatus() is optimized for HTTP\/2 response encoding.\n\/\/ It prepends the :status pseudo-header in one pass without\n\/\/ allocating an intermediate array.\n$encoder = new HPACK\\Encoder();\n$encoded = $encoder->encodeWithStatus('200', [\n    new HPACK\\Header('content-type', 'application\/json'),\n    new HPACK\\Header('cache-control', 'no-cache'),\n]);\n\n$decoder = new HPACK\\Decoder();\n$headers = $decoder->decode($encoded);\n\nforeach ($headers as $header) {\n    IO\\write_line('%s: %s', $header->name, $header->value);\n}\n\n\/\/ Output:\n\/\/ :status: 200\n\/\/ content-type: application\/json\n\/\/ cache-control: no-cache\n```\n\n## Table Management\n\nThe dynamic table size can be adjusted at runtime via `resize()`. This is typically driven by the HTTP\/2 SETTINGS_HEADER_TABLE_SIZE parameter negotiated between peers.\n\nThe maximum decompressed header list size is configurable via the constructor or `setMaxHeaderListSize()`. Headers that exceed this limit throw `HeaderListSizeException`.\n\nSee [src\/Psl\/HPACK\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/hpack\/src\/Psl\/HPACK\/) for the full API.\n","http-client":"# HTTP Client\n\nThe `HTTP Client` component provides an async HTTP client with connection pooling, HTTP\/2 multiplexing, automatic protocol negotiation via ALPN, middleware support, and composable decorators for redirects and retries. All I\/O is non-blocking and built on the PSL async runtime.\n\n## Basic Usage\n\nCreate a client, build a request, and send it. The returned transaction contains the response with status, headers, and a streaming body.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com'));\n\n$tx = $client->send($request);\n\n$tx->response->status;\n$tx->response->protocolVersion;\n$tx->response->headers->get('content-type');\n$tx->response->body?->readAll();\n```\n\n## Sending Data\n\nSend a POST request with a JSON body and custom headers using `IO\\MemoryHandle` for the request body.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n$request = new Message\\Request(\n    method: Message\\METHOD_POST,\n    url: URL\\parse('https:\/\/httpbin.org\/post'),\n    headers: Message\\FieldMap::from([\n        ['Content-Type',  'application\/json'],\n        ['Accept',        'application\/json'],\n        ['Authorization', 'Bearer tok_example'],\n    ]),\n    body: new IO\\MemoryHandle('{\"name\": \"Alice\", \"email\": \"alice@example.com\"}'),\n);\n\n$tx = $client->send($request);\n\n$tx->response->status;\n$tx->response->body?->readAll();\n```\n\n## Concurrent Requests\n\nUse `Async\\concurrently()` to send multiple requests in parallel over the same client. HTTP\/2 connections are automatically multiplexed.\n\n```php\nuse Psl\\Async;\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n$transactions = Async\\concurrently([\n    'users' => static fn() => $client->send(new Message\\Request(\n        method: Message\\METHOD_GET,\n        url: URL\\parse('https:\/\/httpbin.org\/get?resource=users'),\n    )),\n    'posts' => static fn() => $client->send(new Message\\Request(\n        method: Message\\METHOD_GET,\n        url: URL\\parse('https:\/\/httpbin.org\/get?resource=posts'),\n    )),\n    'comments' => static fn() => $client->send(new Message\\Request(\n        method: Message\\METHOD_GET,\n        url: URL\\parse('https:\/\/httpbin.org\/get?resource=comments'),\n    )),\n]);\n\n$transactions['users']->response->status;\n$transactions['posts']->response->body?->readAll();\n```\n\n## Redirects\n\n`RedirectClient` wraps any client and automatically follows 3xx redirects with credential stripping on cross-origin hops and method rewriting per RFC 9110.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\RedirectClient(new Client\\Client(), maxRedirects: 5, autoReferrer: true);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/httpbin.org\/redirect\/3'));\n\n$tx = $client->send($request);\n\n$tx->response->status;\n```\n\n## Retries\n\n`RetryClient` wraps any client and retries idempotent requests on transport-level failures with exponential backoff.\n\n```php\nuse Psl\\DateTime\\Duration;\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\RetryClient(\n    new Client\\RedirectClient(new Client\\Client()),\n    maxAttempts: 3,\n    backoff: Duration::milliseconds(200),\n    backoffMultiplier: 2,\n);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com\/api\/data'));\n\n$tx = $client->send($request);\n\n$tx->response->status;\n```\n\n## Configuration\n\n`ClientConfiguration` controls TLS settings, protocol version preferences, response size limits, base URL, and proxy configuration.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\HTTP\\Message\\ProtocolVersion;\nuse Psl\\TLS;\nuse Psl\\URL;\n\n$configuration = new Client\\ClientConfiguration(\n    maxResponseHeaderSize: 16_384,\n    maxResponseBodySize: 50_000_000,\n    baseUrl: URL\\parse('https:\/\/api.example.com\/v2'),\n    tlsConfiguration: new TLS\\ClientConfiguration(minimumVersion: TLS\\Version::Tls12),\n    protocolVersions: [ProtocolVersion::V20, ProtocolVersion::V11],\n);\n\n$client = new Client\\Client(configuration: $configuration);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: null, requestTarget: '\/users');\n\n$tx = $client->send($request);\n\n$tx->response->status;\n```\n\n## Per-Request Overrides\n\n`SendConfiguration` overrides specific client settings for a single request without affecting the client default.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\HTTP\\Message\\ProtocolVersion;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com\/large-file.tar.gz'));\n\n$tx = $client->send(\n    $request,\n    new Client\\SendConfiguration(maxResponseBodySize: 500_000_000, protocolVersions: [ProtocolVersion::V11]),\n);\n\n$tx->response->status;\n$tx->response->body?->readAll();\n```\n\n## SSRF Protection\n\n`DeniedDestinationsMiddleware` inspects the resolved peer IP after connection establishment and blocks requests to private, loopback, and link-local addresses.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\Client(middleware: [Client\\Middleware\\DeniedDestinationsMiddleware::forPrivateNetworkRanges()]);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com'));\n$tx = $client->send($request);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('http:\/\/169.254.169.254\/metadata'));\n$tx = $client->send($request);\n```\n\n## Proxy Modes\n\nThe client supports three proxy modes, configured via `ClientConfiguration` or overridden per-request via `SendConfiguration`:\n\n- **No proxy** (default): The client connects directly to the target server.\n- **HTTP proxy** (`$proxyConfiguration`): Configured via a `ProxyConfiguration` object that holds the proxy URL, optional `Proxy-Authorization` header, TLS SNI hostname, and bypass list. For HTTPS targets, the client connects to the proxy and issues an HTTP\/1.1 CONNECT request to create a tunnel. For plain HTTP targets, the client connects to the proxy directly and uses absolute-form request targets per RFC 7230 Section 5.3.2 (forward proxying). The `$skipProxyFor` list on the configuration specifies hosts that bypass the proxy entirely.\n- **SOCKS5 proxy** (`$socksConfiguration`): All TCP connections are routed through the SOCKS5 proxy server. TLS, ALPN negotiation, and HTTP framing happen on top of the tunneled connection unchanged.\n\nBoth proxy types can be combined: when both `$socksConfiguration` and `$proxyConfiguration` are set, the SOCKS5 proxy tunnels the TCP connection to the HTTP proxy, which then handles HTTP forward proxying or CONNECT tunneling.\n\n## SOCKS Proxy\n\nRoute all TCP connections through a SOCKS5 proxy using `$socksConfiguration`. TLS and ALPN negotiation happen on top of the tunneled connection.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\Socks;\nuse Psl\\URL;\n\n$configuration = new Client\\ClientConfiguration(socksConfiguration: new Socks\\Configuration(\n    proxyHost: 'proxy.example.com',\n    proxyPort: 1080,\n    username: 'user',\n    password: 'secret', \/\/ @mago-expect lint:no-literal-password\n));\n\n$client = new Client\\Client(configuration: $configuration);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com'));\n\n$tx = $client->send($request);\n\n$tx->response->status;\n```\n\n## HTTP Proxy\n\nUse `$proxyConfiguration` to route requests through an HTTP proxy. Configure the proxy URL, authentication, and bypass rules via `ProxyConfiguration`. HTTPS targets use CONNECT tunneling while plain HTTP targets use forward proxying with absolute-form request targets.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$configuration = new Client\\ClientConfiguration(\n    proxyConfiguration: new Client\\ProxyConfiguration(\n        URL\\parse('http:\/\/proxy.example.com:8080'),\n        skipProxyFor: [\n            'localhost',\n            '.internal.example.com',\n        ],\n    ),\n);\n\n$client = new Client\\Client(configuration: $configuration);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com'));\n$tx = $client->send($request);\n\n$tx->response->status;\n```\n\n## HTTP\/2 over Plaintext (h2c)\n\nFor servers that support HTTP\/2 without TLS, set `protocolVersions` to only `ProtocolVersion::V20`. The client uses prior-knowledge mode per RFC 9113 Section 3.4 - it sends the HTTP\/2 connection preface directly on the TCP connection, skipping TLS and ALPN negotiation entirely.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\Client(\n    configuration: new Client\\ClientConfiguration(protocolVersions: [Message\\ProtocolVersion::V20]),\n);\n\n$tx = $client->send(new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('http:\/\/localhost:8080\/')));\n\n$tx->response->protocolVersion; \/\/ ProtocolVersion::V20\n$tx->response->status; \/\/ 200\n$tx->response->body?->readAll();\n```\n\n## Request Body Rules\n\nTRACE requests that include a body are rejected with a `RequestException` per RFC 9110 Section 9.3.8. GET and HEAD requests are allowed to carry a body (useful for Elasticsearch-style query bodies), although this is not recommended per RFC 9110 Section 9.3.1.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n\/\/ TRACE requests with a body throw RequestException per RFC 9110 Section 9.3.8\ntry {\n    $client->send(new Message\\Request(\n        method: Message\\METHOD_TRACE,\n        url: URL\\parse('https:\/\/example.com'),\n        body: new IO\\MemoryHandle('trace body'),\n    ));\n} catch (Client\\Exception\\RequestException $e) {\n    \/\/ \"TRACE requests must not include a body.\"\n    $e->getMessage();\n}\n\n\/\/ TRACE without a body is allowed\n$tx = $client->send(new Message\\Request(method: Message\\METHOD_TRACE, url: URL\\parse('https:\/\/example.com')));\n\n\/\/ GET with a body is allowed (useful for Elasticsearch-style query bodies)\n\/\/ but not recommended per RFC 9110 Section 9.3.1\n$tx = $client->send(new Message\\Request(\n    method: Message\\METHOD_GET,\n    url: URL\\parse('https:\/\/elasticsearch.example.com\/_search'),\n    headers: new Message\\FieldMap([['content-type', 'application\/json']]),\n    body: new IO\\MemoryHandle('{\"query\":{\"match_all\":{}}}'),\n));\n\n$tx->response->status;\n$tx->response->body?->readAll();\n```\n\n## Connection Timeout\n\n`SendConfiguration::$connectionTimeout` sets the maximum duration for establishing a connection (TCP handshake + TLS handshake) on a per-request basis. When set, the connector's cancellation token is linked with a timeout token scoped to this duration. The overall request cancellation token still applies independently.\n\n```php\nuse Psl\\Async;\nuse Psl\\DateTime\\Duration;\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com'));\n\n\/\/ Limit the connection phase (TCP + TLS handshake) to 5 seconds.\n\/\/ The overall request cancellation token still applies independently.\ntry {\n    $tx = $client->send($request, new Client\\SendConfiguration(connectionTimeout: Duration::seconds(5)));\n\n    $tx->response->status; \/\/ 200\n} catch (Async\\Exception\\CancelledException) {\n    \/\/ @mago-expect lint:no-empty-catch-clause - Connection took longer than 5 seconds\n}\n```\n\n## Callbacks\n\n`SendConfiguration` provides two per-request callbacks for observing connection and protocol events:\n\n- `onConnection(ConnectionMetadata): void` fires immediately after a connection is acquired (fresh or pooled), before the HTTP exchange. Use it to inspect the peer IP, local address, and TLS negotiation state.\n- `onInformationalResponse(Response): void` fires for each 1xx response as it arrives (100 Continue, 103 Early Hints, etc.).\n\n`ClientConfiguration` also accepts an `onInformationalResponse` callback that applies to all requests. When both the client-level and per-request callbacks are set, the client-level callback fires first, followed by the per-request callback.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Client\\Connection\\ConnectionMetadata;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com'));\n\n$tx = $client->send(\n    $request,\n    new Client\\SendConfiguration(\n        onConnection: static function (ConnectionMetadata $metadata): void {\n            \/\/ Peer address is the resolved IP after DNS resolution\n            $metadata->peerAddress->host; \/\/ e.g. \"93.184.216.34\"\n            $metadata->peerAddress->port; \/\/ e.g. 443\n\n            \/\/ Local address is the ephemeral socket on this machine\n            $metadata->localAddress->host; \/\/ e.g. \"192.168.1.100\"\n            $metadata->localAddress->port; \/\/ e.g. 52431\n\n            \/\/ TLS state is available for HTTPS connections\n            if ($metadata->tlsState !== null) {\n                $metadata->tlsState->version; \/\/ e.g. TLS\\Version::Tls13\n                $metadata->tlsState->cipherName; \/\/ e.g. \"TLS_AES_256_GCM_SHA384\"\n                $metadata->tlsState->alpnProtocol; \/\/ e.g. \"h2\"\n                $metadata->tlsState->peerCertificate; \/\/ server certificate\n            }\n        },\n        onInformationalResponse: static function (Message\\Response $response): void {\n            \/\/ Fires for each 1xx response (100 Continue, 103 Early Hints, etc.)\n            $response->status; \/\/ e.g. 103\n            $response->headers->getAll('link'); \/\/ e.g. [\"<\/style.css>; rel=preload; as=style\"]\n        },\n    ),\n);\n\n$tx->response->status;\n```\n\n## Informational Responses\n\nHTTP servers may send one or more 1xx informational responses before the final response. These are delivered in two ways:\n\n1. The `onInformationalResponse` callback (on `ClientConfiguration` or `SendConfiguration`) fires as each 1xx response arrives.\n2. All 1xx responses are collected in `Transaction::$informational` in chronological order.\n\nCommon informational responses include 100 Continue (the server is ready for the request body), 102 Processing (WebDAV, long-running operation), and 103 Early Hints (preliminary headers for resource preloading per RFC 8297).\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n\/\/ Client-level callback fires for all requests\n$client = new Client\\Client(\n    configuration: new Client\\ClientConfiguration(onInformationalResponse: static function (Message\\Response $response): void {\n        if ($response->status === 103) {\n            \/\/ Extract Link headers from 103 Early Hints for resource preloading\n            foreach ($response->headers->getAll('link') as $link) {\n                \/\/ e.g. \"<\/style.css>; rel=preload; as=style\"\n                \/\/ Begin preloading the linked resource\n                $link;\n            }\n        }\n    }),\n);\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com'));\n\n\/\/ Per-request callback fires after the client-level callback\n$tx = $client->send($request, new Client\\SendConfiguration(onInformationalResponse: static function (Message\\Response $response): void {\n    \/\/ This fires after the client-level callback for each 1xx response\n    if ($response->status === 100) {\n        \/\/ Server acknowledged Expect: 100-continue, body will be sent\n    }\n}));\n\n\/\/ Informational responses are also collected in the transaction\nforeach ($tx->informational as $info) {\n    $info->status; \/\/ 100, 102, 103, etc.\n    $info->headers; \/\/ headers from the informational response\n}\n\n$tx->response->status; \/\/ final 2xx-5xx response\n```\n\n## Connection Metadata\n\n`ConnectionMetadata` captures the transport-level details of a connection at acquisition time. It is available through the `onConnection` callback on `SendConfiguration`.\n\n| Property | Type | Description |\n|----------|------|-------------|\n| `localAddress` | `Network\\Address` | Local socket endpoint (IP and ephemeral port) |\n| `peerAddress` | `Network\\Address` | Resolved remote address after DNS resolution |\n| `tlsState` | `TLS\\ConnectionState` or `null` | TLS session details for HTTPS, `null` for plaintext |\n\nThe `TLS\\ConnectionState` includes `version`, `cipherName`, `cipherBits`, `alpnProtocol`, `peerCertificate`, and `peerCertificateChain`.\n\n## Configuration Merging\n\n`SendConfiguration` fields override the client's `ClientConfiguration` on a per-request basis via `ClientConfiguration::withOverrides()`. Null fields in `SendConfiguration` inherit from the client default; non-null fields replace the client value for that request only.\n\nThe following fields are overridable per-request:\n\n| Field | Overridable |\n|-------|-------------|\n| `maxResponseHeaderSize` | Yes |\n| `maxResponseBodySize` | Yes |\n| `baseUrl` | Yes |\n| `tlsConfiguration` | Yes |\n| `protocolVersions` | Yes |\n| `proxyConfiguration` | Yes |\n| `onInformationalResponse` | Yes (merged, not replaced) |\n| `connectionTimeout` | Per-request only (not on `ClientConfiguration`) |\n| `onConnection` | Per-request only (not on `ClientConfiguration`) |\n| `socksConfiguration` | No (client-only) |\n| `unixSocket` | No (client-only) |\n| `h2ClientConfiguration` | No (client-only) |\n\n> The `onInformationalResponse` callback receives special treatment: when both the client and send configuration define one, they are composed into a single callback that invokes the client-level callback first, then the per-request callback.\n\n> All other overridable fields, including `proxyConfiguration`, are fully replaced by the per-request value when set. For example, setting `proxyConfiguration` on `SendConfiguration` completely overwrites the client-level proxy settings; they are not merged.\n\n## Middleware\n\nConnection-level middleware runs after the connection is established but before the HTTP exchange. Middleware has access to the `ConnectionInterface`, including the resolved peer address and TLS state. This enables security checks (SSRF protection), logging, metrics, and request\/response transformation.\n\nMiddleware must do one of two things:\n\n1. **Delegate**: Call `$handler->handle(...)` to continue the chain. The handler calls `finalize()` internally.\n2. **Short-circuit**: Return a `Transaction` directly. When short-circuiting, you MUST call `$connection->finalize()` on the transaction before returning it. Without finalization, the underlying connection is never released back to the pool, causing a connection leak.\n\nMiddleware is registered via the `Client` constructor and applied in order: the first middleware in the list is the outermost (executed first).\n\n```php\nuse Psl\\Async\\CancellationTokenInterface;\nuse Psl\\Async\\NullCancellationToken;\nuse Psl\\DateTime;\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Client\\Connection\\ConnectionInterface;\nuse Psl\\HTTP\\Client\\Handler\\HandlerInterface;\nuse Psl\\HTTP\\Client\\Middleware\\MiddlewareInterface;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n\/\/ Middleware that delegates to the next handler (pass-through with logging)\nfinal readonly class TimingMiddleware implements MiddlewareInterface\n{\n    public function process(\n        ConnectionInterface $connection,\n        Message\\Request $request,\n        Client\\ClientConfiguration $configuration,\n        HandlerInterface $handler,\n        CancellationTokenInterface $cancellation = new NullCancellationToken(),\n    ): Message\\Transaction {\n        $start = DateTime\\Timestamp::monotonic();\n\n        \/\/ Delegate to the next handler. The handler calls finalize() internally.\n        $transaction = $handler->handle($connection, $request, $configuration, $cancellation);\n\n        $elapsed = DateTime\\Timestamp::monotonic()->since($start)->toString();\n        \/\/ Log: \"GET https:\/\/example.com completed in 42.5ms\"\n\n        return $transaction;\n    }\n}\n\n\/\/ Middleware that short-circuits the chain (returns a cached response)\nfinal readonly class CacheMiddleware implements MiddlewareInterface\n{\n    public function __construct(\n        \/** @var array<string, Message\\Response> *\/\n        private array $cache = [],\n    ) {}\n\n    public function process(\n        ConnectionInterface $connection,\n        Message\\Request $request,\n        Client\\ClientConfiguration $configuration,\n        HandlerInterface $handler,\n        CancellationTokenInterface $cancellation = new NullCancellationToken(),\n    ): Message\\Transaction {\n        $cacheKey = $request->method . ':' . $request->requestTarget;\n\n        if (isset($this->cache[$cacheKey])) {\n            \/\/ Short-circuit: MUST call finalize() to release the connection back to the pool\n            return $connection->finalize(new Message\\Transaction([], null, $this->cache[$cacheKey]));\n        }\n\n        \/\/ No cache hit, delegate to the next handler\n        return $handler->handle($connection, $request, $configuration, $cancellation);\n    }\n}\n\n$client = new Client\\Client(middleware: [\n    new TimingMiddleware(),\n    new CacheMiddleware(),\n]);\n\n$tx = $client->send(new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com')));\n\n$tx->response->status;\n```\n\n## HTTP\/1.0 Mode\n\nSetting `protocolVersions` to `[ProtocolVersion::V10]` sends HTTP\/1.0 requests. Connection: close is implicit per RFC 1945, so each request uses a separate TCP connection. Keep-alive and chunked transfer encoding are not available. Trailers are not supported.\n\n```php\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\URL;\n\n\/\/ Force HTTP\/1.0 for legacy server compatibility.\n\/\/ Connection: close is implicit; no keep-alive, no chunked transfer encoding.\n$client = new Client\\Client(\n    configuration: new Client\\ClientConfiguration(protocolVersions: [Message\\ProtocolVersion::V10]),\n);\n\n$tx = $client->send(new Message\\Request(\n    method: Message\\METHOD_GET,\n    url: URL\\parse('http:\/\/legacy-server.example.com\/status'),\n));\n\n$tx->response->protocolVersion; \/\/ ProtocolVersion::V10\n$tx->response->status;\n$tx->response->body?->readAll();\n```\n\n## Trailers\n\nRequest trailers are sent via `Request::$trailers`, an `Awaitable<FieldMap>` that resolves after the body. Response trailers are available via `Response::$trailers`, which resolves after the response body is fully consumed.\n\nTrailers require chunked transfer encoding (HTTP\/1.1) or HTTP\/2 DATA frames. They are not available with HTTP\/1.0. Declare expected trailer field names using the `Trailer` header.\n\n```php\nuse Psl\\Async;\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\URL;\n\n$client = new Client\\Client();\n\n\/\/ Sending request trailers using an Awaitable<FieldMap>.\n\/\/ Trailers are sent after the body with chunked transfer encoding (H1) or after DATA frames (H2).\n$deferred = new Async\\Deferred();\n$request = new Message\\Request(\n    method: Message\\METHOD_POST,\n    url: URL\\parse('https:\/\/example.com\/upload'),\n    headers: new Message\\FieldMap([\n        ['content-type', 'application\/octet-stream'],\n        ['trailer',      'checksum'],\n    ]),\n    body: new IO\\MemoryHandle('file contents here'),\n    trailers: $deferred->getAwaitable(),\n);\n\n\/\/ Resolve the trailers after the body is ready to be sent.\n\/\/ In practice, you would compute the checksum while streaming the body.\n$deferred->complete(new Message\\FieldMap([['checksum', 'sha256=abc123...']]));\n\n$tx = $client->send($request);\n\n\/\/ Reading response trailers. Trailers are available after the body is fully consumed.\n$body = $tx->response->body?->readAll();\n\nif ($tx->response->trailers !== null) {\n    $trailerFields = $tx->response->trailers->await();\n    $trailerFields->get('server-timing'); \/\/ e.g. \"db;dur=53\"\n}\n```\n\n## Connection Pooling\n\nThe default `PooledConnector` manages connection reuse across requests:\n\n- **HTTP\/1.x**: Idle connections are pooled per origin (scheme + host + port) with LIFO checkout. When a request completes and the body is fully consumed, the underlying TCP\/TLS stream is returned to the pool. A global cap of 256 idle connections and a per-host cap of 32 prevent unbounded memory growth.\n- **HTTP\/2**: A single multiplexed connection per origin is shared across concurrent requests. Each request opens one HTTP\/2 stream on the shared connection. If the connection is closed (GOAWAY frame or connection error), it is removed and a new connection is established on the next request.\n- **Connection coalescing**: When multiple fibers concurrently request connections to the same HTTPS origin, the first fiber performs the TLS handshake. If HTTP\/2 is negotiated, waiting fibers reuse the session instead of opening redundant connections. If HTTP\/1.1 is negotiated, waiting fibers establish their own connections.\n\n## Pool Release and Finalize\n\nFor HTTP\/1.x keep-alive connections, the pooled connection is not released until the response body is fully consumed. The response body handle defers the pool release until EOF or close. This prevents a second request from reusing a connection while the first response body is still being read.\n\nThis is why middleware that short-circuits the handler chain MUST call `$connection->finalize()`: finalize wraps the response body (if any) so the connection is properly returned to the pool. Without it, the connection leaks.\n\nFor HTTP\/2 connections, stream lifecycle is managed independently, so finalize returns the transaction as-is.\n\n## Error Handling\n\nThe client throws a structured exception hierarchy. Transport-level exceptions from `Psl\\Network` and `Psl\\IO` propagate unwrapped.\n\n```php\nuse Psl\\Async;\nuse Psl\\HTTP\\Client;\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\Network;\nuse Psl\\URL;\n\n$client = new Client\\RedirectClient(new Client\\Client());\n\ntry {\n    $tx = $client->send(new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com')));\n\n    $tx->response->status;\n} catch (Client\\Exception\\RequestException $e) {\n    IO\\write_line('Invalid request: %s', $e->getMessage());\n} catch (Client\\Exception\\ProtocolException $e) {\n    IO\\write_line('Bad response: %s', $e->getMessage());\n} catch (Client\\Exception\\TooManyRedirectsException $e) {\n    IO\\write_line('Redirect loop: %s', $e->getMessage());\n} catch (Network\\Exception\\RuntimeException $e) {\n    IO\\write_line('Connection failed: %s', $e->getMessage());\n} catch (IO\\Exception\\RuntimeException $e) {\n    IO\\write_line('I\/O error: %s', $e->getMessage());\n} catch (Async\\Exception\\CancelledException) {\n    IO\\write_line('Request cancelled');\n}\n```\n\n## Exception Hierarchy\n\n| Exception | When Thrown |\n|-----------|------------|\n| `Exception\\RuntimeException` | Base class for all HTTP client errors |\n| `Exception\\RequestException` | Request is invalid (missing URL, malformed target, TRACE with body) |\n| `Exception\\ProtocolException` | Malformed response, unsupported protocol, body size exceeded |\n| `Exception\\TooManyRedirectsException` | Redirect limit exceeded (via `RedirectClient`) |\n| `Network\\Exception\\RuntimeException` | Connection refused, DNS failure, connect timeout |\n| `IO\\Exception\\RuntimeException` | Read\/write failure on the underlying socket |\n| `Async\\Exception\\CancelledException` | Cancellation token fired during any stage |\n\n## Protocol Support\n\n| Version | Transport | Negotiation | Multiplexing | Status |\n|---------|-----------|-------------|--------------|--------|\n| HTTP\/1.0 | TCP \/ TLS | Explicit | No | Supported |\n| HTTP\/1.1 | TCP \/ TLS | Default fallback | No (persistent connections) | Supported |\n| HTTP\/2 | TLS (h2) \/ TCP (h2c) | ALPN | Yes (streams over single connection) | Supported |\n| HTTP\/3 | QUIC | ALPN | Yes (independent streams, no HOL blocking) | Planned |\n\n> HTTP\/3 support is not yet available. The client's connector and connection abstractions are designed to accommodate QUIC-based transports in the future without breaking the public API.\n\n## RFC Compliance\n\n| RFC | Coverage |\n|-----|----------|\n| RFC 1945 | HTTP\/1.0 message format |\n| RFC 9110 | HTTP semantics, methods, status codes, redirects, idempotency |\n| RFC 9112 | HTTP\/1.1 message syntax, chunked transfer encoding, persistent connections |\n| RFC 9113 | HTTP\/2 binary framing, HPACK, flow control, server push, multiplexing |\n| RFC 9114 | HTTP\/3 over QUIC (planned, not yet implemented) |\n| RFC 8297 | 103 Early Hints informational responses |\n| RFC 3986 | URI resolution for base URL and redirect Location headers |\n| RFC 1928 | SOCKS5 proxy protocol |\n| RFC 7231 | Historical redirect method rewriting (301\/302 to GET) |\n\nSee [src\/Psl\/HTTP\/Client\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/http-message\/src\/Psl\/HTTP\/Client\/) for the full API.\n","http-message":"# HTTP Message\n\nThe `HTTP Message` component provides version-agnostic HTTP message abstractions. Requests, responses, and headers work identically across HTTP\/1.0, HTTP\/1.1, HTTP\/2, and HTTP\/3. Bodies are streaming (`ReadHandleInterface`), trailers are async (`Awaitable<FieldMap>`), and all objects are immutable.\n\n## Requests\n\nConstruct a request with a method, URL, and optional headers\/body. The request target is derived from the URL automatically.\n\n```php\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\URL;\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com\/api\/users?page=1'));\n\n$request->method; \/\/ \"GET\"\n$request->requestTarget; \/\/ \"\/api\/users?page=1\"\n$request->url?->authority->host; \/\/ \"example.com\"\n$request->protocolVersion; \/\/ ProtocolVersion::V11\n\n$post = new Message\\Request(\n    method: Message\\METHOD_POST,\n    url: URL\\parse('https:\/\/example.com\/api\/users'),\n    headers: Message\\FieldMap::from([\n        ['Content-Type', 'application\/json'],\n        ['Accept',       'application\/json'],\n    ]),\n    body: new IO\\MemoryHandle('{\"name\": \"Alice\"}'),\n);\n```\n\n## Responses\n\nResponses carry a status code, headers, and an optional streaming body. Reason phrases are not stored on the response since HTTP\/2 and HTTP\/3 do not transmit them.\n\n```php\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\n\n$response = new Message\\Response(\n    status: Message\\STATUS_OK,\n    headers: Message\\FieldMap::from([\n        ['Content-Type', 'text\/html; charset=utf-8'],\n    ]),\n    body: new IO\\MemoryHandle('<h1>Hello<\/h1>'),\n);\n\n$response->status; \/\/ 200\n$response->headers->get('Content-Type'); \/\/ \"text\/html; charset=utf-8\"\n\nMessage\\reason_phrase($response->status); \/\/ \"OK\"\nMessage\\reason_phrase(Message\\STATUS_NOT_FOUND); \/\/ \"Not Found\"\n```\n\n## Header Fields\n\n`FieldMap` is an ordered, case-insensitive collection of header field pairs. It supports multiple values for the same name (e.g. Set-Cookie) and preserves insertion order and original casing.\n\n```php\nuse Psl\\HTTP\\Message\\FieldMap;\nuse Psl\\IO;\n\n$headers = FieldMap::from([\n    ['Content-Type', 'application\/json'],\n    ['Accept',       'text\/html'],\n    ['Accept',       'application\/json'],\n    ['X-Request-Id', 'abc-123'],\n]);\n\n$headers->get('content-type'); \/\/ \"application\/json\" (case-insensitive)\n$headers->getAll('Accept'); \/\/ [\"text\/html\", \"application\/json\"]\n$headers->has('X-Request-Id'); \/\/ true\n\n$updated = $headers\n    ->with('Content-Type', 'text\/plain')\n    ->withAdded('Cache-Control', 'no-cache')\n    ->without('X-Request-Id');\n\n$updated->get('Content-Type'); \/\/ \"text\/plain\"\n$updated->has('X-Request-Id'); \/\/ false\n\nforeach ($headers as [$name, $value]) {\n    \/\/ Iterates in insertion order, preserving original casing\n    IO\\write_line('%s: %s', $name, $value);\n}\n```\n\n## Immutable Mutation\n\nAll `with*()` methods return new instances. The original message is never modified.\n\n```php\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\URL;\n\n$request = new Message\\Request(method: Message\\METHOD_GET, url: URL\\parse('https:\/\/example.com\/'));\n\n$modified = $request\n    ->withMethod(Message\\METHOD_POST)\n    ->withUrl(URL\\parse('https:\/\/example.com\/api\/submit'))\n    ->withHeader('Content-Type', 'application\/json')\n    ->withHeader('Authorization', 'Bearer token123')\n    ->withBody(new IO\\MemoryHandle('{\"data\": true}'))\n    ->withProtocolVersion(Message\\ProtocolVersion::V20);\n\n$modified->method; \/\/ \"POST\"\n$modified->protocolVersion; \/\/ ProtocolVersion::V20\n\n$request->method; \/\/ \"GET\" (original unchanged)\n```\n\n## Streaming Bodies\n\nBodies are modeled as `ReadHandleInterface` streams, allowing constant-memory processing of arbitrarily large payloads. Use `MemoryHandle` to create a body from a string.\n\n```php\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\URL;\n\n$request = new Message\\Request(\n    method: Message\\METHOD_POST,\n    url: URL\\parse('https:\/\/example.com\/upload'),\n    headers: Message\\FieldMap::from([\n        ['Content-Type', 'application\/json'],\n    ]),\n    body: new IO\\MemoryHandle('{\"name\": \"Alice\", \"role\": \"admin\"}'),\n);\n\n$body = $request->body;\n$body?->tryRead(16); \/\/ '{\"name\": \"Alice\"' (non-blocking, up to 16 bytes)\n$body?->read(maxBytes: 8); \/\/ ', \"role\"' (suspends until data available)\n\n$response = new Message\\Response(\n    status: Message\\STATUS_OK,\n    body: new IO\\MemoryHandle('<html><body>Hello, world!<\/body><\/html>'),\n);\n\n$response->body?->readAll(); \/\/ '<html><body>Hello, world!<\/body><\/html>'\n```\n\n## Trailers\n\nTrailing header fields arrive after the body has been fully transmitted. They are modeled as `Awaitable<FieldMap>` because the values are not known until the body is complete. Use `Deferred` to create trailers that are resolved later.\n\n```php\nuse Psl\\Async;\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\nuse Psl\\URL;\n\n\/** @var Async\\Deferred<Message\\FieldMap> $deferred *\/\n$deferred = new Async\\Deferred();\n$request = new Message\\Request(\n    method: Message\\METHOD_POST,\n    url: URL\\parse('https:\/\/example.com\/upload'),\n    headers: Message\\FieldMap::from([\n        ['Trailer', 'Checksum'],\n    ]),\n    body: new IO\\MemoryHandle('file contents here'),\n    trailers: $deferred->getAwaitable(),\n);\n\n$deferred->complete(Message\\FieldMap::from([\n    ['Checksum', 'sha256=abc123...'],\n]));\n\n$trailerMap = $request->trailers?->await();\n$trailerMap?->get('Checksum'); \/\/ \"sha256=abc123...\"\n```\n\n## Transactions\n\n`Transaction` groups the final response with any informational (1xx) responses received before it and any HTTP\/2 server-pushed exchanges. This is the return type of connection-level exchange methods.\n\n```php\nuse Psl\\HTTP\\Message;\nuse Psl\\IO;\n\n$earlyHints = new Message\\Response(status: Message\\STATUS_EARLY_HINTS, headers: Message\\FieldMap::from([\n    ['Link', '<\/style.css>; rel=preload; as=style'],\n]));\n\n$finalResponse = new Message\\Response(\n    status: Message\\STATUS_OK,\n    headers: Message\\FieldMap::from([\n        ['Content-Type', 'text\/html'],\n    ]),\n    body: new IO\\MemoryHandle('<h1>Hello<\/h1>'),\n);\n\n$tx = new Message\\Transaction(informational: [$earlyHints], pushed: null, response: $finalResponse);\n\n$tx->response->status; \/\/ 200\n$tx->informational[0]->status; \/\/ 103\n$tx->informational[0]->headers->get('Link'); \/\/ \"<\/style.css>; rel=preload; as=style\"\n$tx->pushed; \/\/ null (no HTTP\/2 server push)\n```\n\n## Status Codes and Methods\n\nMethod and status code constants improve readability and prevent typos. The `reason_phrase()` function maps any status code to its canonical reason phrase for HTTP\/1.x serialization.\n\n```php\nuse Psl\\HTTP\\Message;\n\nMessage\\METHOD_GET; \/\/ \"GET\"\nMessage\\METHOD_POST; \/\/ \"POST\"\nMessage\\METHOD_PUT; \/\/ \"PUT\"\nMessage\\METHOD_DELETE; \/\/ \"DELETE\"\nMessage\\METHOD_PATCH; \/\/ \"PATCH\"\n\nMessage\\STATUS_OK; \/\/ 200\nMessage\\STATUS_CREATED; \/\/ 201\nMessage\\STATUS_NO_CONTENT; \/\/ 204\nMessage\\STATUS_NOT_FOUND; \/\/ 404\nMessage\\STATUS_INTERNAL_SERVER_ERROR; \/\/ 500\n\nMessage\\reason_phrase(Message\\STATUS_OK); \/\/ \"OK\"\nMessage\\reason_phrase(Message\\STATUS_NOT_FOUND); \/\/ \"Not Found\"\nMessage\\reason_phrase(Message\\STATUS_TOO_MANY_REQUESTS); \/\/ \"Too Many Requests\"\nMessage\\reason_phrase(999); \/\/ \"status code 999\"\n```\n\n## Protocol Versions\n\n| Version | Enum Case | Value |\n|---------|-----------|-------|\n| HTTP\/1.0 | `ProtocolVersion::V10` | `HTTP\/1.0` |\n| HTTP\/1.1 | `ProtocolVersion::V11` | `HTTP\/1.1` |\n| HTTP\/2 | `ProtocolVersion::V20` | `HTTP\/2` |\n| HTTP\/3 | `ProtocolVersion::V30` | `HTTP\/3` |\n\n## Status Code Classes\n\n| Range | Class | Example |\n|-------|-------|---------|\n| 1xx | Informational | 100 Continue, 101 Switching Protocols |\n| 2xx | Successful | 200 OK, 201 Created, 204 No Content |\n| 3xx | Redirection | 301 Moved Permanently, 304 Not Modified |\n| 4xx | Client Error | 400 Bad Request, 404 Not Found, 429 Too Many Requests |\n| 5xx | Server Error | 500 Internal Server Error, 502 Bad Gateway |\n\n## RFC Compliance\n\n| RFC | Coverage |\n|-----|----------|\n| RFC 9110 | HTTP semantics: methods, status codes, header fields, message body |\n| RFC 9112 | HTTP\/1.1 message syntax (request line, status line, headers) |\n| RFC 9113 | HTTP\/2 pseudo-headers, trailers, binary framing semantics |\n| RFC 9114 | HTTP\/3 message mapping over QUIC |\n\nSee [src\/Psl\/HTTP\/Message\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/http-message\/src\/Psl\/HTTP\/Message\/) for the full API.\n","message":"# Message\n\nThe `Message` component implements RFC 5322 Internet Message construction, parsing, and serialization. It provides typed access to standard header fields (From, To, Subject, Date, Message-ID, etc.) with the message body represented as a MIME `PartInterface`.\n\n## Construction\n\nMessages are built using the fluent `with*()` methods. Each returns a new immutable instance. Address methods (`withFrom`, `withTo`, `withCc`, `withBcc`, `withReplyTo`) accept a plain string, a `Mailbox`, or an `AddressList`.\n\n```php\nuse Psl\\IO;\nuse Psl\\Message;\nuse Psl\\MIME\\Part;\n\n\/\/ Addresses accept strings, Mailbox, or AddressList\n$message = new Message\\Message()\n    ->withFrom('Alice <alice@example.com>')\n    ->withTo('bob@example.com, carol@example.com')\n    ->withSubject('Hello from PSL')\n    ->withDate(Psl\\DateTime\\DateTime::now())\n    ->withGeneratedMessageId()\n    ->withContent(new Part\\Text(new IO\\MemoryHandle('Hello, World!')));\n\n$message->from; \/\/ AddressList\n$message->to; \/\/ AddressList\n$message->subject; \/\/ \"Hello from PSL\"\n$message->messageId; \/\/ MessageId\n$message->content; \/\/ PartInterface (the text part)\n```\n\n## Multipart Bodies\n\nThe message body is a `PartInterface` from the MIME component. Compose any MIME structure using `Part\\Text`, `Part\\Data`, and the multipart types.\n\n```php\nuse Psl\\IO;\nuse Psl\\Message;\nuse Psl\\MIME\\MediaType;\nuse Psl\\MIME\\MultiPart;\nuse Psl\\MIME\\Part;\n\n\/\/ Text + HTML alternatives\n$alt = new MultiPart\\Alternative();\n$alt->addPart(new Part\\Text(new IO\\MemoryHandle('Plain text version')));\n$alt->addPart(new Part\\Text(new IO\\MemoryHandle('<h1>HTML version<\/h1>'), 'html'));\n\n\/\/ Wrap with an attachment\n$mixed = new MultiPart\\Composite($alt);\n$mixed->addPart(\n    new Part\\Data(\n        new IO\\MemoryHandle('pdf content'),\n        filename: 'report.pdf',\n        mediaType: MediaType::parse('application\/pdf'),\n    ),\n);\n\n$message = new Message\\Message()\n    ->withFrom('alice@example.com')\n    ->withTo('bob@example.com')\n    ->withSubject('Report attached')\n    ->withContent($mixed);\n```\n\n## Serialization and Parsing\n\n`serialize()` produces a streaming RFC 5322 representation. `parse()` accepts a string or a `ReadHandleInterface` for streaming input from network sockets.\n\n```php\nuse Psl\\IO;\nuse Psl\\Message;\nuse Psl\\MIME\\Part;\n\n$message = new Message\\Message()\n    ->withFrom('alice@example.com')\n    ->withTo('bob@example.com')\n    ->withSubject('Round trip')\n    ->withContent(new Part\\Text(new IO\\MemoryHandle('Hello!')));\n\n\/\/ Serialize to a streaming handle (headers + body)\n$handle = Message\\serialize($message);\n\n\/\/ Parse back from a string or handle\n$parsed = Message\\parse($handle);\n\n$parsed->subject; \/\/ \"Round trip\"\n$parsed->from?->mailboxes()[0]?->address; \/\/ \"alice@example.com\"\n$parsed->content->body()->readAll(); \/\/ encoded body content\n```\n\n## Reply, Reply All, Forward\n\nFactory methods derive threading headers (In-Reply-To, References) and address fields from an original message per RFC 5322.\n\n```php\nuse Psl\\IO;\nuse Psl\\Message;\nuse Psl\\Message\\Address\\Mailbox;\nuse Psl\\MIME\\Part;\n\n$original = Message\\parse(\n    \"From: alice@example.com\\r\\nTo: bob@example.com\\r\\nSubject: Hello\\r\\nMessage-ID: <msg-001@example.com>\\r\\n\\r\\nHi Bob!\",\n);\n\n$me = Mailbox::parse('bob@example.com');\n\n\/\/ Reply sets To from original From, prefixes subject, sets threading headers\n$reply = Message\\Message::reply($original, $me)->withContent(new Part\\Text(new IO\\MemoryHandle('Thanks Alice!')));\n\n$reply->subject; \/\/ \"Re: Hello\"\n$reply->inReplyTo; \/\/ [MessageId(\"msg-001@example.com\")]\n$reply->references; \/\/ [MessageId(\"msg-001@example.com\")]\n\n\/\/ Also available: Message::replyAll() and Message::forward()\n```\n\n## SMTP Envelope\n\n`Envelope` derives the transport-level sender (MAIL FROM) and recipients (RCPT TO) from message headers per RFC 5321. These may differ from the visible From\/To\/Cc headers.\n\n```php\nuse Psl\\IO;\nuse Psl\\Message;\nuse Psl\\Message\\Envelope;\nuse Psl\\MIME\\Part;\n\n$message = new Message\\Message()\n    ->withFrom('alice@example.com')\n    ->withTo('bob@example.com')\n    ->withCc('carol@example.com')\n    ->withBcc('dave@example.com')\n    ->withContent(new Part\\Text(new IO\\MemoryHandle('Hello')));\n\n\/\/ Derive SMTP envelope from message headers\n$envelope = Envelope::fromMessage($message);\n\n$envelope->sender; \/\/ Mailbox(\"alice@example.com\")\n$envelope->recipients; \/\/ [bob, carol, dave] (To + Cc + Bcc flattened)\n```\n\n## Addresses\n\nThe `Address` namespace provides RFC 5322 compliant address parsing:\n\n- `Mailbox` represents a single email address with optional display name and RFC 5322 comments\n- `Group` represents a named group of mailboxes (`display-name : mailbox-list ;`)\n- `AddressList` holds an ordered list of mailboxes and groups, with merge and exclude operations\n\nAll address types support RFC 2047 encoded-word display names for non-ASCII characters.\n\n## RFC Compliance\n\n| RFC | Coverage |\n|-----|----------|\n| RFC 5322 | Message format, header fields, address syntax, threading |\n| RFC 5321 | SMTP envelope derivation |\n| RFC 2045 | MIME body integration via PartInterface |\n| RFC 2047 | Encoded-word subjects and display names |\n\nSee [src\/Psl\/Message\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/message\/src\/Psl\/Message\/) for the full API.\n","mime":"# MIME\n\nThe `MIME` component implements the Multipurpose Internet Mail Extensions (RFC 2045-2049) and related standards. It provides media type parsing, MIME part construction, multipart body streaming, content sniffing, S\/MIME cryptography, and DKIM signing - all without filesystem coupling or temporary files.\n\n## Media Types\n\n`MediaType` is an immutable value object representing a MIME media type like `application\/json` or `text\/html; charset=utf-8`. Type and subtype are always lowercased. Structured syntax suffixes and registration trees are extracted automatically.\n\n```php\nuse Psl\\MIME\\MediaType;\n\n$type = MediaType::parse('application\/vnd.api+json; charset=utf-8');\n\n$type->type; \/\/ \"application\"\n$type->subtype; \/\/ \"vnd.api+json\"\n$type->suffix; \/\/ \"json\"\n$type->tree; \/\/ \"vnd\"\n$type->parameters; \/\/ Parameters with charset=utf-8\n$type->essence(); \/\/ \"application\/vnd.api+json\"\n\n\/\/ From file extension\n$json = MediaType::fromExtension('json'); \/\/ application\/json\n\n\/\/ IANA registration\n$type->isRegistered(); \/\/ true\n$type->extensions(); \/\/ [\"json\"]\n```\n\n## Content Negotiation\n\n`MediaPreferences` parses HTTP Accept headers and negotiates the best media type per RFC 9110.\n\n```php\nuse Psl\\MIME\\MediaPreferences;\nuse Psl\\MIME\\MediaType;\n\n$prefs = MediaPreferences::parse('text\/html, application\/json;q=0.9, *\/*;q=0.1');\n\n$best = $prefs->negotiate([\n    new MediaType('application', 'json'),\n    new MediaType('text', 'html'),\n]);\n\n\/\/ $best->essence() === \"text\/html\"\n```\n\n## Parts\n\nParts are the building blocks of MIME messages. Every part implements `PartInterface`, which exposes `$mediaType`, `$headers`, and `body()`.\n\n```php\nuse Psl\\IO;\nuse Psl\\MIME\\Headers;\nuse Psl\\MIME\\MediaType;\nuse Psl\\MIME\\Part;\n\n\/\/ Raw part from headers + body\n$raw = new Part\\Part(Headers::fromPairs([['Content-Type', 'text\/plain']]), new IO\\MemoryHandle('Hello'));\n\n\/\/ Text part with automatic transfer encoding (quoted-printable by default)\n$text = new Part\\Text(new IO\\MemoryHandle('Hello, World!'));\n$text->mediaType; \/\/ text\/plain; charset=utf-8\n\n\/\/ Binary attachment with base64 encoding\n$data = new Part\\Data(\n    new IO\\MemoryHandle('binary content'),\n    filename: 'report.pdf',\n    mediaType: MediaType::parse('application\/pdf'),\n);\n\n\/\/ Convert attachment to inline with Content-ID\n$inline = $data->asInline(Psl\\MIME\\ContentId::generate());\n```\n\n## Multipart Bodies\n\nMultipart types compose multiple parts into a single body, delimited by a boundary string. All multipart types implement `MultiPartInterface` (which extends `PartInterface`), so they nest naturally.\n\n```php\nuse Psl\\IO;\nuse Psl\\MIME\\MediaType;\nuse Psl\\MIME\\MultiPart;\nuse Psl\\MIME\\Part;\n\n\/\/ multipart\/alternative: text + HTML versions\n$alt = new MultiPart\\Alternative();\n$alt->addPart(new Part\\Text(new IO\\MemoryHandle('Plain text')));\n$alt->addPart(new Part\\Text(new IO\\MemoryHandle('<h1>HTML<\/h1>'), subtype: 'html'));\n\n\/\/ multipart\/mixed: body + attachments\n$mixed = new MultiPart\\Composite($alt);\n$mixed->addPart(\n    new Part\\Data(\n        new IO\\MemoryHandle('pdf content'),\n        filename: 'doc.pdf',\n        mediaType: MediaType::parse('application\/pdf'),\n    ),\n);\n\n\/\/ Nested multipart is just $mixed->body() - a streaming read handle\n\/\/ IO\\copy($mixed->body(), $outputHandle);\n```\n\n### Form Data\n\n`Form` builds multipart\/form-data bodies per RFC 7578, for HTML form submissions and file uploads.\n\n```php\nuse Psl\\IO;\nuse Psl\\MIME\\MediaType;\nuse Psl\\MIME\\MultiPart\\Form;\nuse Psl\\MIME\\Part;\n\n$form = new Form();\n$form->addField('username', 'azjezz');\n$form->addField('bio', 'PSL maintainer');\n$form->addPart(\n    'avatar',\n    new Part\\Data(new IO\\MemoryHandle('image bytes'), filename: 'avatar.png', mediaType: MediaType::parse('image\/png')),\n);\n\n$form->mediaType; \/\/ multipart\/form-data; boundary=...\n$form->boundary; \/\/ random 24-char alphanumeric string\n```\n\n### Streaming Parser\n\nThe streaming parser yields parts lazily from a read handle, with configurable limits to prevent abuse.\n\n```php\nuse Psl\\IO;\nuse Psl\\MIME\\MultiPart\\Parser;\n\n$body = \"--boundary\\r\\nContent-Type: text\/plain\\r\\n\\r\\nHello\\r\\n--boundary\\r\\nContent-Type: text\/html\\r\\n\\r\\n<b>World<\/b>\\r\\n--boundary--\\r\\n\";\n\n$parser = new Parser(boundary: 'boundary', maxParts: 100, maxPartSize: 10_000_000, spoolThreshold: 2_097_152);\n\nforeach ($parser->parse(new IO\\MemoryHandle($body)) as $part) {\n    IO\\write_line('%s: %s', $part->mediaType->essence(), $part->body()->readAll());\n}\n```\n\n## S\/MIME Cryptography\n\nSign, verify, encrypt, and decrypt using CMS (RFC 5652) - entirely in-memory without temporary files or `openssl_pkcs7_*` functions.\n\n```php\nuse Psl\\MIME\\SMIME;\n\n\/\/ Signing requires a certificate and private key in PEM format.\n\/\/ Verification can optionally check the certificate chain against trusted CAs.\n\/\/ Encryption requires the recipient's certificate; decryption requires their private key.\n\/\/ All operations are in-memory -- no temporary files or openssl_pkcs7_* calls.\n\n\/** @var string $certPem *\/\n\/** @var string $keyPem *\/\n\/** @var string $caCertPem *\/\n\/** @var string $recipientCertPem *\/\n\/** @var string $recipientKeyPem *\/\n\n\/\/ Sign and verify\n$signer = new SMIME\\Signer($certPem, $keyPem);\n$signed = $signer->sign('Hello');\n\n$verifier = new SMIME\\Verifier([$caCertPem]);\n$result = $verifier->verify($signed, verifyCertificateChain: true);\n$result->valid; \/\/ true\n$result->content; \/\/ \"Hello\"\n$result->digestAlgorithm; \/\/ DigestAlgorithm::Sha256\n\n\/\/ Encrypt and decrypt\n$encryptor = new SMIME\\Encryptor([$recipientCertPem], SMIME\\CipherAlgorithm::Aes256Cbc);\n$encrypted = $encryptor->encrypt('Secret');\n\n$decryptor = new SMIME\\Decryptor($recipientKeyPem);\n$decrypted = $decryptor->decrypt($encrypted); \/\/ \"Secret\"\n```\n\n## DKIM Signing\n\nSign raw MIME messages with DKIM (RFC 6376) using RSA-SHA256 or Ed25519-SHA256 (RFC 8463). RSA keys below 1024 bits are rejected per RFC 8301.\n\n```php\nuse Psl\\MIME\\DKIM;\n\n\/** @var string $rsaPrivateKeyPem *\/\n\n$config = new DKIM\\SigningConfiguration(\n    domain: 'example.com',\n    selector: 'default',\n    algorithm: DKIM\\Algorithm::RsaSha256,\n    headerCanonicalization: DKIM\\Canonicalization::Relaxed,\n    bodyCanonicalization: DKIM\\Canonicalization::Relaxed,\n);\n\n$signer = new DKIM\\Signer($rsaPrivateKeyPem, $config);\n\n$rawMessage = \"From: sender@example.com\\r\\nTo: rcpt@example.com\\r\\nSubject: Test\\r\\n\\r\\nHello!\";\n$signedMessage = $signer->sign($rawMessage);\n\n\/\/ $signedMessage now has a DKIM-Signature header prepended\n```\n\n## Content Sniffing\n\nDetect MIME types from content bytes using magic signatures, RIFF sub-formats, ISO BMFF brands, and text heuristics. Works on raw byte strings or seekable read handles.\n\n## RFC Compliance\n\n| RFC | Coverage |\n|-----|----------|\n| RFC 2045 | Media types, parameters, transfer encoding |\n| RFC 2046 | Multipart bodies, boundary rules |\n| RFC 2183 | Content-Disposition with safe filename |\n| RFC 2231 | Parameter encoding with continuations and charset |\n| RFC 2387 | multipart\/related |\n| RFC 2392 | Content-ID parsing and generation |\n| RFC 5322 | Header line folding |\n| RFC 5652 | CMS signing, verification, encryption, decryption |\n| RFC 6376 | DKIM signing with simple\/relaxed canonicalization |\n| RFC 6838 | Media type registration, suffix\/tree extraction |\n| RFC 7578 | multipart\/form-data |\n| RFC 8301 | DKIM minimum key size enforcement |\n| RFC 8463 | Ed25519-SHA256 DKIM signing |\n| RFC 8551 | S\/MIME 4.0 message specification |\n| RFC 9110 | Content negotiation (Accept header) |\n\nSee [src\/Psl\/MIME\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/mime\/src\/Psl\/MIME\/) for the full API.\n","smtp":"# SMTP\n\nThe `SMTP` component implements an RFC 5321 SMTP client with connection pooling, TLS, authentication, and support for modern SMTP extensions. It integrates with the `Message` and `MIME` components for complete email sending.\n\n## Sending a Message\n\nThe `Transport` handles the full SMTP lifecycle: connection, EHLO, TLS, authentication, message transmission, and connection reuse. Pass an `Envelope` (derived from message headers) and a `MessageInterface` to send.\n\n```php\nuse Psl\\IO;\nuse Psl\\Message\\Address\\Mailbox;\nuse Psl\\Message\\Envelope;\nuse Psl\\Message\\Message;\nuse Psl\\MIME\\Part;\nuse Psl\\SMTP\\Client\\Transport;\nuse Psl\\SMTP\\Client\\TransportConfiguration;\nuse Psl\\SMTP\\Security;\n\n$transport = new Transport(\n    TransportConfiguration::default()->withHost('smtp.example.com')->withSecurity(Security::TLS),\n);\n\n$sender = new Mailbox('alice', 'example.com', 'Alice');\n$recipient = new Mailbox('bob', 'example.com');\n\n$message = new Message()\n    ->withFrom($sender)\n    ->withTo($recipient)\n    ->withSubject('Hello from PSL')\n    ->withContent(new Part\\Text(new IO\\MemoryHandle('Hello, Bob!')));\n\n$report = $transport->send(Envelope::fromMessage($message), $message);\n\n$transport->close();\n```\n\n## Authentication\n\nFive authentication mechanisms are supported. Pass any `AuthenticatorInterface` as the second argument to `Transport`.\n\n```php\nuse Psl\\SMTP\\Client\\Authentication;
