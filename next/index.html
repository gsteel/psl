\nuse Psl\\SMTP\\Client\\Transport;\nuse Psl\\SMTP\\Client\\TransportConfiguration;\nuse Psl\\SMTP\\Security;\n\n\/\/ PLAIN authentication\n$plain = new Authentication\\PlainAuthenticator('user', 'password');\n\n\/\/ LOGIN authentication\n$login = new Authentication\\LoginAuthenticator('user', 'password');\n\n\/\/ XOAUTH2 for Gmail and other OAuth2-enabled servers\n$oauth = new Authentication\\XOAuth2Authenticator('user@gmail.com', 'oauth2-access-token');\n\n\/\/ CRAM-MD5 challenge-response (avoids sending password in plaintext)\n$cramMd5 = new Authentication\\CRAMMD5Authenticator('user', 'password');\n\n\/\/ SCRAM-SHA-256 with mutual authentication (RFC 7677)\n$scram = new Authentication\\SCRAMSHA256Authenticator('user', 'password');\n\n\/\/ Pass any authenticator as the second argument to Transport\n$transport = new Transport(\n    TransportConfiguration::default()->withHost('smtp.gmail.com')->withSecurity(Security::TLS),\n    $oauth,\n);\n```\n\n## Transport Configuration\n\n`TransportConfiguration` controls connection-level settings: host, port, security mode, pipelining, chunking, and TCP\/TLS options. All settings are immutable with fluent `with*()` builders.\n\n```php\nuse Psl\\SMTP\\Client\\TransportConfiguration;\nuse Psl\\SMTP\\Security;\nuse Psl\\TCP;\nuse Psl\\TLS;\n\n\/\/ All transport settings are immutable with fluent with*() builders\n$config = TransportConfiguration::default()\n    ->withHost('smtp.example.com')\n    ->withPort(465)\n    ->withSecurity(Security::TLS)\n    ->withLocalHostname('client.example.com')\n    ->withPipelining(true)\n    ->withChunking(true)\n    ->withChunkSize(32_768)\n    ->withAllowPartialSuccess(false);\n\n\/\/ TCP and TLS settings are configurable independently\n$config = $config\n    ->withConnectConfiguration(new TCP\\ConnectConfiguration(noDelay: true))\n    ->withTlsClientConfiguration(new TLS\\ClientConfiguration(peerVerification: true, allowSelfSigned: false));\n```\n\n## Send Configuration\n\n`SendConfiguration` controls per-send MAIL FROM extension parameters: DSN notifications, REQUIRETLS, message priority, delivery deadlines, and deferred delivery.\n\n```php\nuse Psl\\DateTime\\DateTime;\nuse Psl\\DateTime\\Duration;\nuse Psl\\SMTP\\Client\\SendConfiguration;\nuse Psl\\SMTP\\DeliverBy;\nuse Psl\\SMTP\\DeliverByMode;\nuse Psl\\SMTP\\Priority;\n\n\/\/ Per-send parameters control MAIL FROM extensions\n$config = new SendConfiguration()\n    \/\/ DSN: request delivery status notifications (RFC 3461)\n    ->withDsnReturn('FULL')\n    ->withDsnEnvelopeId('msg-001')\n    ->withDsnNotify('SUCCESS,FAILURE')\n    \/\/ Require TLS for the entire delivery chain (RFC 8689)\n    ->withRequireTls(true)\n    \/\/ Message priority (RFC 6710 \/ STANAG 4406)\n    ->withPriority(Priority::Urgent)\n    \/\/ Delivery deadline: return if not delivered within 2 hours (RFC 2852)\n    ->withDeliverBy(new DeliverBy(Duration::hours(2), DeliverByMode::Return))\n    \/\/ Deferred delivery: hold for 30 minutes (RFC 4865)\n    ->withFutureRelease(Duration::minutes(30));\n\n\/\/ Or hold until a specific time\n$config = $config->withFutureRelease(DateTime::now()->plusHours(6));\n```\n\n## Partial Recipient Success\n\nBy default, the transport throws on the first rejected recipient. Enable `allowPartialSuccess` to deliver to accepted recipients and report failures via `DeliveryReport`.\n\n```php\nuse Psl\\IO;\nuse Psl\\Message\\Address\\Mailbox;\nuse Psl\\Message\\Envelope;\nuse Psl\\Message\\Message;\nuse Psl\\MIME\\Part;\nuse Psl\\SMTP\\Client\\Transport;\nuse Psl\\SMTP\\Client\\TransportConfiguration;\nuse Psl\\SMTP\\Security;\n\n\/\/ Enable partial success to deliver to accepted recipients\n\/\/ even when some are rejected\n$transport = new Transport(\n    TransportConfiguration::default()\n        ->withHost('smtp.example.com')\n        ->withSecurity(Security::TLS)\n        ->withAllowPartialSuccess(true),\n);\n\n$sender = new Mailbox('noreply', 'example.com');\n$message = new Message()\n    ->withFrom($sender)\n    ->withTo('alice@example.com, bob@invalid.test, carol@example.com')\n    ->withSubject('Team Update')\n    ->withContent(new Part\\Text(new IO\\MemoryHandle('Hello team!')));\n\n$report = $transport->send(Envelope::fromMessage($message), $message);\n\n\/\/ Check for rejected recipients\nif ($report->hasRejections()) {\n    foreach ($report->rejectedRecipients as [$mailbox, $reply]) {\n        \/\/ $mailbox->address: \"bob@invalid.test\"\n        \/\/ $reply->code: 550\n        \/\/ $reply->message: \"User not found\"\n        IO\\write_line($reply->message);\n    }\n}\n\n$transport->close();\n```\n\n## Async and Cancellation\n\nThe transport is fully async-capable. Use `Async\\concurrently` to send multiple messages in parallel with automatic connection pooling. Use cancellation tokens for timeouts.\n\n```php\nuse Psl\\Async;\nuse Psl\\IO;\nuse Psl\\Message\\Address\\Mailbox;\nuse Psl\\Message\\Envelope;\nuse Psl\\Message\\Message;\nuse Psl\\MIME\\Part;\nuse Psl\\SMTP\\Client\\Transport;\nuse Psl\\SMTP\\Client\\TransportConfiguration;\nuse Psl\\SMTP\\Security;\nuse Psl\\Vec;\n\n$transport = new Transport(\n    TransportConfiguration::default()->withHost('smtp.example.com')->withSecurity(Security::TLS),\n);\n\n$sender = new Mailbox('noreply', 'example.com');\n$recipients = ['alice@example.com', 'bob@example.com', 'carol@example.com'];\n\n\/\/ Send to all recipients concurrently, reusing pooled connections\nAsync\\concurrently(Vec\\map($recipients, static fn(string $address): Closure => static function () use (\n    $transport,\n    $sender,\n    $address,\n): void {\n    $recipient = Mailbox::parse($address);\n    $message = new Message()\n        ->withFrom($sender)\n        ->withTo($recipient)\n        ->withSubject('Hello!')\n        ->withContent(new Part\\Text(new IO\\MemoryHandle('Hi there!')));\n\n    $transport->send(Envelope::fromMessage($message), $message);\n}));\n\n\/\/ Send with a timeout using a cancellation token\n$message = new Message()\n    ->withFrom($sender)\n    ->withTo('dave@example.com')\n    ->withSubject('Urgent')\n    ->withContent(new Part\\Text(new IO\\MemoryHandle('Time-sensitive!')));\n\n$transport->send(\n    Envelope::fromMessage($message),\n    $message,\n    cancellation: new Async\\TimeoutCancellationToken(Psl\\DateTime\\Duration::seconds(10)),\n);\n\n$transport->close();\n```\n\n## Low-Level Connection\n\n`Connection` implements `Network\\StreamInterface` and speaks raw SMTP commands. Use it for direct protocol interaction or to build custom transports.\n\n```php\nuse Psl\\SMTP\\Client\\Connection;\nuse Psl\\SMTP\\Command;\nuse Psl\\TCP;\n\n\/\/ Low-level connection for direct SMTP protocol interaction\n$stream = TCP\\connect('smtp.example.com', 25);\n$connection = new Connection($stream);\n\n\/\/ Read the server greeting\n$greeting = $connection->readGreeting();\n\/\/ $greeting->code: 220\n\/\/ $greeting->message: \"smtp.example.com ESMTP\"\n\n\/\/ EHLO to discover capabilities\n$ehlo = $connection->ehlo('client.example.com');\n\n\/\/ Check capabilities\n$connection->supportsCapability('PIPELINING'); \/\/ bool\n$connection->supportsCapability('8BITMIME'); \/\/ bool\n$connection->getCapabilityValue('AUTH'); \/\/ \"PLAIN LOGIN\" or null\n$connection->maxSize; \/\/ int or null\n\n\/\/ Send arbitrary commands\n$reply = $connection->sendCommand(new Command('NOOP'));\n\/\/ $reply->code: 250\n\/\/ $reply->isPositiveCompletion(): true\n\n\/\/ Or send without reading reply (for pipelining)\n$connection->writeCommand(new Command('NOOP'));\n$reply = $connection->readReply();\n\n$connection->close();\n```\n\n## SMTP Extensions\n\nThe transport automatically negotiates these extensions when the server advertises them:\n\n| Extension | RFC | Description |\n|-----------|-----|-------------|\n| PIPELINING | RFC 2920 | Send multiple commands before reading replies |\n| CHUNKING | RFC 3030 | BDAT transfer without dot-stuffing |\n| BINARYMIME | RFC 3030 | Binary content without transfer encoding |\n| 8BITMIME | RFC 6152 | 8-bit MIME transport |\n| SMTPUTF8 | RFC 6531 | Internationalized email addresses |\n| STARTTLS | RFC 3207 | TLS upgrade on plaintext connections |\n| DSN | RFC 3461 | Delivery status notifications |\n| REQUIRETLS | RFC 8689 | End-to-end TLS enforcement |\n| MT-PRIORITY | RFC 6710 | Message priority levels |\n| DELIVERBY | RFC 2852 | Delivery deadline specification |\n| FUTURERELEASE | RFC 4865 | Deferred delivery |\n| SIZE | RFC 1870 | Server maximum message size |\n\n## Security\n\nThe transport validates all SMTP commands for CRLF and null byte injection attacks. Malicious input in addresses, hostnames, or DSN parameters throws `PossibleAttackException` before reaching the wire.\n\nSee [src\/Psl\/SMTP\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/smtp\/src\/Psl\/SMTP\/) for the full API.\n","ansi":"# Ansi\n\nThe `Ansi` component provides pure functions for constructing ANSI escape sequences -- text styling, colors, cursor movement, screen manipulation, hyperlinks, and terminal mode control.\n\nAll functions return immutable sequence objects that implement `CommandInterface`. No I\/O is performed -- call `toString()` to get the raw escape string for writing to a terminal.\n\n## Usage\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Ansi\\Cursor;\nuse Psl\\Ansi\\Screen;\nuse Psl\\Ansi\\Style;\nuse Psl\\IO;\n\n\/\/ Style and color text\nIO\\write(Ansi\\apply('Hello, world!', Style\\bold(), Ansi\\foreground(Color\\green())));\nIO\\write(\"\\n\");\n\n\/\/ Cursor movement\nIO\\write(Cursor\\move_to(1, 1)->toString());\nIO\\write(Cursor\\hide()->toString());\n\n\/\/ Screen control\nIO\\write(Screen\\erase(Screen\\EraseMode::Full)->toString());\nIO\\write(Screen\\title('My App')->toString());\n\n\/\/ Hyperlinks (OSC 8)\nIO\\write(Ansi\\link('Click here', 'https:\/\/example.com', Style\\underline()));\nIO\\write(\"\\n\");\n\n\/\/ Strip ANSI sequences from text\n$plain = Ansi\\strip(\"\\e[1mBold\\e[0m\"); \/\/ \"Bold\"\nIO\\write_line('Stripped: %s', $plain);\n```\n\n## Design\n\nThe component is organized around three sequence types that implement `CommandInterface`:\n\n- **`ControlSequenceIntroducer`** (CSI) -- sequences starting with `\\e[`, used for cursor movement, text styling (SGR), screen erasing, scrolling, and DEC private mode toggling.\n- **`OperatingSystemCommand`** (OSC) -- sequences starting with `\\e]`, used for setting window titles, hyperlinks, clipboard access, and desktop notifications.\n- **`ControlCharacter`** -- single-byte control characters (e.g. BEL `\\x07`) that don't fit the CSI or OSC format.\n\nAll are `final readonly` classes with a `toString()` method that produces the raw escape string. Functions in the component return one of these types (or a plain `string` for composed output like `apply()` and `link()`).\n\n## Text Styling\n\nThe `apply()` function wraps text with SGR (Select Graphic Rendition) sequences and an automatic reset. It accepts any combination of styles and colors:\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Ansi\\Style;\nuse Psl\\IO;\n\n\/\/ Combine multiple styles\nIO\\write(Ansi\\apply('important', Style\\bold(), Style\\underline(), Ansi\\foreground(Color\\red())));\nIO\\write(\"\\n\");\n\n\/\/ Background colors\nIO\\write(Ansi\\apply(' PASS ', Style\\bold(), Ansi\\foreground(Color\\white()), Ansi\\background(Color\\green())));\nIO\\write(\"\\n\");\n```\n\nColors are created through factory functions in the `Color` namespace and passed to `foreground()` or `background()`:\n\n- **16 named colors** -- `black`, `red`, `green`, `yellow`, `blue`, `magenta`, `cyan`, `white`, and their `bright_*` variants\n- **ANSI-256** -- `Color\\ansi256(int $code)` for the 256-color palette\n- **24-bit RGB** -- `Color\\rgb(int $r, int $g, int $b)` for true color\n- **Hex** -- `Color\\hex(string $hex)` for hex color strings like `'#FF6600'`\n\n## Hyperlinks\n\nThe `link()` function wraps text in an OSC 8 hyperlink, with optional SGR styles applied to the visible text:\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Style;\nuse Psl\\IO;\n\nIO\\write(Ansi\\link('GitHub', 'https:\/\/github.com', Style\\bold(), Style\\underline()));\nIO\\write(\"\\n\");\n```\n\nTerminal emulators that support OSC 8 render the text as a clickable link.\n\n## Cursor Control\n\nFunctions in the `Cursor` namespace manipulate cursor position and visibility:\n\n```php\nuse Psl\\Ansi\\Cursor;\nuse Psl\\IO;\n\nIO\\write(Cursor\\move_to(1, 1)->toString()); \/\/ absolute position (1-based row, column)\nIO\\write(Cursor\\up(5)->toString()); \/\/ relative movement\nIO\\write(Cursor\\down(3)->toString());\nIO\\write(Cursor\\forward(10)->toString());\nIO\\write(Cursor\\back(2)->toString());\nIO\\write(Cursor\\save()->toString()); \/\/ save position\nIO\\write(Cursor\\restore()->toString()); \/\/ restore saved position\nIO\\write(Cursor\\hide()->toString()); \/\/ hide cursor\nIO\\write(Cursor\\show()->toString()); \/\/ show cursor\n```\n\n## Screen Control\n\nFunctions in the `Screen` namespace control the display, window properties, and terminal modes.\n\n```php\nuse Psl\\Ansi\\Screen;\nuse Psl\\IO;\n\n\/\/ Erasing and scrolling\nIO\\write(Screen\\erase(Screen\\EraseMode::Full)->toString()); \/\/ erase entire screen\nIO\\write(Screen\\erase_line(Screen\\LineEraseMode::Right)->toString()); \/\/ erase from cursor to end of line\nIO\\write(Screen\\scroll_up(5)->toString()); \/\/ scroll viewport up\n\n\/\/ Window properties\nIO\\write(Screen\\title('My App')->toString()); \/\/ set window title\nIO\\write(Screen\\notify('Build complete')->toString()); \/\/ desktop notification\n\n\/\/ Progress indicator (supported by Windows Terminal, ConEmu, Kitty, Ghostty)\nIO\\write(Screen\\progress(Screen\\ProgressState::Normal, 50)->toString()); \/\/ 50% progress\nIO\\write(Screen\\progress(Screen\\ProgressState::Indeterminate)->toString()); \/\/ animated spinner\nIO\\write(Screen\\progress_clear()->toString()); \/\/ remove indicator\n\n\/\/ Terminal modes\nIO\\write(Screen\\set_mode(Screen\\ScreenMode::AlternateScreen)->toString()); \/\/ alternate screen buffer for TUIs\nIO\\write(Screen\\set_mode(Screen\\ScreenMode::MouseTracking)->toString()); \/\/ mouse click and scroll events\nIO\\write(Screen\\set_mode(Screen\\ScreenMode::BracketedPaste)->toString()); \/\/ distinguish pasted text from typed input\n```\n\n## Examples\n\n### Styled Log Output\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Ansi\\Style;\nuse Psl\\IO;\n\nIO\\write_line(Ansi\\apply('Error: something went wrong', Style\\bold(), Ansi\\foreground(Color\\red())));\nIO\\write_line(Ansi\\apply('Warning: check configuration', Ansi\\foreground(Color\\yellow())));\nIO\\write_line(Ansi\\apply('Success!', Style\\bold(), Ansi\\foreground(Color\\green())));\n```\n\n### TUI Setup and Teardown\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Cursor;\nuse Psl\\Ansi\\Screen;\nuse Psl\\IO;\n\n\/\/ Enter TUI mode\nIO\\write(\n    Screen\\set_mode(Screen\\ScreenMode::AlternateScreen)->toString()\n        . Cursor\\hide()->toString()\n        . Screen\\erase(Screen\\EraseMode::Full)->toString()\n        . Cursor\\move_to(1, 1)->toString()\n        . Screen\\title('My TUI App')->toString(),\n);\n\n\/\/ ... render UI ...\n\n\/\/ Exit TUI mode\nIO\\write(\n    Cursor\\show()->toString()\n        . Ansi\\reset()->toString()\n        . Screen\\reset_mode(Screen\\ScreenMode::AlternateScreen)->toString()\n        . Screen\\title('')->toString(),\n);\n```\n\nSee [src\/Psl\/Ansi\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/ansi\/src\/Psl\/Ansi\/) for the full API.\n","terminal":"# Terminal\n\nThe `Terminal` component provides a full-featured TUI (Terminal User Interface) framework built on top of the `Ansi` and `Async` components.\n\nIt handles the event loop, raw mode, input parsing, diff-based rendering, and provides a library of composable widgets for building interactive terminal applications.\n\n## Quick Start\n\n```php\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class MyState {}\n\n$app = Terminal\\Application::create(new MyState(), title: 'My App');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, MyState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\nreturn $app->run(static function (Terminal\\Frame $frame, MyState $_state): void {\n    $buffer = $frame->buffer();\n\n    Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('Hello, World!')]),\n    ])->render($frame->rect(), $buffer);\n});\n```\n\n## Architecture\n\nThe framework follows an immediate-mode rendering model:\n\n1. **Application** manages the event loop, terminal setup\/teardown, and render scheduling\n2. **Events** are parsed from raw stdin bytes and dispatched to registered handlers\n3. **Frame** is provided to the render callback each tick with a fresh **Buffer**\n4. **Widgets** render themselves into a rectangular **Rect** area of the **Buffer**\n5. **Buffer** diffs against the previous frame and writes only changed cells\n\n## Application\n\n### Local Terminal\n\nFor local terminal applications using STDIN\/STDOUT:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\Terminal;\n\nfinal class AppState {}\n\n$app = Terminal\\Application::create(\n    state: new AppState(),\n    title: 'My App',\n    tickInterval: DateTime\\Duration::milliseconds(16), \/\/ ~60 ticks\/s (default: 16ms)\n    scrollSmoothing: true, \/\/ filter trackpad scroll micro-reversals (default: true)\n    mouseMotion: false, \/\/ track mouse movement, not just clicks (default: false)\n);\n```\n\nThis automatically handles raw mode, terminal size detection, SIGWINCH\/SIGINT signal handling, and in-band resize notifications.\n\n### Custom I\/O\n\nFor remote scenarios (e.g. SSH servers) or testing, where you provide your own I\/O handles:\n\n```php\nuse Psl\\IO;\nuse Psl\\Terminal;\n\nfinal class RemoteState {}\n\n$sshInputStream = IO\\input_handle();\n$sshOutputStream = IO\\output_handle();\n\n$app = Terminal\\Application::custom(\n    state: new RemoteState(),\n    input: $sshInputStream,\n    output: $sshOutputStream,\n    width: 80,\n    height: 24,\n    title: 'Remote App',\n);\n```\n\nIn this mode, raw mode is not managed by the application -- the caller is responsible for it. Signal handlers are not registered, and Ctrl+C is handled via the input stream parser. Use `$app->dispatch(new Event\\Resize($cols, $rows))` to inject resize events.\n\n## Event Handling\n\nRegister handlers for specific event types. Multiple handlers per event type are supported:\n\n```php\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class EventState {}\n\n$app = Terminal\\Application::create(new EventState(), title: 'Events Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, EventState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n\n    if ($event->is('enter')) {\n        \/**\n         * handle enter\n         *\/\n    }\n\n    if ($event->is('up')) {\n        \/**\n         * handle up arrow\n         *\/\n    }\n});\n\n$app->on(Event\\Mouse::class, static function (Event\\Mouse $_event, EventState $_state): void {\n    \/\/ $_event->kind (Press, Release, Drag, ScrollUp, ScrollDown, Move)\n    \/\/ $_event->column, $_event->row\n});\n\n$app->on(Event\\Paste::class, static function (Event\\Paste $_event, EventState $_state): void {\n    \/\/ $_event->text -- the pasted string\n});\n\n$app->on(Event\\Resize::class, static function (Event\\Resize $_event, EventState $_state): void {\n    \/\/ $_event->width, $_event->height\n});\n\n$app->run(static function (Terminal\\Frame $frame, EventState $_state): void {\n    Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('Press Ctrl+C to exit')]),\n    ])->render($frame->rect(), $frame->buffer());\n});\n```\n\nPeriodic callbacks can be registered for tasks like polling or animation:\n\n```php\nuse Psl\\DateTime\\Duration;\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class TimerState\n{\n    public int $ticks = 0;\n}\n\n$app = Terminal\\Application::create(new TimerState(), title: 'Interval Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, TimerState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->interval(Duration::milliseconds(100), static function (TimerState $state): void {\n    \/\/ runs every 100ms\n    $state->ticks++;\n});\n\n$app->run(static function (Terminal\\Frame $frame, TimerState $state): void {\n    Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('Ticks: ' . $state->ticks)]),\n    ])->render($frame->rect(), $frame->buffer());\n});\n```\n\n## Layout\n\nThe layout system splits rectangular areas into sub-regions using constraints:\n\n```php\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Layout;\nuse Psl\\Terminal\\Widget;\n\nfinal class LayoutState {}\n\n$app = Terminal\\Application::create(new LayoutState(), title: 'Layout Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, LayoutState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->run(static function (Terminal\\Frame $frame, LayoutState $_state): void {\n    $buffer = $frame->buffer();\n\n    \/\/ Vertical split: header (3 rows) + content (fill) + footer (1 row)\n    [$header, $content, $footer] = Layout\\vertical($frame, [\n        Layout\\fixed(3),\n        Layout\\fill(),\n        Layout\\fixed(1),\n    ]);\n\n    \/\/ Horizontal split: sidebar (20 cols) + main (fill)\n    [$sidebar, $main] = Layout\\horizontal($content, [\n        Layout\\fixed(20),\n        Layout\\fill(),\n    ]);\n\n    \/\/ Constraints can be wrapped with min\/max\n    \/\/ Layout\\min(10, Layout\\fill());     \/\/ fill, but at least 10\n    \/\/ Layout\\max(50, Layout\\fill());     \/\/ fill, but at most 50\n\n    Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('Header Area')]),\n    ])->render($header, $buffer);\n\n    Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('Sidebar')]),\n    ])->render($sidebar, $buffer);\n\n    Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('Main Content')]),\n    ])->render($main, $buffer);\n\n    Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('Footer')]),\n    ])->render($footer, $buffer);\n});\n```\n\n## Widgets\n\nAll widgets implement `WidgetInterface` with a single method: `render(Rect $area, Buffer $buffer): void`. They use a builder pattern for configuration.\n\n### Paragraph\n\nMulti-line text with wrapping, scrolling, and alignment:\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Ansi\\Style;\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class ParagraphState {}\n\n$app = Terminal\\Application::create(new ParagraphState(), title: 'Paragraph Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, ParagraphState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->run(static function (Terminal\\Frame $frame, ParagraphState $_state): void {\n    Widget\\Paragraph::new([\n        Widget\\Line::new([\n            Widget\\Span::styled('Error: ', Ansi\\foreground(Color\\red()), Style\\bold()),\n            Widget\\Span::raw('something went wrong'),\n        ]),\n        Widget\\Line::new([Widget\\Span::raw('Check the logs for details.')]),\n    ])\n        ->wrap(Widget\\Wrap::Word)\n        ->alignment(Widget\\Alignment::Left)\n        ->scroll(0)\n        ->render($frame->rect(), $frame->buffer());\n});\n```\n\n### Block\n\nA container that draws a border and optional title around an inner widget:\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Ansi\\Style;\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class BlockState {}\n\n$app = Terminal\\Application::create(new BlockState(), title: 'Block Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, BlockState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->run(static function (Terminal\\Frame $frame, BlockState $_state): void {\n    $area = $frame->rect();\n    $buffer = $frame->buffer();\n\n    $block = Widget\\Block::new()\n        ->title(' Status ')\n        ->titleStyle(Ansi\\foreground(Color\\bright_white()), Style\\bold())\n        ->border(Widget\\Border::rounded(Ansi\\foreground(Color\\bright_cyan())))\n        ->padding(right: 1, left: 1)\n        ->margin(top: 1)\n        ->background(Color\\ansi256(235));\n\n    $paragraph = Widget\\Paragraph::new([\n        Widget\\Line::new([Widget\\Span::raw('All systems operational.')]),\n    ]);\n\n    $block->render($area, $paragraph, $buffer);\n});\n```\n\nBorder styles: `Border::rounded()`, `Border::plain()`, `Border::double()`, `Border::thick()`.\n\n### Table\n\nColumnar data with headers, scrolling, and row highlighting:\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class TableState {}\n\n$app = Terminal\\Application::create(new TableState(), title: 'Table Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, TableState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->run(static function (Terminal\\Frame $frame, TableState $_state): void {\n    Widget\\Table::new()\n        ->headers(['Name', 'Status', 'CPU'])\n        ->widths([15, 10, 8])\n        ->rows([\n            [\n                Widget\\Span::raw('nginx'),\n                Widget\\Span::styled('running', Ansi\\foreground(Color\\green())),\n                Widget\\Span::raw('2.1%'),\n            ],\n            [\n                Widget\\Span::raw('postgres'),\n                Widget\\Span::styled('running', Ansi\\foreground(Color\\green())),\n                Widget\\Span::raw('5.3%'),\n            ],\n        ])\n        ->highlight(0)\n        ->highlightStyle(Ansi\\foreground(Color\\bright_white()), Ansi\\background(Color\\blue()))\n        ->render($frame->rect(), $frame->buffer());\n});\n```\n\n### Menu\n\nA selectable list of items with scrolling and highlight:\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class MenuState\n{\n    public int $selectedIndex = 0;\n    public int $scrollOffset = 0;\n}\n\n$app = Terminal\\Application::create(new MenuState(), title: 'Menu Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, MenuState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->run(static function (Terminal\\Frame $frame, MenuState $state): void {\n    Widget\\Menu::new([\n        Widget\\MenuItem::raw('Open File'),\n        Widget\\MenuItem::raw('Save'),\n        Widget\\MenuItem::styled([\n            Widget\\Span::styled('Quit', Ansi\\foreground(Color\\red())),\n        ]),\n    ])\n        ->highlight($state->selectedIndex)\n        ->scroll($state->scrollOffset)\n        ->highlightStyle(Ansi\\foreground(Color\\bright_white()), Ansi\\background(Color\\blue()))\n        ->render($frame->rect(), $frame->buffer());\n});\n```\n\n### Other Widgets\n\n- **Tabs** -- horizontal tab bar with active\/inactive styling\n- **Gauge** -- horizontal progress bar with label and percentage\n- **Sparkline** -- single-row data visualization using Unicode block characters\n- **BarChart** -- vertical bar chart with labels\n- **Scrollbar** -- vertical scrollbar for scrollable content\n- **TextInput** -- single-line text input with cursor and placeholder\n\n### Text Primitives\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Ansi\\Style;\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\nuse Psl\\Terminal\\Widget;\n\nfinal class TextState {}\n\n$app = Terminal\\Application::create(new TextState(), title: 'Text Primitives Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, TextState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->run(static function (Terminal\\Frame $frame, TextState $_state): void {\n    \/\/ Span -- a styled text fragment (the smallest text unit)\n    $plain = Widget\\Span::raw('plain text');\n    $boldRed = Widget\\Span::styled('bold red', Ansi\\foreground(Color\\red()), Style\\bold());\n\n    \/\/ Line -- a horizontal sequence of spans\n    $line = Widget\\Line::new([\n        Widget\\Span::styled('[INFO] ', Ansi\\foreground(Color\\blue())),\n        Widget\\Span::raw('Server started on port 8080'),\n    ]);\n\n    Widget\\Paragraph::new([\n        Widget\\Line::new([$plain]),\n        Widget\\Line::new([$boldRed]),\n        $line,\n    ])->render($frame->rect(), $frame->buffer());\n});\n```\n\n## Buffer\n\nThe `Buffer` is a 2D grid of `Cell` objects. Widgets write to it, and `flush()` performs diff-based rendering:\n\n```php\nuse Psl\\Ansi;\nuse Psl\\Ansi\\Color;\nuse Psl\\Ansi\\Style;\nuse Psl\\Terminal;\nuse Psl\\Terminal\\Event;\n\nfinal class BufferState {}\n\n$app = Terminal\\Application::create(new BufferState(), title: 'Buffer Demo');\n\n$app->on(Event\\Key::class, static function (Event\\Key $event, BufferState $_state) use ($app): void {\n    if ($event->is('ctrl+c')) {\n        $app->stop();\n    }\n});\n\n$app->run(static function (Terminal\\Frame $frame, BufferState $_state): void {\n    $buffer = $frame->buffer();\n\n    \/\/ Direct cell manipulation\n    $buffer->set(0, 0, new Terminal\\Cell('X', [Ansi\\foreground(Color\\red())]));\n    $buffer->setString(0, 1, 'Hello', [Ansi\\foreground(Color\\green()), Style\\bold()]);\n\n    \/\/ Read cells\n    $cell = $buffer->get(0, 0);\n    $grapheme = $cell?->grapheme;\n});\n```\n\nSee [src\/Psl\/Terminal\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/terminal\/src\/Psl\/Terminal\/) for the full API.\n","crypto":"# Crypto\n\nThe `Crypto` component provides a comprehensive cryptography toolkit built on libsodium and OpenSSL. It covers symmetric encryption, asymmetric encryption, digital signatures, AEAD, key exchange, and key derivation -- all through a type-safe API with dedicated key types that prevent misuse.\n\n## Symmetric Encryption\n\n`Crypto\\Symmetric` provides authenticated encryption using XChaCha20-Poly1305. A single shared key encrypts and decrypts. Nonces are managed automatically, so you never have to generate or track them:\n\n```php\nuse Psl\\Crypto\\Symmetric;\nuse Psl\\IO;\n\n$key = Symmetric\\generate_key();\n\n$ciphertext = Symmetric\\seal('Hello, World!', $key);\n$plaintext = Symmetric\\open($ciphertext, $key);\n\nIO\\write_line('Decrypted: %s', $plaintext);\n\n\/\/ Decrypted: Hello, World!\n```\n\n### Additional Authenticated Data\n\nYou can bind extra context to the ciphertext with additional authenticated data (AAD). The AAD is not encrypted, but decryption will fail if it does not match exactly:\n\n```php\nuse Psl\\Crypto\\Exception;\nuse Psl\\Crypto\\Symmetric;\nuse Psl\\IO;\n\n$key = Symmetric\\generate_key();\n\n\/\/ Additional authenticated data (AAD) is authenticated but not encrypted.\n\/\/ Use it for metadata that must be verified alongside the ciphertext.\n$ciphertext = Symmetric\\seal('secret payload', $key, additionalData: 'user-id:42');\n\n\/\/ Decryption succeeds only if the same AAD is provided\n$plaintext = Symmetric\\open($ciphertext, $key, additionalData: 'user-id:42');\nIO\\write_line('Decrypted: %s', $plaintext);\n\n\/\/ Wrong or missing AAD causes decryption to fail\ntry {\n    Symmetric\\open($ciphertext, $key, additionalData: 'user-id:99');\n} catch (Exception\\DecryptionException) {\n    IO\\write_line('Decryption failed: AAD mismatch.');\n}\n```\n\nThis is useful for tying ciphertext to a specific user, session, or record without including that metadata in the encrypted payload.\n\n### Stream Encryption\n\nFor large data or file encryption, the `StreamEncryptor` class provides streaming encryption. Data is processed in chunks so memory usage stays constant regardless of input size:\n\n```php\nuse Psl\\Crypto\\Symmetric;\nuse Psl\\IO;\n\n$key = Symmetric\\generate_key();\n$streamEncryptor = new Symmetric\\StreamEncryptor($key);\n\n\/\/ Encrypt a stream in chunks (useful for large files)\n$source = new IO\\MemoryHandle('This is a large message that will be encrypted in chunks.');\n$encrypted = new IO\\MemoryHandle();\n\n$streamEncryptor->copySealed($source, $encrypted, chunkSize: 4096);\n\n\/\/ Decrypt the stream back\n$encrypted->seek(0);\n$decrypted = new IO\\MemoryHandle();\n$streamEncryptor->copyOpened($encrypted, $decrypted);\n\n$decrypted->seek(0);\nIO\\write_line('Decrypted: %s', $decrypted->readAll());\n```\n\nThe stream format uses XChaCha20-Poly1305 secretstream, which authenticates each chunk individually and detects reordering or truncation.\n\n## Asymmetric Encryption\n\n`Crypto\\Asymmetric` provides public-key encryption using X25519. Each party has a key pair consisting of a secret key and a public key.\n\n### Sealed Boxes (Anonymous Sender)\n\nSealed boxes let you encrypt a message for a recipient using only their public key. The sender remains anonymous -- the recipient cannot determine who sent the message:\n\n```php\nuse Psl\\Crypto\\Asymmetric;\nuse Psl\\IO;\n\n$keyPair = Asymmetric\\generate_key_pair();\n\n\/\/ Sealed boxes: encrypt with just a public key (anonymous sender).\n\/\/ Only the holder of the secret key can decrypt.\n$ciphertext = Asymmetric\\seal('Anonymous tip: the cake is a lie.', $keyPair->publicKey);\n$plaintext = Asymmetric\\open($ciphertext, $keyPair->secretKey, $keyPair->publicKey);\n\nIO\\write_line('Decrypted: %s', $plaintext);\n```\n\nUse sealed boxes when the sender's identity does not need to be verified, such as anonymous feedback or one-way secret submission.\n\n### Authenticated Encryption\n\nWhen both parties have key pairs, `Asymmetric\\encrypt()` provides authenticated encryption. The recipient can verify the message came from the expected sender:\n\n```php\nuse Psl\\Crypto\\Asymmetric;\nuse Psl\\IO;\n\n\/\/ Both parties generate key pairs\n$alice = Asymmetric\\generate_key_pair();\n$bob = Asymmetric\\generate_key_pair();\n\n\/\/ Alice sends an authenticated message to Bob\n$ciphertext = Asymmetric\\encrypt(\n    'Hello Bob, this is Alice.',\n    senderSecretKey: $alice->secretKey,\n    recipientPublicKey: $bob->publicKey,\n);\n\n\/\/ Bob decrypts and verifies it came from Alice\n$plaintext = Asymmetric\\decrypt($ciphertext, recipientSecretKey: $bob->secretKey, senderPublicKey: $alice->publicKey);\n\nIO\\write_line('From Alice: %s', $plaintext);\n```\n\nA random nonce is generated and prepended to the ciphertext automatically, so each message is unique even if the plaintext is the same.\n\n### Encryptor Class\n\nThe `Encryptor` class implements `Crypto\\EncryptorInterface` for sealed-box encryption, useful for dependency injection:\n\n```php\nuse Psl\\Crypto\\Asymmetric;\nuse Psl\\IO;\n\n$keyPair = Asymmetric\\generate_key_pair();\n\n\/\/ The Encryptor class implements the EncryptorInterface for sealed-box encryption.\n\/\/ Useful when you need an object to pass around or inject as a dependency.\n$encryptor = new Asymmetric\\Encryptor($keyPair->secretKey, $keyPair->publicKey);\n\n$ciphertext = $encryptor->seal('Encrypt me');\n$plaintext = $encryptor->open($ciphertext);\n\nIO\\write_line('Decrypted: %s', $plaintext);\n```\n\n## Digital Signatures\n\n`Crypto\\Signing` provides Ed25519 digital signatures. A signature proves that a message was created by the holder of a specific secret key and has not been modified. Unlike HMAC, the verifier only needs the public key, so the signing key is never shared.\n\n### Signing and Verifying\n\n`Signing\\sign()` creates a detached signature, and `Signing\\verify()` checks it against the original message:\n\n```php\nuse Psl\\Crypto\\Signing;\nuse Psl\\IO;\n\n$keyPair = Signing\\generate_key_pair();\n\n$message = 'This message is authentic.';\n$signature = Signing\\sign($message, $keyPair->secretKey);\n\n$valid = Signing\\verify($signature, $message, $keyPair->publicKey);\nIO\\write_line('Signature valid: %s', $valid ? 'yes' : 'no');\n\/\/ Signature valid: yes\n\n$valid = Signing\\verify($signature, 'tampered message', $keyPair->publicKey);\nIO\\write_line('Tampered valid: %s', $valid ? 'yes' : 'no');\n\n\/\/ Tampered valid: no\n```\n\nIf any byte of the message changes, verification fails. The signature does not reveal the message contents.\n\n### Signer and Verifier Classes\n\nThe `Signer` and `Verifier` classes wrap the signing and verification logic. They are useful for dependency injection, letting you separate the signing side (which holds the secret key) from the verification side (which only needs the public key):\n\n```php\nuse Psl\\Crypto\\Signing;\nuse Psl\\IO;\n\n$keyPair = Signing\\generate_key_pair();\n\n\/\/ The Signer and Verifier classes are useful for dependency injection.\n$signer = new Signing\\Signer($keyPair->secretKey);\n$verifier = new Signing\\Verifier($keyPair->publicKey);\n\n$signature = $signer->sign('Important document contents');\n$valid = $verifier->verify($signature, 'Important document contents');\n\nIO\\write_line('Valid: %s', $valid ? 'yes' : 'no');\n```\n\n## AEAD Encryption\n\n`Crypto\\Aead` provides low-level authenticated encryption with associated data. Unlike `Crypto\\Symmetric`, you manage the nonce yourself. This gives you full control but requires care: reusing a nonce with the same key is catastrophic for security.\n\n> **Use `Crypto\\Symmetric` instead** unless you have a specific reason to manage nonces manually. The symmetric API handles nonces automatically and is harder to misuse.\n\n```php\nuse Psl\\Crypto\\Aead;\nuse Psl\\IO;\nuse Psl\\SecureRandom;\n\n$algorithm = Aead\\Algorithm::XChaCha20Poly1305;\n$key = Aead\\generate_key($algorithm);\n\n\/\/ AEAD requires a unique nonce for each message.\n\/\/ Never reuse a nonce with the same key.\n$nonce = SecureRandom\\bytes(24);\n\n$ciphertext = Aead\\encrypt(\n    'Sensitive data',\n    $key,\n    nonce: $nonce,\n    additionalData: 'context-info',\n    algorithm: $algorithm,\n);\n\n$plaintext = Aead\\decrypt($ciphertext, $key, $nonce, 'context-info', $algorithm);\nIO\\write_line('Decrypted: %s', $plaintext);\n```\n\nThe `Aead\\Algorithm` enum supports three constructions:\n\n| Algorithm | Nonce Size | Notes |\n|-----------|-----------|-------|\n| `XChaCha20Poly1305` | 24 bytes | Recommended. Large nonce makes accidental reuse unlikely. |\n| `ChaCha20Poly1305` | 8 bytes | IETF standard. Smaller nonce requires careful management. |\n| `Aes256Gcm` | 12 bytes | Hardware-accelerated on supported CPUs. Not available everywhere. |\n\n## Key Exchange\n\n`Crypto\\KeyExchange` provides X25519 Diffie-Hellman key agreement. Two parties can each combine their own secret key with the other's public key to arrive at the same shared secret, without ever transmitting the secret itself:\n\n```php\nuse Psl\\Crypto\\KeyExchange;\nuse Psl\\IO;\n\n\/\/ Both parties generate key pairs\n$alice = KeyExchange\\generate_key_pair();\n$bob = KeyExchange\\generate_key_pair();\n\n\/\/ Each party computes a shared secret using their secret key and the other's public key\n$aliceShared = KeyExchange\\agree($alice->secretKey, $bob->publicKey);\n$bobShared = KeyExchange\\agree($bob->secretKey, $alice->publicKey);\n\n\/\/ Both arrive at the same shared secret\nIO\\write_line('Secrets match: %s', $aliceShared->bytes === $bobShared->bytes ? 'yes' : 'no');\n\n\/\/ Secrets match: yes\n```\n\nThe shared secret can then be used as input keying material for key derivation to produce session keys.\n\n## Key Derivation\n\nPSL provides two key derivation mechanisms: `Crypto\\Kdf` for deriving subkeys from a master key, and `Crypto\\Hkdf` for deriving keys from arbitrary input keying material using the HMAC-based extract-and-expand pattern (RFC 5869).\n\n### KDF: Subkey Derivation\n\n`Kdf\\derive()` produces deterministic subkeys from a master key. Each subkey is identified by a numeric ID and an 8-byte context string:\n\n```php\nuse Psl\\Crypto\\Kdf;\nuse Psl\\IO;\nuse Psl\\Str\\Byte;\n\n$masterKey = Kdf\\generate_key();\n\n\/\/ Derive subkeys for different purposes using a context string (exactly 8 bytes)\n\/\/ and a numeric subkey ID.\n$encryptionKey = Kdf\\derive($masterKey, subKeyId: 1, context: 'encryptn', length: 32);\n$signingKey = Kdf\\derive($masterKey, subKeyId: 2, context: 'encryptn', length: 32);\n\nIO\\write_line('Encryption key length: %d bytes', Byte\\length($encryptionKey));\nIO\\write_line('Signing key length: %d bytes', Byte\\length($signingKey));\nIO\\write_line('Keys are different: %s', $encryptionKey !== $signingKey ? 'yes' : 'no');\n```\n\nThis is useful when you need multiple keys for different purposes (encryption, signing, tokens) but want to store and manage only a single master key.\n\n### HKDF: Extract and Expand\n\n`Hkdf\\derive()` implements the full HKDF construction from RFC 5869. It takes raw input keying material (such as a shared secret from key exchange) and produces cryptographically strong key material:\n\n```php\nuse Psl\\Crypto\\Hkdf;\nuse Psl\\Hash\\Hmac;\nuse Psl\\IO;\nuse Psl\\Str\\Byte;\n\n\/\/ HKDF (RFC 5869) derives keys from input keying material.\n\/\/ Useful when you have a shared secret from key exchange and need session keys.\n$inputKeyingMaterial = 'raw-shared-secret-from-key-exchange';\n\n\/\/ One-step derivation (extract + expand combined)\n$derivedKey = Hkdf\\derive(\n    inputKeyingMaterial: $inputKeyingMaterial,\n    salt: 'optional-salt',\n    info: 'session-encryption-key',\n    length: 32,\n    algorithm: Hmac\\Algorithm::Sha256,\n);\n\nIO\\write_line('Derived key length: %d bytes', Byte\\length($derivedKey));\n\n\/\/ Two-step derivation for deriving multiple keys from the same PRK\n$prk = Hkdf\\extract($inputKeyingMaterial, salt: 'my-salt');\n$key1 = Hkdf\\expand($prk, info: 'encryption', length: 32);\n$key2 = Hkdf\\expand($prk, info: 'authentication', length: 32);\n\nIO\\write_line('Keys are different: %s', $key1 !== $key2 ? 'yes' : 'no');\n```\n\nThe two-step API (`Hkdf\\extract()` + `Hkdf\\expand()`) is useful when you need to derive multiple keys from the same source material, as you only pay the extraction cost once.\n\nSee [src\/Psl\/Crypto\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/crypto\/src\/Psl\/Crypto\/) for the full API.\n","hash":"# Hash\n\nThe `Hash` component provides cryptographic and non-cryptographic hashing through a type-safe API. It wraps PHP's hash functions with an `Algorithm` enum that prevents typos and invalid algorithm names, and includes timing-safe comparison and HMAC support.\n\n## Hashing Data\n\n`Hash\\hash()` computes a message digest for the given data and algorithm:\n\n```php\nuse Psl\\Hash;\nuse Psl\\IO;\n\n$digest = Hash\\hash('Hello, World!', Hash\\Algorithm::Sha256);\n\/\/ 'dffd6021bb2bd5b0af676290809ec3a53191dd81c7f70a4b28688a362182986f'\nIO\\write_line('SHA-256: %s', $digest);\n\n$md5 = Hash\\hash('Hello, World!', Hash\\Algorithm::Md5);\nIO\\write_line('MD5: %s', $md5);\n```\n\nThe `Hash\\Algorithm` enum covers all algorithms available in PHP, including SHA-1, SHA-256, SHA-512, SHA-3 variants, MD5, CRC32, xxHash, MurmurHash, and many more.\n\n## Comparing Hashes Safely\n\nNever compare hashes with `===`. String comparison leaks timing information that can be exploited to guess hashes byte-by-byte. Use `Hash\\equals()` instead, which runs in constant time:\n\n```php\nuse Psl\\Hash;\nuse Psl\\IO;\n\n$data = 'sensitive payload';\n$expected = Hash\\hash($data, Hash\\Algorithm::Sha256);\n\n$userProvidedHash = $expected; \/\/ simulate correct hash\n\n\/\/ Timing-safe comparison\nif (Hash\\equals($expected, $userProvidedHash)) {\n    IO\\write_line('Hashes match.');\n} else {\n    IO\\write_line('Hashes do not match.');\n}\n```\n\n## Incremental Hashing\n\nFor large data or streaming scenarios, use `Hash\\Context` to feed data in chunks:\n\n```php\nuse Psl\\Hash;\nuse Psl\\IO;\n\n$chunkOne = 'Hello, ';\n$chunkTwo = 'World';\n$chunkThree = '!';\n\n$digest = Hash\\Context::forAlgorithm(Hash\\Algorithm::Sha256)\n    ->update($chunkOne)\n    ->update($chunkTwo)\n    ->update($chunkThree)\n    ->finalize();\n\nIO\\write_line('Incremental SHA-256: %s', $digest);\n```\n\nThe context is immutable -- each `update()` returns a new context, so you can safely branch from any intermediate state.\n\n## HMAC\n\nHMAC (Hash-based Message Authentication Code) combines a hash with a secret key to verify both data integrity and authenticity. Use it when you need to ensure data has not been tampered with and was produced by someone who holds the key.\n\n```php\nuse Psl\\Hash\\Hmac;\nuse Psl\\IO;\n\n$message = 'Hello, HMAC!';\n$secretKey = 'my-secret-key-for-signing';\n\n$signature = Hmac\\hash(data: $message, algorithm: Hmac\\Algorithm::Sha256, key: $secretKey);\n\nIO\\write_line('HMAC-SHA256: %s', $signature);\n```\n\nA practical example -- signing and verifying an API request:\n\n```php\nuse Psl\\Hash;\nuse Psl\\Hash\\Hmac;\nuse Psl\\IO;\nuse Psl\\SecureRandom;\n\n\/**\n * Simulate an API secret key (in practice, this should be stored securely and not hardcoded)\n * For demonstration purposes, we generate a random 32-byte string to use as the API secret key.\n *\/\n$apiSecret = SecureRandom\\string(32);\n\n\/\/ Sender: sign the payload\n$payload = '{\"action\":\"transfer\",\"amount\":100}';\n$signature = Hmac\\hash($payload, Hmac\\Algorithm::Sha256, $apiSecret);\nIO\\write_line('Signature: %s', $signature);\n\n\/\/ Receiver: verify the signature\n$receivedSignature = $signature; \/\/ simulate receiving the same signature\n$expected = Hmac\\hash($payload, Hmac\\Algorithm::Sha256, $apiSecret);\nif (!Hash\\equals($expected, $receivedSignature)) {\n    throw new RuntimeException('Invalid signature -- request may have been tampered with.');\n}\n\nIO\\write_line('Signature verified successfully.');\n```\n\nHMAC also supports incremental hashing through `Hash\\Context::hmac()`:\n\n```php\nuse Psl\\Hash;\nuse Psl\\IO;\n\n$key = 'my-hmac-secret-key';\n$headerBytes = 'Content-Type: application\/json';\n$bodyBytes = '{\"user\":\"alice\",\"action\":\"login\"}';\n\n$digest = Hash\\Context::hmac(Hash\\Hmac\\Algorithm::Sha256, $key)\n    ->update($headerBytes)\n    ->update($bodyBytes)\n    ->finalize();\n\nIO\\write_line('Incremental HMAC: %s', $digest);\n```\n\nSee [src\/Psl\/Hash\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/hash\/src\/Psl\/Hash\/) for the full API.\n","password":"# Password\n\nThe `Password` component provides secure password hashing and verification. It wraps PHP's `password_*` functions with a type-safe `Algorithm` enum and a clean functional API, making it easy to hash passwords with bcrypt or Argon2 and handle algorithm upgrades over time.\n\n## Hashing a Password\n\n```php\nuse Psl\\IO;\nuse Psl\\Password;\n\n$plaintext = 'my-secret-password';\n\n\/\/ Uses the default algorithm (currently bcrypt, may change in future PHP versions)\n$hash = Password\\hash($plaintext);\nIO\\write_line('Default hash: %s', $hash);\n\n\/\/ Specify an algorithm explicitly\n$bcryptHash = Password\\hash($plaintext, Password\\Algorithm::Bcrypt);\nIO\\write_line('Bcrypt hash: %s', $bcryptHash);\n```\n\nYou can tune algorithm parameters through the `$options` array:\n\n```php\nuse Psl\\IO;\nuse Psl\\Password;\n\n$plaintext = 'my-secret-password';\n\n\/\/ Bcrypt with a higher cost factor (default is 10)\n$hash = Password\\hash($plaintext, Password\\Algorithm::Bcrypt, ['cost' => 14]);\nIO\\write_line('Bcrypt (cost 14): %s', $hash);\n```\n\n## Verifying a Password\n\n`verify()` checks a plaintext password against a stored hash. The algorithm and salt are embedded in the hash itself, so you do not need to store them separately:\n\n```php\nuse Psl\\IO;\nuse Psl\\Password;\n\n$plaintext = 'my-secret-password';\n$storedHash = Password\\hash($plaintext, Password\\Algorithm::Bcrypt);\n\nif (Password\\verify($plaintext, $storedHash)) {\n    IO\\write_line('Password is correct.');\n} else {\n    IO\\write_line('Password is incorrect.');\n}\n```\n\n## Checking If a Rehash Is Needed\n\nWhen you upgrade your hashing algorithm or increase the cost factor, existing hashes remain valid but are no longer up to your current standard. `needs_rehash()` detects this so you can transparently upgrade hashes at login time:\n\n```php\nuse Psl\\IO;\nuse Psl\\Password;\n\n$plaintext = 'my-secret-password';\n$storedHash = Password\\hash($plaintext, Password\\Algorithm::Bcrypt);\n\nif (Password\\verify($plaintext, $storedHash)) {\n    IO\\write_line('Password is correct.');\n\n    \/\/ Check if the hash needs upgrading\n    if (Password\\needs_rehash($storedHash, Password\\Algorithm::Bcrypt, ['cost' => 14])) {\n        $newHash = Password\\hash($plaintext, Password\\Algorithm::Bcrypt, ['cost' => 14]);\n        IO\\write_line('Hash upgraded: %s', $newHash);\n        \/\/ store $newHash in the database\n    } else {\n        IO\\write_line('Hash is up to date.');\n    }\n}\n```\n\nThis pattern lets you migrate from bcrypt to Argon2id (or increase cost parameters) gradually, without forcing all users to reset their passwords.\n\n## Inspecting a Hash\n\n`get_information()` returns the algorithm and options used to create a hash:\n\n```php\nuse Psl\\IO;\nuse Psl\\Password;\n\n$hash = Password\\hash('my-secret-password', Password\\Algorithm::Bcrypt);\n\n$info = Password\\get_information($hash);\nIO\\write_line('Algorithm: %s', $info['algorithm']->name);\nIO\\write_line('Cost: %d', $info['options']['cost'] ?? '<unknown>');\n```\n\n## Algorithm\n\nThe `Password\\Algorithm` enum provides four cases:\n\n- `Default` -- follows PHP's default, which may change over time to adopt stronger algorithms\n- `Bcrypt` -- Blowfish-based, always produces 60-character hashes\n- `Argon2i` -- memory-hard algorithm resistant to GPU attacks\n- `Argon2id` -- hybrid of Argon2i and Argon2d, recommended for most applications\n\nWhen using `Algorithm::Default`, store hashes in a column that can hold at least 255 characters, since the underlying algorithm (and hash length) may change in future PHP versions.\n\nSee [src\/Psl\/Password\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/password\/src\/Psl\/Password\/) for the full API.\n","pseudo-random":"# PseudoRandom\n\nThe `PseudoRandom` component provides fast pseudo-random number generation using PHP's Mersenne Twister engine (`mt_rand`). It is appropriate for non-security contexts such as shuffling, sampling, simulations, or any case where speed matters more than cryptographic guarantees.\n\n> **Important**: Do not use `PseudoRandom` for tokens, passwords, keys, or anything security-related. Use `SecureRandom` instead.\n\n## Usage\n\n### Random Integers\n\nGenerate a pseudo-random integer within a range:\n\n```php\nuse Psl\\IO;\nuse Psl\\PseudoRandom;\n\n$roll = PseudoRandom\\int(1, 6);\nIO\\write_line('Dice roll: %d', $roll);\n\n\/\/ Full 64-bit range by default\n$value = PseudoRandom\\int();\nIO\\write_line('Random value: %d', $value);\n```\n\n### Random Floats\n\nGenerate a pseudo-random float between 0.0 and 1.0:\n\n```php\nuse Psl\\IO;\nuse Psl\\PseudoRandom;\n\n$chance = PseudoRandom\\float();\nIO\\write_line('Random chance: %f', $chance);\n\nif ($chance < 0.3) {\n    IO\\write_line('Hit the 30%% probability branch!');\n} else {\n    IO\\write_line('Missed the 30%% probability branch.');\n}\n```\n\n## When to Use PseudoRandom vs SecureRandom\n\n| Use case | Component |\n|---|---|\n| Dice rolls, shuffling, sampling | `PseudoRandom` |\n| Simulation \/ Monte Carlo | `PseudoRandom` |\n| API tokens, session IDs | `SecureRandom` |\n| Passwords, encryption keys | `SecureRandom` |\n| Nonces, CSRF tokens | `SecureRandom` |\n\nSee [src\/Psl\/PseudoRandom\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/pseudo-random\/src\/Psl\/PseudoRandom\/) for the full API.\n","random-sequence":"# RandomSequence\n\nThe `RandomSequence` component provides object-oriented random number sequences behind a common `SequenceInterface`. This is useful when you need to inject a random source as a dependency, swap implementations for testing, or produce reproducible sequences from a known seed.\n\n## The Interface\n\nEvery sequence implements `SequenceInterface` with a single method:\n\n```php\nuse Psl\\IO;\nuse Psl\\RandomSequence\\SecureSequence;\nuse Psl\\RandomSequence\\SequenceInterface;\n\n\/** @var SequenceInterface $sequence *\/\n$sequence = new SecureSequence();\n$a = $sequence->next(); \/\/ next random int\n$b = $sequence->next(); \/\/ another random int\n\nIO\\write_line('First: %d', $a);\nIO\\write_line('Second: %d', $b);\n```\n\n## Implementations\n\n### MersenneTwisterSequence\n\nA seedable Mersenne Twister (MT19937) PRNG. Given the same seed, it always produces the same sequence, making it ideal for reproducible simulations, procedural generation, and deterministic tests:\n\n```php\nuse Psl\\IO;\nuse Psl\\RandomSequence\\MersenneTwisterSequence;\n\n$seq = new MersenneTwisterSequence(seed: 42);\n\n$first = $seq->next(); \/\/ always the same for seed 42\n$second = $seq->next(); \/\/ deterministic\n\nIO\\write_line('First (seed 42): %d', $first);\nIO\\write_line('Second (seed 42): %d', $second);\n```\n\n### MersenneTwisterPHPVariantSequence\n\nA variant that matches PHP's internal `mt_rand` twist behavior. Use this when you need compatibility with sequences generated by PHP's built-in Mersenne Twister:\n\n```php\nuse Psl\\IO;\nuse Psl\\RandomSequence\\MersenneTwisterPHPVariantSequence;\n\n$seq = new MersenneTwisterPHPVariantSequence(seed: 42);\n\n$first = $seq->next();\n$second = $seq->next();\n\nIO\\write_line('PHP variant first (seed 42): %d', $first);\nIO\\write_line('PHP variant second (seed 42): %d', $second);\n```\n\n### SecureSequence\n\nA cryptographically secure sequence backed by `SecureRandom\\int()`. Use this in production when security matters:\n\n```php\nuse Psl\\IO;\nuse Psl\\RandomSequence\\SecureSequence;\n\n$seq = new SecureSequence();\n$value = $seq->next(); \/\/ cryptographically secure random int\n\nIO\\write_line('Secure random: %d', $value);\n```\n\n## Dependency Injection\n\nThe shared interface makes it easy to swap implementations. Use `MersenneTwisterSequence` in tests for reproducibility and `SecureSequence` in production:\n\n```php\nuse Psl\\IO;\nuse Psl\\Iter;\nuse Psl\\RandomSequence\\MersenneTwisterSequence;\nuse Psl\\RandomSequence\\SecureSequence;\nuse Psl\\RandomSequence\\SequenceInterface;\n\n\/**\n * Picks a random winner from the list of participants using the provided RNG.\n *\n * @param non-empty-list<non-empty-string> $participants\n *\n * @return non-empty-string The name of the winner.\n *\/\nfunction pick_winner(array $participants, SequenceInterface $rng): string\n{\n    \/** @var int<0, max> $index *\/\n    $index = $rng->next() % Iter\\count($participants);\n\n    return $participants[$index];\n}\n\n\/\/ Deterministic for tests\n$testRng = new MersenneTwisterSequence(seed: 42);\n$winner = pick_winner(['Alice', 'Bob', 'Charlie'], $testRng);\nIO\\write_line('Test winner: %s', $winner);\n\n\/\/ Secure for production\n$prodRng = new SecureSequence();\n$winner = pick_winner(['Alice', 'Bob', 'Charlie'], $prodRng);\nIO\\write_line('Production winner: %s', $winner);\n```\n\nSee [src\/Psl\/RandomSequence\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/random-sequence\/src\/Psl\/RandomSequence\/) for the full API.\n","secure-random":"# SecureRandom\n\nThe `SecureRandom` component provides cryptographically secure random data generation. It wraps PHP's `random_bytes()` and `random_int()` with a consistent API and typed exceptions, making it suitable for security-sensitive tasks like token generation, password creation, and nonce generation.\n\n## Usage\n\n### Random Integers\n\nGenerate a secure random integer within a range:\n\n```php\nuse Psl\\IO;\nuse Psl\\SecureRandom;\n\n$id = SecureRandom\\int(1, 1_000_000);\nIO\\write_line('Random ID: %d', $id);\n\n\/\/ Full 64-bit range by default\n$big = SecureRandom\\int();\nIO\\write_line('Random big int: %d', $big);\n```\n\n### Random Floats\n\nGenerate a secure random float between 0.0 and 1.0:\n\n```php\nuse Psl\\IO;\nuse Psl\\SecureRandom;\n\n$probability = SecureRandom\\float();\nIO\\write_line('Random float: %f', $probability);\n```\n\n### Random Bytes\n\nGenerate raw random bytes, useful for cryptographic keys or binary tokens:\n\n```php\nuse Psl\\IO;\nuse Psl\\SecureRandom;\n\n$key = SecureRandom\\bytes(32); \/\/ 32 random bytes for an AES-256 key\nIO\\write_line('Key length: %d bytes', strlen($key));\nIO\\write_line('Key (hex): %s', bin2hex($key));\n\n$iv = SecureRandom\\bytes(16); \/\/ 16 random bytes for an IV\nIO\\write_line('IV (hex): %s', bin2hex($iv));\n```\n\n### Random Strings\n\nGenerate a random string from an alphabet. Defaults to alphanumeric characters:\n\n```php\nuse Psl\\IO;\nuse Psl\\SecureRandom;\n\n\/\/ 32-character alphanumeric token\n$token = SecureRandom\\string(32);\nIO\\write_line('Token: %s', $token);\n\n\/\/ Hex string\n$hex = SecureRandom\\string(16, '0123456789abcdef');\nIO\\write_line('Hex: %s', $hex);\n\n\/\/ Numeric code (e.g. for SMS verification)\n$code = SecureRandom\\string(6, '0123456789');\nIO\\write_line('Code: %s', $code);\n```\n\n## Error Handling\n\nAll functions throw `SecureRandom\\Exception\\InsufficientEntropyException` if the system cannot gather enough entropy, and `SecureRandom\\Exception\\InvalidArgumentException` for invalid arguments (such as `$min > $max` for `int()`).\n\nSee [src\/Psl\/SecureRandom\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/secure-random\/src\/Psl\/SecureRandom\/) for the full API.\n","date-time":"# DateTime\n\nThe `DateTime` component provides immutable, timezone-aware date and time types. It replaces PHP's mutable `DateTime` class with a design where every operation returns a new instance, eliminating an entire class of mutation bugs.\n\nThe component is built around several core types: `DateTime` for calendar-aware dates, `Timestamp` for raw points in time, `Duration` for exact time spans, `Period` for calendar-based periods, and `Interval` for time ranges.\n\n## Creating Dates\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$now = DateTime\\DateTime::now();\nIO\\write_line('Now: %s', $now->toRfc3339());\n\n$tokyo = DateTime\\DateTime::now(DateTime\\Timezone::AsiaTokyo);\nIO\\write_line('Tokyo: %s', $tokyo->toRfc3339());\n\n\/\/ From individual components\n$birthday = DateTime\\DateTime::fromParts(DateTime\\Timezone::AmericaNewYork, 1990, DateTime\\Month::March, 15, 14, 30, 0);\nIO\\write_line('Birthday: %s', $birthday->toRfc3339());\n\n\/\/ A specific time today\n$meeting = DateTime\\DateTime::todayAt(9, 0, timezone: DateTime\\Timezone::EuropeLondon);\nIO\\write_line('Meeting: %s', $meeting->toRfc3339());\n```\n\n## Timestamps\n\nA `Timestamp` represents a precise point in time as seconds and nanoseconds since the Unix epoch, independent of any timezone:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$ts = DateTime\\Timestamp::now();\nIO\\write_line('Seconds since epoch: %d', $ts->getSeconds());\nIO\\write_line('Nanoseconds: %d', $ts->getNanoseconds());\n\n$specific = DateTime\\Timestamp::fromParts(1_700_000_000, 500_000_000);\n\n\/\/ Create from milliseconds or microseconds\n$fromMs = DateTime\\Timestamp::fromMilliseconds(1_700_000_000_500);\n$fromUs = DateTime\\Timestamp::fromMicroseconds(1_700_000_000_500_000);\n\n$dt = DateTime\\DateTime::fromTimestamp($ts, DateTime\\Timezone::UTC);\nIO\\write_line('From timestamp: %s', $dt->toRfc3339());\n```\n\nUse `Timestamp::monotonic()` for duration measurements -- it uses a monotonic clock unaffected by system time adjustments.\n\n## Duration and Arithmetic\n\n`Duration` represents an exact time span (hours, minutes, seconds, nanoseconds). All values are normalized automatically:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$twoHours = DateTime\\Duration::hours(2);\n$timeout = DateTime\\Duration::seconds(30);\n$precise = DateTime\\Duration::milliseconds(1500); \/\/ normalizes to 1s 500ms\n\n$now = DateTime\\DateTime::now(DateTime\\Timezone::UTC);\n\n\/\/ Add or subtract durations from dates\n$later = $now->plus(DateTime\\Duration::hours(3));\n$earlier = $now->minus(DateTime\\Duration::hours(7 * 24));\n\n\/\/ Convenience methods\n$tomorrow = $now->plusDays(1);\n$nextMonth = $now->plusMonths(1);\n$lastYear = $now->minusYears(1);\n\nIO\\write_line('Now: %s', $now->toRfc3339());\nIO\\write_line('3 hours later: %s', $later->toRfc3339());\nIO\\write_line('7 days earlier: %s', $earlier->toRfc3339());\nIO\\write_line('Tomorrow: %s', $tomorrow->toRfc3339());\nIO\\write_line('Next month: %s', $nextMonth->toRfc3339());\nIO\\write_line('Last year: %s', $lastYear->toRfc3339());\n\n\/\/ Measure elapsed time\n$start = DateTime\\Timestamp::now();\n$end = DateTime\\Timestamp::now();\n$elapsed = $end->since($start); \/\/ returns Duration\nIO\\write_line('Elapsed: %f seconds', $elapsed->getTotalSeconds());\n\n\/\/ ISO 8601 format\n$duration = DateTime\\Duration::fromParts(2, 30, 15);\nIO\\write_line('ISO 8601: %s', $duration->toIso8601()); \/\/ PT2H30M15S\n$parsed = DateTime\\Duration::fromIso8601('PT1H45M');\nIO\\write_line('Parsed: %s', $parsed->toString());\n```\n\n## Period\n\n`Period` represents a calendar-based period (years, months, days). Unlike `Duration`, a period's actual time length depends on context - a month can be 28-31 days, and a day can be 23-25 hours due to DST. Months automatically normalize into years, but days are never normalized:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n\/\/ Create periods from calendar units\n$oneYear = DateTime\\Period::years(1);\n$sixMonths = DateTime\\Period::months(6);\n$twoWeeks = DateTime\\Period::weeks(2); \/\/ 14 days\n$tenDays = DateTime\\Period::days(10);\n\n\/\/ Months automatically normalize into years\n$period = DateTime\\Period::months(14); \/\/ 1 year, 2 months\nIO\\write_line('14 months = %s', $period->toString());\n\n\/\/ Days are never normalized (a day is not a fixed number of hours)\n$longPeriod = DateTime\\Period::days(365);\nIO\\write_line('365 days = %s', $longPeriod->toString());\n\n\/\/ Combine parts\n$mixed = DateTime\\Period::fromParts(1, 6, 15);\nIO\\write_line('Mixed: %s', $mixed->toString());\n\n\/\/ Arithmetic\n$a = DateTime\\Period::fromParts(1, 6, 0);\n$b = DateTime\\Period::fromParts(0, 8, 15);\nIO\\write_line('Sum: %s', $a->plus($b)->toString());\nIO\\write_line('Difference: %s', $a->minus($b)->toString());\nIO\\write_line('Inverted: %s', $a->invert()->toString());\n\n\/\/ Calculate the period between two dates\n$start = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2024, 3, 15);\n$end = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 7, 20);\n$between = DateTime\\Period::between($start, $end);\nIO\\write_line('Between: %s', $between->toString()); \/\/ 1 year(s), 4 month(s), 5 day(s)\n\n\/\/ ISO 8601 format\nIO\\write_line('ISO 8601: %s', $mixed->toIso8601()); \/\/ P1Y6M15D\n$parsed = DateTime\\Period::fromIso8601('P2Y3M10D');\nIO\\write_line('Parsed: %s', $parsed->toString());\n```\n\n## Interval\n\n`Interval` represents a range between two points in time. It can check containment, overlap, and compute the exact duration between its endpoints:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n\/\/ An Interval is a range between two points in time\n$start = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 1, 1);\n$end = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 12, 31, 23, 59, 59);\n$interval = DateTime\\Interval::between($start, $end);\n\nIO\\write_line('Interval: %s', $interval->toString());\n\n\/\/ Create from a start point and a duration\n$hourInterval = DateTime\\Interval::from(DateTime\\Timestamp::now(), DateTime\\Duration::hours(1));\nIO\\write_line('One hour from now: %s', $hourInterval->toString());\n\n\/\/ Get the exact time duration between start and end\n$duration = $interval->getDuration();\nIO\\write_line('Duration: %s', $duration->toString());\n\n\/\/ Check if a point falls within the interval\n$mid = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 6, 15);\n$outside = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2026, 1, 1);\n\nIO\\write_line('Contains mid-year: %s', $interval->contains($mid) ? 'yes' : 'no');\nIO\\write_line('Contains next year: %s', $interval->contains($outside) ? 'yes' : 'no');\n\n\/\/ Check if two intervals overlap and get their intersection\n$q1 = DateTime\\Interval::between(\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 1, 1),\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 3, 31),\n);\n$q2 = DateTime\\Interval::between(\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 3, 1),\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 6, 30),\n);\n\nIO\\write_line('Q1 overlaps Q2: %s', $q1->overlaps($q2) ? 'yes' : 'no');\n\n$intersection = $q1->intersection($q2);\nif (null !== $intersection) {\n    IO\\write_line('Intersection: %s', $intersection->toString());\n}\n\n\/\/ Check if one interval fully contains another\nIO\\write_line('Full year contains Q1: %s', $interval->containsInterval($q1) ? 'yes' : 'no');\nIO\\write_line('Q1 contains full year: %s', $q1->containsInterval($interval) ? 'yes' : 'no');\n\n\/\/ Merge overlapping intervals\n$merged = $q1->merge($q2);\nIO\\write_line('Merged Q1+Q2: %s', $merged->toString());\n\n\/\/ Find the gap between non-overlapping intervals\n$spring = DateTime\\Interval::between(\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 3, 1),\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 5, 31),\n);\n$autumn = DateTime\\Interval::between(\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 9, 1),\n    DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 11, 30),\n);\n\n$gap = $spring->gap($autumn);\nif (null !== $gap) {\n    IO\\write_line('Gap between spring and autumn: %s', $gap->toString());\n}\n\n\/\/ ISO 8601 format\nIO\\write_line('ISO 8601: %s', $interval->toIso8601());\n$parsed = DateTime\\Interval::fromIso8601('2025-01-01T00:00:00Z\/2025-12-31T23:59:59Z');\nIO\\write_line('Parsed: %s', $parsed->toString());\n```\n\n## Convenience Methods\n\n`DateTime` provides convenience methods for common boundary operations:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$dt = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, 6, 15, 14, 30, 45);\n\n\/\/ Start and end of day\n$startOfDay = $dt->atStartOfDay();\nIO\\write_line('Start of day: %s', $startOfDay->toRfc3339()); \/\/ 2025-06-15T00:00:00+00:00\n\n$endOfDay = $dt->atEndOfDay();\nIO\\write_line('End of day: %s', $endOfDay->toRfc3339()); \/\/ 2025-06-15T23:59:59.999999999+00:00\n\n\/\/ Start and end of month\n$startOfMonth = $dt->atStartOfMonth();\nIO\\write_line('Start of month: %s', $startOfMonth->toRfc3339()); \/\/ 2025-06-01T00:00:00+00:00\n\n$endOfMonth = $dt->atEndOfMonth();\nIO\\write_line('End of month: %s', $endOfMonth->toRfc3339()); \/\/ 2025-06-30T23:59:59.999999999+00:00\n\n\/\/ Start and end of year\n$startOfYear = $dt->atStartOfYear();\nIO\\write_line('Start of year: %s', $startOfYear->toRfc3339()); \/\/ 2025-01-01T00:00:00+00:00\n\n$endOfYear = $dt->atEndOfYear();\nIO\\write_line('End of year: %s', $endOfYear->toRfc3339()); \/\/ 2025-12-31T23:59:59.999999999+00:00\n\n\/\/ Start and end of week (Monday-Sunday)\n$startOfWeek = $dt->atStartOfWeek();\nIO\\write_line('Start of week: %s', $startOfWeek->toRfc3339()); \/\/ 2025-06-09T00:00:00+00:00\n\n$endOfWeek = $dt->atEndOfWeek();\nIO\\write_line('End of week: %s', $endOfWeek->toRfc3339()); \/\/ 2025-06-15T23:59:59.999999999+00:00\n\n\/\/ Useful for date range queries\n$feb = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2024, 2, 15);\nIO\\write_line('Feb 2024 ends: day %d', $feb->atEndOfMonth()->getDay()); \/\/ 29 (leap year)\n```\n\n## Comparing and Inspecting\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$a = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, DateTime\\Month::January, 1);\n$b = DateTime\\DateTime::fromParts(DateTime\\Timezone::UTC, 2025, DateTime\\Month::June, 15);\n\nIO\\write_line('a before b: %s', $a->before($b) ? 'yes' : 'no'); \/\/ true\nIO\\write_line('b after a: %s', $b->after($a) ? 'yes' : 'no'); \/\/ true\nIO\\write_line('a same time as a: %s', $a->atTheSameTime($a) ? 'yes' : 'no'); \/\/ true\nIO\\write_line('a between a and b: %s', $a->betweenTimeInclusive($a, $b) ? 'yes' : 'no'); \/\/ true\n\n\/\/ Inspect components\nIO\\write_line('Year: %d', $a->getYear());\nIO\\write_line('Month: %s', $a->getMonthEnum()->name);\nIO\\write_line('Weekday: %s', $a->getWeekday()->name);\nIO\\write_line('Leap year: %s', $a->isLeapYear() ? 'yes' : 'no');\nIO\\write_line('DST: %s', $a->isDaylightSavingTime() ? 'yes' : 'no');\n```\n\n## Formatting and Parsing\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$dt = DateTime\\DateTime::now(DateTime\\Timezone::UTC);\n\n\/\/ ICU pattern\nIO\\write_line('ICU: %s', $dt->format('yyyy-MM-dd HH:mm:ss'));\n\n\/\/ Predefined patterns\nIO\\write_line('ISO 8601: %s', $dt->format(DateTime\\FormatPattern::Iso8601));\nIO\\write_line('SQL: %s', $dt->format(DateTime\\FormatPattern::SqlDateTime));\n\n\/\/ Style-based (locale-aware)\nIO\\write_line('Long\/Short: %s', $dt->toString(DateTime\\DateStyle::Long, DateTime\\TimeStyle::Short));\n\n\/\/ RFC 3339 for APIs\nIO\\write_line('RFC 3339: %s', $dt->toRfc3339());\n\n\/\/ Parsing\n$parsed = DateTime\\DateTime::parse('2025-03-15 12:00:00', 'yyyy-MM-dd HH:mm:ss', DateTime\\Timezone::UTC);\nIO\\write_line('Parsed: %s', $parsed->toRfc3339());\n```\n\n## Timezone Conversion\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$utc = DateTime\\DateTime::now(DateTime\\Timezone::UTC);\n$la = $utc->convertToTimezone(DateTime\\Timezone::AmericaLosAngeles);\n\n\/\/ Same moment, different local time\nIO\\write_line('UTC: %s', $utc->toRfc3339());\nIO\\write_line('LA:  %s', $la->toRfc3339());\nIO\\write_line('Same time: %s', $utc->atTheSameTime($la) ? 'yes' : 'no');\n```\n\n## Interoperability\n\n`DateTime` converts to and from PHP's `DateTimeImmutable` and ICU's `IntlCalendar`:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\n\n$native = new \\DateTimeImmutable('2025-03-15 12:00:00', new \\DateTimeZone('UTC'));\n$dt = DateTime\\DateTime::fromStdlib($native);\n$back = $dt->toStdlib(); \/\/ DateTimeImmutable\n\nIO\\write_line('From stdlib: %s', $dt->toRfc3339());\nIO\\write_line('Back to stdlib: %s', $back->format('Y-m-d H:i:s T'));\n```\n\nSee [src\/Psl\/DateTime\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/date-time\/src\/Psl\/DateTime\/) for the full API.\n","env":"# Env\n\nThe `Env` component provides functions for inspecting and modifying the process environment. It covers environment variables, the current working directory, temporary paths, command-line arguments, and `PATH` manipulation.\n\n## Usage\n\n### Environment Variables\n\nRead, write, and remove environment variables for the current process:\n\n```php\nuse Psl\\Env;\nuse Psl\\IO;\n\n\/\/ Read -- returns null if not set\n$home = Env\\get_var('HOME');\nIO\\write_line('HOME: %s', $home ?? '(not set)');\n\n\/\/ Write\nEnv\\set_var('APP_ENV', 'production');\nIO\\write_line('APP_ENV: %s', Env\\get_var('APP_ENV') ?? '(not set)');\n\n\/\/ Remove\nEnv\\remove_var('APP_ENV');\nIO\\write_line('APP_ENV after remove: %s', Env\\get_var('APP_ENV') ?? '(not set)');\n\n\/\/ Get all environment variables as an associative array\n$allVars = Env\\get_vars();\nIO\\write_line('Total env vars: %d', count($allVars));\n```\n\nKeys containing `=` or the NUL character are rejected with an `InvariantViolationException`.\n\n### Working Directory\n\n```php\nuse Psl\\Env;\nuse Psl\\IO;\n\n$cwd = Env\\current_dir();\nIO\\write_line('Current directory: %s', $cwd);\n```\n\n### System Paths\n\n```php\nuse Psl\\Env;\nuse Psl\\IO;\n\n$tmp = Env\\temp_dir();\nIO\\write_line('Temp directory: %s', $tmp);\n```\n\n### Command-Line Arguments and Executable Path\n\n```php\nuse Psl\\Env;\nuse Psl\\IO;\n\n$args = Env\\args();\nIO\\write_line('Arguments: %s', implode(', ', $args));\n\n$binary = Env\\current_exec();\nIO\\write_line('Executable: %s', $binary);\n```\n\n### PATH Manipulation\n\nSplit and join PATH-style strings using the platform's path separator (`:` on Unix, `;` on Windows):\n\n```php\nuse Psl\\Env;\nuse Psl\\IO;\n\n$dirs = Env\\split_paths('\/usr\/local\/bin:\/usr\/bin:\/bin');\nIO\\write_line('Split paths: %s', implode(', ', $dirs));\n\n$path = Env\\join_paths('\/usr\/local\/bin', '\/usr\/bin', '\/bin');\nIO\\write_line('Joined path: %s', $path);\n```\n\nSee [src\/Psl\/Env\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/env\/src\/Psl\/Env\/) for the full API.\n","locale":"# Locale\n\nThe `Locale` component provides a backed enum containing 700+ locale identifiers (such as `en_US`, `fr_FR`, `ja_JP`). Using an enum instead of raw strings eliminates typos, enables IDE autocompletion, and makes locale parameters type-safe throughout your application.\n\n## Usage\n\n### Selecting a Locale\n\nPick a locale by name -- every case maps to its standard locale string:\n\n```php\nuse Psl\\IO;\nuse Psl\\Locale\\Locale;\n\n$locale = Locale::EnglishUnitedStates; \/\/ 'en_US'\nIO\\write_line('en_US: %s', $locale->value);\n\n$locale = Locale::FrenchFrance; \/\/ 'fr_FR'\nIO\\write_line('fr_FR: %s', $locale->value);\n\n$locale = Locale::Japanese; \/\/ 'ja'\nIO\\write_line('ja: %s', $locale->value);\n\n$locale = Locale::ChineseSimplified; \/\/ 'zh_Hans'\nIO\\write_line('zh_Hans: %s', $locale->value);\n```\n\n### Default Locale\n\n`Locale::default()` reads the locale configured via PHP's `intl.default_locale` setting. If no locale is configured or the configured value is not recognized, it falls back to `Locale::English`:\n\n```php\nuse Psl\\IO;\nuse Psl\\Locale\\Locale;\n\n$locale = Locale::default();\nIO\\write_line('Default locale: %s', $locale->value);\n```\n\n### Inspecting a Locale\n\nEach locale instance exposes methods to extract its parts:\n\n```php\nuse Psl\\IO;\nuse Psl\\Locale\\Locale;\n\n$locale = Locale::FrenchCanada;\n\nIO\\write_line('Value: %s', $locale->value); \/\/ 'fr_CA'\nIO\\write_line('Language: %s', $locale->getLanguage()); \/\/ 'fr'\nIO\\write_line('Region: %s', $locale->getRegion() ?? '(none)'); \/\/ 'CA'\nIO\\write_line('Display name: %s', $locale->getDisplayName()); \/\/ 'French (Canada)'\nIO\\write_line('Display language: %s', $locale->getDisplayLanguage()); \/\/ 'French'\nIO\\write_line('Display region: %s', $locale->getDisplayRegion() ?? '(none)'); \/\/ 'Canada'\nIO\\write_line('Has region: %s', $locale->hasRegion() ? 'yes' : 'no'); \/\/ true\nIO\\write_line('Has script: %s', $locale->hasScript() ? 'yes' : 'no'); \/\/ false\n```\n\nScript-based locales also work:\n\n```php\nuse Psl\\IO;\nuse Psl\\Locale\\Locale;\n\n$locale = Locale::SerbianLatin;\n\nIO\\write_line('Script: %s', $locale->getScript() ?? '(none)'); \/\/ 'Latn'\nIO\\write_line('Has script: %s', $locale->hasScript() ? 'yes' : 'no'); \/\/ true\n```\n\n### Integration with DateTime\n\nThe `Locale` enum is used by PSL's `DateTime` formatting to produce locale-aware output:\n\n```php\nuse Psl\\DateTime;\nuse Psl\\IO;\nuse Psl\\Locale\\Locale;\n\n$now = DateTime\\DateTime::now();\n$formatted = $now->format('EEEE, MMMM d', locale: Locale::GermanGermany);\nIO\\write_line('German date: %s', $formatted);\n```\n\nSee [src\/Psl\/Locale\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/locale\/src\/Psl\/Locale\/) for the full API.\n","os":"# OS\n\nThe `OS` component provides type-safe operating system detection. Instead of comparing raw strings against `PHP_OS_FAMILY`, you work with the `OperatingSystemFamily` enum and convenience functions.\n\n## Usage\n\n### Detecting the OS Family\n\n```php\nuse Psl\\IO;\nuse Psl\\OS;\n\n$family = OS\\family();\nIO\\write_line('OS Family: %s', $family->name);\n```\n\n### Convenience Checks\n\nQuick boolean checks for the most common platforms:\n\n```php\nuse Psl\\IO;\nuse Psl\\OS;\n\nif (OS\\is_windows()) {\n    IO\\write_line('Running on Windows.');\n}\n\nif (OS\\is_darwin()) {\n    IO\\write_line('Running on macOS.');\n}\n\nif (!OS\\is_windows() && !OS\\is_darwin()) {\n    IO\\write_line('Running on Linux or another platform.');\n}\n```\n\n### The OperatingSystemFamily Enum\n\nThe enum covers six families: `Windows`, `BSD`, `Darwin`, `Solaris`, `Linux`, and `Unknown`. You can match against it for exhaustive platform handling:\n\n```php\nuse Psl\\IO;\nuse Psl\\OS\\OperatingSystemFamily;\n\n$result = match (OperatingSystemFamily::default()) {\n    OperatingSystemFamily::Windows => 'Configured for Windows',\n    OperatingSystemFamily::Darwin => 'Configured for macOS',\n    OperatingSystemFamily::Linux => 'Configured for Linux',\n    OperatingSystemFamily::BSD => 'Configured for BSD',\n    default => 'Using default configuration',\n};\n\nIO\\write_line('%s', $result);\n```\n\n`OperatingSystemFamily::default()` returns the family for the current runtime, making it useful as a dependency injection default.\n\nSee [src\/Psl\/OS\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/os\/src\/Psl\/OS\/) for the full API.\n","runtime":"# Runtime\n\nThe `Runtime` component provides introspection into the PHP runtime environment. It exposes version information, loaded extensions, the active SAPI, and build flags through simple function calls.\n\n## Usage\n\n### PHP Version\n\n```php\nuse Psl\\IO;\nuse Psl\\Runtime;\n\n$version = Runtime\\get_version();\nIO\\write_line('PHP version: %s', $version);\n\n$id = Runtime\\get_version_id();\nIO\\write_line('Version ID: %d', $id);\n\n$details = Runtime\\get_version_details();\nIO\\write_line('Major: %d, Minor: %d, Release: %d', $details['major'], $details['minor'], $details['release']);\n```\n\n### Server API (SAPI)\n\nDetermine how PHP is being invoked:\n\n```php\nuse Psl\\IO;\nuse Psl\\Runtime;\n\n$sapi = Runtime\\get_sapi();\nIO\\write_line('SAPI: %s', $sapi);\n```\n\n### Extensions\n\nCheck for loaded extensions or list them all:\n\n```php\nuse Psl\\IO;\nuse Psl\\Runtime;\n\nif (Runtime\\has_extension('mbstring')) {\n    IO\\write_line('mbstring is available.');\n}\n\n$extensions = Runtime\\get_extensions();\nIO\\write_line('Loaded extensions: %d', count($extensions));\n\n$zendExtensions = Runtime\\get_zend_extensions();\nIO\\write_line('Zend extensions: %d', count($zendExtensions));\n```\n\n### Zend Engine\n\n```php\nuse Psl\\IO;\nuse Psl\\Runtime;\n\n$zendVersion = Runtime\\get_zend_version();\nIO\\write_line('Zend Engine version: %s', $zendVersion);\n```\n\n### Build Flags\n\n```php\nuse Psl\\IO;\nuse Psl\\Runtime;\n\nIO\\write_line('Debug build: %s', Runtime\\is_debug() ? 'yes' : 'no');\nIO\\write_line('Thread safe: %s', Runtime\\is_thread_safe() ? 'yes' : 'no');\n```\n\nSee [src\/Psl\/Runtime\/](https:\/\/github.com\/php-standard-library\/php-standard-library\/tree\/next\/packages\/runtime\/src\/Psl\/Runtime\/) for the full API.\n","cache":"# Cache\n\nThe `Cache` component provides an async-safe in-memory LRU cache with per-key atomicity. It prevents cache stampedes in concurrent fiber envi
